<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caça-Glitches do Caine 🔨 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #24072b 0%, #08020d 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            touch-action: manipulation;
        }
        .topbar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            border: 2px solid #ffcc00;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.18);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.84rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .arena-card {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #140724;
            border: 3px solid #ff2a5f;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 0 38px rgba(255, 42, 95, 0.35);
            overflow: hidden;
        }
        .holes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            aspect-ratio: 1 / 1;
        }
        .hole {
            background: radial-gradient(circle at center, #05010a 0%, #1d0c36 100%);
            border: 3px solid #9333ea;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, border-color 0.15s;
        }
        .hole.active {
            border-color: #ffcc00;
            box-shadow: 0 0 22px rgba(255, 204, 0, 0.45);
            transform: scale(1.04);
        }
        .hole-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.72rem;
            color: #ffcc00;
            margin-top: 2px;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(12, 4, 24, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.9rem;
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .btn-start {
            background: linear-gradient(135deg, #ffcc00, #ff2a5f);
            color: #090312;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ HUB</a>
        <div class="stat-pill">TEMPO: <strong id="hud-time">30s</strong></div>
        <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
        <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
    </div>

    <div class="arena-card">
        <div class="holes-grid" id="holes-grid"></div>

        <div class="overlay" id="whack-overlay">
            <h1>🔨 CAÇA-GLITCHES DO CAINE</h1>
            <p id="whack-desc">
                Toque rápido nos portais quando aparecerem os <strong>Glitches 👾 (+30)</strong>, a <strong>Bolha 🫧 (+50)</strong> ou <strong>Relógios ⏱️ (+4s)</strong>! Cuidado para não bater na <strong>Pomni 🤡 (-40)</strong>!
            </p>
            <button class="btn-start" id="btn-start-whack">COMEÇAR CAÇADA 🎪</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const gridEl = document.getElementById('holes-grid');
        const hudTime = document.getElementById('hud-time');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('whack-overlay');
        const whackDesc = document.getElementById('whack-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('glitchhunt', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 500, dur = 0.08, type = 'triangle') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.1, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        const TARGETS = [
            { emoji: '👾', label: 'GLITCH +30', pts: 30, weight: 5 },
            { emoji: '🫧', label: 'BOLHA +50', pts: 50, weight: 3 },
            { emoji: '⏱️', label: '+3 SEG', pts: 20, timeBonus: 3, weight: 1.5 },
            { emoji: '🤡', label: 'POMNI! -40', pts: -40, isFriend: true, weight: 2 }
        ];

        let holes = Array.from({ length: 9 }, () => null);
        let score = 0;
        let timeLeft = 30;
        let running = false;
        let spawnTimer = null;
        let clockTimer = null;

        function buildGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const d = document.createElement('div');
                d.className = 'hole';
                d.addEventListener('pointerdown', () => whackHole(i));
                gridEl.appendChild(d);
            }
        }

        function renderHoles() {
            const els = gridEl.children;
            for (let i = 0; i < 9; i++) {
                const h = holes[i];
                const el = els[i];
                if (h) {
                    el.className = 'hole active';
                    el.innerHTML = `<span>${h.emoji}</span><span class="hole-label">${h.label}</span>`;
                } else {
                    el.className = 'hole';
                    el.innerHTML = '';
                }
            }
            hudScore.innerText = score;
            hudTime.innerText = `${timeLeft}s`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('glitchhunt', { highScore: bestScore }, playerName);
            }
        }

        function pickRandomTarget() {
            const total = TARGETS.reduce((s, t) => s + t.weight, 0);
            let r = Math.random() * total;
            for (const t of TARGETS) {
                if (r < t.weight) return { ...t };
                r -= t.weight;
            }
            return { ...TARGETS[0] };
        }

        function spawnStep() {
            if (!running) return;
            holes = Array(9).fill(null);
            const count = 2 + (Math.random() < 0.45 ? 1 : 0);
            for (let c = 0; c < count; c++) {
                const idx = Math.floor(Math.random() * 9);
                holes[idx] = pickRandomTarget();
            }
            renderHoles();
        }

        function whackHole(idx) {
            if (!running || !holes[idx]) return;
            const t = holes[idx];
            holes[idx] = null;
            score = Math.max(0, score + t.pts);
            if (t.timeBonus) timeLeft += t.timeBonus;
            sfx(t.isFriend ? 170 : 660, 0.1, t.isFriend ? 'sawtooth' : 'triangle');
            renderHoles();
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            running = true;
            overlay.classList.add('hidden');
            spawnStep();

            clearInterval(spawnTimer);
            clearInterval(clockTimer);
            spawnTimer = setInterval(spawnStep, 780);
            clockTimer = setInterval(() => {
                timeLeft--;
                renderHoles();
                if (timeLeft <= 0) {
                    running = false;
                    clearInterval(spawnTimer);
                    clearInterval(clockTimer);
                    holes = Array(9).fill(null);
                    renderHoles();
                    whackDesc.innerHTML = `🎪 <strong>FIM DA CAÇADA!</strong><br>Você capturou <strong>${score} PTS</strong> em Glitches no Circo!`;
                    overlay.classList.remove('hidden');
                }
            }, 1000);
        }

        document.getElementById('btn-start-whack').addEventListener('click', startGame);
        buildGrid();
    </script>
</body>
</html>
