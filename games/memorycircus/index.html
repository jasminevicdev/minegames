<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b071e">
    <title>Memória do Circo Digital — JasDEV Game Hub 🃏🎪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body {
            background: radial-gradient(circle at top, #1f1147, #090518);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .game-shell {
            width: 100%;
            max-width: 960px;
            background: rgba(15, 11, 38, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.12);
        }
        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 3px 12px rgba(255, 204, 0, 0.4);
        }
        .stats-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label { font-size: 0.65rem; color: #94a3b8; }
        .stat-val { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.15rem; color: #00f5d4; }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .diff-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-diff {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-diff.active {
            background: linear-gradient(135deg, #ff2a5f, #7000ff);
            border-color: #ffcc00;
            color: #fff;
        }
        .btn-hub {
            background: linear-gradient(135deg, #00d2ff, #4f46e5);
            color: #fff;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid #ffcc00;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            perspective: 1000px;
        }
        .cards-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
        @media (max-width: 600px) {
            .cards-grid, .cards-grid.cols-5 { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        }
        .mem-card {
            aspect-ratio: 3 / 3.4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.42s cubic-bezier(0.2, 0.85, 0.4, 1.15);
            cursor: pointer;
        }
        .mem-card.flipped, .mem-card.matched {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 3px solid rgba(255, 255, 255, 0.25);
        }
        .card-back {
            background: linear-gradient(135deg, #2b1055, #ff2a5f);
            border-color: #ffcc00;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }
        .card-back-logo {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }
        .card-front {
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            border-color: #00f5d4;
            transform: rotateY(180deg);
        }
        .mem-card.matched .card-front {
            border-color: #00e676;
            box-shadow: 0 0 22px rgba(0, 230, 118, 0.55);
            background: radial-gradient(circle at top, #064e3b, #0f172a);
        }
        .card-canvas {
            width: 78%;
            height: 72%;
            object-fit: contain;
        }
        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            font-weight: 900;
            color: #ffcc00;
            margin-top: 2px;
        }
        .win-banner {
            margin-top: 18px;
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 210, 255, 0.2));
            border: 2px solid #00e676;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .win-banner.hidden { display: none; }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="top-header">
            <div>
                <h1 class="brand-title">🃏 MEMÓRIA DO CIRCO DIGITAL</h1>
                <span id="player-badge" style="font-size:0.85rem; color:#00f5d4;">JOGADOR: JAS</span>
            </div>

            <div class="stats-row">
                <div class="stat-pill">
                    <span class="stat-label">PONTOS</span>
                    <span id="stat-score" class="stat-val">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">COMBO</span>
                    <span id="stat-combo" class="stat-val" style="color:#ffcc00;">1x</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">JOGADAS</span>
                    <span id="stat-moves" class="stat-val" style="color:#ff2a85;">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">RECORDE</span>
                    <span id="stat-best" class="stat-val" style="color:#00e676;">0</span>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="diff-group">
                <button class="btn-diff active" data-pairs="6">🌟 Fácil (12)</button>
                <button class="btn-diff" data-pairs="8">🔥 Médio (16)</button>
                <button class="btn-diff" data-pairs="10">👑 Mestre (20)</button>
                <button class="btn-diff" id="btn-reset" style="border-color:#00f5d4; color:#00f5d4;">🔄 Reiniciar</button>
            </div>
            <a href="../../index.html" class="btn-hub">🏠 VOLTAR AO HUB</a>
        </div>

        <div id="cards-grid" class="cards-grid"></div>

        <div id="win-banner" class="win-banner hidden">
            <h2 style="font-family:'Outfit',sans-serif; color:#00e676; margin-bottom:6px;">🎉 PARABÉNS! MEMÓRIA DE MESTRE! 🏆</h2>
            <p id="win-text" style="margin-bottom:12px; color:#e2e8f0;"></p>
            <button id="btn-play-again" class="btn-hub" style="cursor:pointer;">JOGAR NOVAMENTE 🚀</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        import { Player2D } from '../circus/src/Player2D.js';

        const activePlayer = SaveHub.getActivePlayer() || { name: 'JOGADOR' };
        document.getElementById('player-badge').innerText = `JOGADOR: ${activePlayer.name.toUpperCase()}`;
        const saved = SaveHub.getGameSave('memorycircus', activePlayer.name);
        let highScore = saved.highScore || 0;
        document.getElementById('stat-best').innerText = highScore;

        let audioCtx = null;
        function playChime(freq, dur = 0.12) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        const ALL_DECK = [
            { id: 'pomni', label: 'POMNI', type: 'char' },
            { id: 'jax', label: 'JAX', type: 'char' },
            { id: 'kinger', label: 'KINGER', type: 'char' },
            { id: 'gangle', label: 'GANGLE', type: 'char' },
            { id: 'zooble', label: 'ZOOBLE', type: 'char' },
            { id: 'caine', label: 'CAINE', type: 'char' },
            { id: 'bubble', label: 'BOLHA', type: 'char' },
            { id: 'hat', label: 'CARTOLA', type: 'emoji', icon: '🎩' },
            { id: 'dice', label: 'DADO NEON', type: 'emoji', icon: '🎲' },
            { id: 'crown', label: 'COROA REAL', type: 'emoji', icon: '👑' }
        ];

        let numPairs = 6;
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let score = 0;
        let combo = 1;
        let lockBoard = false;

        const gridEl = document.getElementById('cards-grid');
        const winBanner = document.getElementById('win-banner');

        function initGame() {
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            score = 0;
            combo = 1;
            lockBoard = false;
            winBanner.classList.add('hidden');
            updateHUD();

            gridEl.classList.toggle('cols-5', numPairs === 10);
            gridEl.innerHTML = '';

            const subset = ALL_DECK.slice(0, numPairs);
            const deck = [...subset, ...subset].sort(() => Math.random() - 0.5);

            deck.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'mem-card';
                card.dataset.id = item.id;

                const back = document.createElement('div');
                back.className = 'card-face card-back';
                back.innerHTML = `<div class="card-back-logo">🎪</div>`;

                const front = document.createElement('div');
                front.className = 'card-face card-front';

                if (item.type === 'char') {
                    const c = document.createElement('canvas');
                    c.width = 160; c.height = 160;
                    c.className = 'card-canvas';
                    Player2D.drawCharacterOnCanvas(c, item.id);
                    front.appendChild(c);
                } else {
                    const ico = document.createElement('div');
                    ico.style.fontSize = '3rem';
                    ico.innerText = item.icon;
                    front.appendChild(ico);
                }

                const title = document.createElement('div');
                title.className = 'card-title';
                title.innerText = item.label;
                front.appendChild(title);

                card.appendChild(back);
                card.appendChild(front);

                card.addEventListener('click', () => onCardClick(card));
                gridEl.appendChild(card);
            });
        }

        function onCardClick(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            playChime(520, 0.08);
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                lockBoard = true;
                const [c1, c2] = flippedCards;

                if (c1.dataset.id === c2.dataset.id) {
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    matchedPairs++;
                    score += 150 * combo;
                    combo++;
                    flippedCards = [];
                    lockBoard = false;
                    playChime(780, 0.16);
                    updateHUD();

                    if (matchedPairs === numPairs) {
                        handleVictory();
                    }
                } else {
                    combo = 1;
                    updateHUD();
                    setTimeout(() => {
                        c1.classList.remove('flipped');
                        c2.classList.remove('flipped');
                        flippedCards = [];
                        lockBoard = false;
                        playChime(240, 0.12);
                    }, 700);
                }
            }
        }

        function handleVictory() {
            if (score > highScore) {
                highScore = score;
                document.getElementById('stat-best').innerText = highScore;
                SaveHub.updateGameSave('memorycircus', { highScore }, activePlayer.name);
            }
            document.getElementById('win-text').innerText = `Você encontrou todos os ${numPairs} pares em ${moves} jogadas e fez ${score} pontos!`;
            winBanner.classList.remove('hidden');
            playChime(980, 0.3);
        }

        function updateHUD() {
            document.getElementById('stat-score').innerText = score;
            document.getElementById('stat-combo').innerText = `${combo}x`;
            document.getElementById('stat-moves').innerText = moves;
        }

        document.querySelectorAll('.btn-diff[data-pairs]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-diff[data-pairs]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                numPairs = parseInt(btn.dataset.pairs, 10);
                initGame();
            });
        });

        document.getElementById('btn-reset').addEventListener('click', initGame);
        document.getElementById('btn-play-again').addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
