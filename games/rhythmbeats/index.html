<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritmo do Circo (Music Beats) 🎵 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #1f0836 0%, #070210 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        .topbar {
            width: 96vw;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            border: 2px solid #00f5d4;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .stage-wrap {
            position: relative;
            width: 94vw;
            max-width: 500px;
            height: 78vh;
            max-height: 700px;
            background: #0a0418;
            border: 3px solid #ff2a85;
            border-radius: 22px;
            box-shadow: 0 0 38px rgba(255, 42, 133, 0.35);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 4, 24, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #00f5d4;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .btn-start {
            background: linear-gradient(135deg, #00f5d4, #ff2a85);
            color: #070210;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ HUB</a>
        <div class="stat-pill">COMBO: <strong id="hud-combo">0x</strong></div>
        <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
        <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
    </div>

    <div class="stage-wrap">
        <canvas id="rhythm-canvas" width="480" height="720"></canvas>
        <div class="overlay" id="rhythm-overlay">
            <h1>🎵 RITMO DO CIRCO</h1>
            <p id="rhythm-desc">
                Toque nas 4 pistas iluminadas (ou pressione <strong>D, F, J, K</strong> / <strong>Setas</strong>) quando as notas neon cruzarem a linha dourada!
            </p>
            <button class="btn-start" id="btn-start-rhythm">SOLTAR O SOM 🎹✨</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('rhythm-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudCombo = document.getElementById('hud-combo');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('rhythm-overlay');
        const rhythmDesc = document.getElementById('rhythm-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('rhythmbeats', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
        let melodyIdx = 0;

        function playMelodyNote(isMiss = false) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = isMiss ? 'sawtooth' : 'triangle';
                const freq = isMiss ? 130 : SCALE[melodyIdx % SCALE.length];
                if (!isMiss) melodyIdx++;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.14, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.16);
            } catch (e) {}
        }

        const LANES = [
            { color: '#ff2a85', label: 'D / ⬅️' },
            { color: '#00f5d4', label: 'F / ⬇️' },
            { color: '#ffcc00', label: 'J / ⬆️' },
            { color: '#a855f7', label: 'K / ➡️' }
        ];
        const HIT_Y = H - 105;

        let running = false;
        let score = 0;
        let combo = 0;
        let misses = 0;
        let notes = [];
        let feedback = '';
        let feedbackTimer = 0;
        let spawnTimer = 0;
        let laneFlash = [0, 0, 0, 0];

        function startGame() {
            score = 0;
            combo = 0;
            misses = 0;
            notes = [];
            spawnTimer = 20;
            updateHud();
            overlay.classList.add('hidden');
            running = true;
            playMelodyNote();
        }

        function updateHud() {
            hudCombo.innerText = `${combo}x`;
            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('rhythmbeats', { highScore: bestScore, maxCombo: combo }, playerName);
            }
        }

        function triggerLane(laneIdx) {
            if (!running) return;
            laneFlash[laneIdx] = 1;

            // Find closest note in lane near HIT_Y
            let targetIdx = -1;
            let bestDist = 999;
            notes.forEach((n, idx) => {
                if (n.lane === laneIdx) {
                    const d = Math.abs(n.y - HIT_Y);
                    if (d < bestDist) {
                        bestDist = d;
                        targetIdx = idx;
                    }
                }
            });

            if (targetIdx !== -1 && bestDist <= 75) {
                notes.splice(targetIdx, 1);
                combo++;
                const isPerfect = bestDist <= 28;
                const mult = Math.min(4, 1 + Math.floor(combo / 10));
                score += (isPerfect ? 50 : 30) * mult;
                feedback = isPerfect ? '✨ PERFEITO!' : '🔥 ÓTIMO!';
                feedbackTimer = 25;
                playMelodyNote(false);
                updateHud();
            }
        }

        function update() {
            if (!running) return;
            if (feedbackTimer > 0) feedbackTimer--;
            for (let i = 0; i < 4; i++) {
                if (laneFlash[i] > 0) laneFlash[i] = Math.max(0, laneFlash[i] - 0.1);
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                const lane = Math.floor(Math.random() * 4);
                notes.push({ lane, y: -30, speed: 5.8 + Math.min(4, score / 1500) });
                spawnTimer = Math.max(18, 36 - Math.floor(score / 800));
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                notes[i].y += notes[i].speed;
                if (notes[i].y > H + 30) {
                    notes.splice(i, 1);
                    combo = 0;
                    misses++;
                    feedback = '❌ ERROU!';
                    feedbackTimer = 25;
                    playMelodyNote(true);
                    updateHud();
                    if (misses >= 6) {
                        running = false;
                        rhythmDesc.innerHTML = `🎵 <strong>FIM DO SHOW MUSICAL!</strong><br>Você marcou <strong>${score} PTS</strong> no Ritmo do Circo!`;
                        overlay.classList.remove('hidden');
                        return;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0418';
            ctx.fillRect(0, 0, W, H);

            const lw = W / 4;
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.strokeRect(i * lw, 0, lw, H);

                if (laneFlash[i] > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${laneFlash[i] * 0.2})`;
                    ctx.fillRect(i * lw, 0, lw, H);
                }

                // Hit receptor
                ctx.save();
                ctx.strokeStyle = LANES[i].color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(i * lw + 12, HIT_Y - 18, lw - 24, 36, 12);
                ctx.stroke();
                ctx.font = '700 13px Outfit';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'center';
                ctx.fillText(LANES[i].label, i * lw + lw / 2, H - 35);
                ctx.restore();
            }

            // Notes
            for (const n of notes) {
                const col = LANES[n.lane].color;
                ctx.save();
                ctx.fillStyle = col;
                ctx.shadowColor = col;
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.roundRect(n.lane * lw + 16, n.y - 16, lw - 32, 32, 10);
                ctx.fill();
                ctx.restore();
            }

            if (feedbackTimer > 0) {
                ctx.font = '900 32px Fredoka';
                ctx.fillStyle = '#ffcc00';
                ctx.textAlign = 'center';
                ctx.fillText(feedback, W / 2, 110);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'd' || e.key === 'ArrowLeft') triggerLane(0);
            if (k === 'f' || e.key === 'ArrowDown') triggerLane(1);
            if (k === 'j' || e.key === 'ArrowUp') triggerLane(2);
            if (k === 'k' || e.key === 'ArrowRight') triggerLane(3);
        });

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const lane = Math.min(3, Math.max(0, Math.floor(mx / (W / 4))));
            triggerLane(lane);
        });

        document.getElementById('btn-start-rhythm').addEventListener('click', startGame);
        loop();
    </script>
</body>
</html>
