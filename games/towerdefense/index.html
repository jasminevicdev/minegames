<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardiões do Circo (Tower Defense) 🏰 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at center, #18082b 0%, #070312 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .topbar {
            width: 96vw;
            max-width: 1020px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffcc00;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .btn-back:hover { background: #ffcc00; color: #090414; }
        .hud-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .stage-wrap {
            position: relative;
            width: 96vw;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #110926;
            border: 3px solid #ff2a5f;
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(255, 42, 95, 0.3);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }
        .toolbar {
            width: 96vw;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding-top: 8px;
            flex-wrap: wrap;
        }
        .tower-btn {
            background: rgba(20, 12, 40, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            border-radius: 14px;
            padding: 7px 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .tower-btn.active {
            border-color: #ffcc00;
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.28), rgba(255, 42, 95, 0.28));
            transform: translateY(-2px);
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 5, 24, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.7rem, 4vw, 2.8rem);
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            max-width: 540px;
            font-size: 0.95rem;
            margin-bottom: 18px;
            line-height: 1.45;
        }
        .btn-start {
            background: linear-gradient(135deg, #ffcc00, #ff2a5f);
            color: #090314;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div class="hud-stats">
            <div class="stat-pill">MOEDAS: <strong id="hud-gold">150 💰</strong></div>
            <div class="stat-pill">VIDAS DA TENDA: <strong id="hud-lives">15 ❤️</strong></div>
            <div class="stat-pill">ONDA: <strong id="hud-wave">1</strong></div>
            <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
        </div>
    </div>

    <div class="stage-wrap">
        <canvas id="td-canvas" width="1280" height="720"></canvas>
        <div class="overlay" id="td-overlay">
            <h1>🏰 GUARDIÕES DO CIRCO</h1>
            <p id="td-desc">
                Proteja a Grande Tenda do Circo Digital contra os Monstros Abstraídos! Clique ou toque nas bases circulares brilhantes para construir ou evoluir suas torres mágicas!
            </p>
            <button class="btn-start" id="btn-start-td">DEFENDER A TENDA 🎪</button>
        </div>
    </div>

    <div class="toolbar">
        <button class="tower-btn active" data-type="cannon">🎉 Canhão de Confete (50 💰)</button>
        <button class="tower-btn" data-type="ice">❄️ Torre de Gelo (75 💰)</button>
        <button class="tower-btn" data-type="laser">⚡ Raio de Caine (110 💰)</button>
        <button class="tower-btn" data-type="upgrade">⬆️ Evoluir Torre (+60 💰)</button>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('td-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudGold = document.getElementById('hud-gold');
        const hudLives = document.getElementById('hud-lives');
        const hudWave = document.getElementById('hud-wave');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('td-overlay');
        const tdDesc = document.getElementById('td-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('towerdefense', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 440, dur = 0.08, type = 'sine', vol = 0.09) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(vol, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        const pathPoints = [
            { x: 0, y: 170 },
            { x: 310, y: 170 },
            { x: 310, y: 520 },
            { x: 640, y: 520 },
            { x: 640, y: 200 },
            { x: 960, y: 200 },
            { x: 960, y: 500 },
            { x: 1220, y: 500 }
        ];

        const padCoords = [
            { x: 180, y: 280 }, { x: 430, y: 260 }, { x: 480, y: 410 },
            { x: 200, y: 480 }, { x: 760, y: 330 }, { x: 790, y: 530 },
            { x: 830, y: 110 }, { x: 1080, y: 340 }
        ];

        const TOWER_SPECS = {
            cannon: { cost: 50, range: 195, rate: 36, dmg: 24, color: '#ffcc00', icon: '🎉' },
            ice: { cost: 75, range: 175, rate: 45, dmg: 14, slow: 0.5, color: '#00f5d4', icon: '❄️' },
            laser: { cost: 110, range: 240, rate: 22, dmg: 20, color: '#ff2a85', icon: '⚡' }
        };

        let selectedTool = 'cannon';
        document.querySelectorAll('.tower-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedTool = btn.dataset.type;
            });
        });

        let running = false;
        let gold = 150;
        let lives = 15;
        let wave = 1;
        let score = 0;
        let pads = [];
        let enemies = [];
        let bullets = [];
        let particles = [];
        let spawnRemaining = 0;
        let spawnTimer = 0;

        function initGame() {
            gold = 160;
            lives = 15;
            wave = 1;
            score = 0;
            pads = padCoords.map(c => ({ x: c.x, y: c.y, tower: null }));
            enemies = [];
            bullets = [];
            particles = [];
            startWave(1);
            updateHud();
            overlay.classList.add('hidden');
            running = true;
            sfx(520, 0.14, 'triangle');
        }

        function startWave(w) {
            wave = w;
            spawnRemaining = 6 + w * 3;
            spawnTimer = 30;
            updateHud();
        }

        function spawnEnemy() {
            const isBoss = spawnRemaining === 1 && wave % 3 === 0;
            const maxHp = (isBoss ? 260 : 55) + wave * (isBoss ? 95 : 22);
            enemies.push({
                x: pathPoints[0].x,
                y: pathPoints[0].y,
                wp: 1,
                hp: maxHp,
                maxHp,
                speed: isBoss ? 1.35 : (1.85 + Math.min(1.5, wave * 0.08)),
                slowTimer: 0,
                isBoss,
                r: isBoss ? 28 : 18,
                reward: isBoss ? 45 : 15
            });
        }

        function updateHud() {
            hudGold.innerText = `${gold} 💰`;
            hudLives.innerText = `${lives} ❤️`;
            hudWave.innerText = wave;
            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('towerdefense', { highScore: bestScore, bestWave: wave }, playerName);
            }
        }

        function addBurst(x, y, color, n = 12) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1.5 + Math.random() * 4.5;
                particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!running) return;
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const my = ((e.clientY - rect.top) / rect.height) * H;

            for (const pad of pads) {
                if (Math.hypot(mx - pad.x, my - pad.y) <= 38) {
                    if (selectedTool === 'upgrade') {
                        if (pad.tower && gold >= 60) {
                            gold -= 60;
                            pad.tower.level++;
                            pad.tower.dmg = Math.round(pad.tower.dmg * 1.45);
                            pad.tower.range += 18;
                            addBurst(pad.x, pad.y, '#ffcc00', 20);
                            sfx(740, 0.12, 'triangle');
                            updateHud();
                        }
                    } else if (!pad.tower) {
                        const spec = TOWER_SPECS[selectedTool];
                        if (spec && gold >= spec.cost) {
                            gold -= spec.cost;
                            pad.tower = {
                                type: selectedTool,
                                level: 1,
                                cooldown: 0,
                                ...spec
                            };
                            addBurst(pad.x, pad.y, spec.color, 18);
                            sfx(600, 0.1, 'square');
                            updateHud();
                        }
                    } else if (pad.tower && gold >= 60) {
                        // Clicking existing tower also upgrades it if affordable
                        gold -= 60;
                        pad.tower.level++;
                        pad.tower.dmg = Math.round(pad.tower.dmg * 1.45);
                        pad.tower.range += 18;
                        addBurst(pad.x, pad.y, '#ffcc00', 20);
                        sfx(740, 0.12, 'triangle');
                        updateHud();
                    }
                    break;
                }
            }
        });

        function update() {
            if (!running) return;

            if (spawnRemaining > 0) {
                spawnTimer--;
                if (spawnTimer <= 0) {
                    spawnEnemy();
                    spawnRemaining--;
                    spawnTimer = Math.max(22, 52 - wave * 2);
                }
            } else if (enemies.length === 0) {
                gold += 35;
                score += wave * 100;
                startWave(wave + 1);
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.slowTimer > 0) e.slowTimer--;
                const spd = e.slowTimer > 0 ? e.speed * 0.5 : e.speed;
                const target = pathPoints[e.wp];
                const dx = target.x - e.x;
                const dy = target.y - e.y;
                const dist = Math.hypot(dx, dy);

                if (dist <= spd) {
                    e.x = target.x;
                    e.y = target.y;
                    e.wp++;
                    if (e.wp >= pathPoints.length) {
                        lives -= e.isBoss ? 3 : 1;
                        enemies.splice(i, 1);
                        sfx(180, 0.2, 'sawtooth');
                        updateHud();
                        if (lives <= 0) {
                            running = false;
                            tdDesc.innerHTML = `🎪 <strong>FIM DE DEFESA NA ONDA ${wave}!</strong><br>Você alcançou <strong>${score} PTS</strong> protegendo o Circo Digital!`;
                            overlay.classList.remove('hidden');
                            return;
                        }
                    }
                } else {
                    e.x += (dx / dist) * spd;
                    e.y += (dy / dist) * spd;
                }
            }

            // Towers fire
            for (const pad of pads) {
                const t = pad.tower;
                if (!t) continue;
                if (t.cooldown > 0) t.cooldown--;
                if (t.cooldown <= 0) {
                    let target = null;
                    let bestProgress = -1;
                    for (const e of enemies) {
                        const d = Math.hypot(e.x - pad.x, e.y - pad.y);
                        if (d <= t.range && e.wp > bestProgress) {
                            bestProgress = e.wp;
                            target = e;
                        }
                    }
                    if (target) {
                        t.cooldown = t.rate;
                        bullets.push({
                            x: pad.x,
                            y: pad.y,
                            target,
                            dmg: t.dmg,
                            slow: t.slow || 0,
                            color: t.color,
                            speed: 11
                        });
                        sfx(460, 0.04, 'sine', 0.05);
                    }
                }
            }

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!enemies.includes(b.target)) {
                    bullets.splice(i, 1);
                    continue;
                }
                const dx = b.target.x - b.x;
                const dy = b.target.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist <= b.speed + b.target.r) {
                    b.target.hp -= b.dmg;
                    if (b.slow) b.target.slowTimer = 90;
                    addBurst(b.target.x, b.target.y, b.color, 6);
                    if (b.target.hp <= 0) {
                        gold += b.target.reward;
                        score += b.target.isBoss ? 150 : 30;
                        addBurst(b.target.x, b.target.y, '#ff2a5f', 22);
                        enemies.splice(enemies.indexOf(b.target), 1);
                        sfx(300, 0.08, 'triangle');
                        updateHud();
                    }
                    bullets.splice(i, 1);
                } else {
                    b.x += (dx / dist) * b.speed;
                    b.y += (dy / dist) * b.speed;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#110926';
            ctx.fillRect(0, 0, W, H);

            // Checkerboard circus floor subtle pattern
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
            for (let x = 0; x < W; x += 80) {
                for (let y = 0; y < H; y += 80) {
                    if (((x + y) / 80) % 2 === 0) ctx.fillRect(x, y, 80, 80);
                }
            }

            // Draw path
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(255, 42, 95, 0.35)';
            ctx.lineWidth = 64;
            ctx.beginPath();
            pathPoints.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
            ctx.stroke();

            ctx.strokeStyle = '#261447';
            ctx.lineWidth = 52;
            ctx.stroke();
            ctx.restore();

            // Circus Tent Goal at end of path
            const endPt = pathPoints[pathPoints.length - 1];
            ctx.font = '54px serif';
            ctx.textAlign = 'center';
            ctx.fillText('🎪', endPt.x, endPt.y + 18);

            // Draw pads & towers
            for (const pad of pads) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(pad.x, pad.y, 32, 0, Math.PI * 2);
                ctx.fillStyle = pad.tower ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 245, 212, 0.12)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = pad.tower ? pad.tower.color : 'rgba(0, 245, 212, 0.45)';
                ctx.stroke();

                if (pad.tower) {
                    ctx.font = '28px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(pad.tower.icon, pad.x, pad.y + 10);
                    ctx.font = '700 13px Outfit';
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillText(`Nv.${pad.tower.level}`, pad.x, pad.y - 36);
                } else {
                    ctx.font = '700 18px Outfit';
                    ctx.fillStyle = 'rgba(0, 245, 212, 0.6)';
                    ctx.textAlign = 'center';
                    ctx.fillText('+', pad.x, pad.y + 6);
                }
                ctx.restore();
            }

            // Draw enemies (Abstracted Monsters)
            for (const e of enemies) {
                ctx.save();
                ctx.fillStyle = e.slowTimer > 0 ? '#00bbf9' : '#0a0514';
                ctx.strokeStyle = e.isBoss ? '#ffcc00' : '#ff2a5f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Glowing eyes
                ctx.fillStyle = '#ff2a5f';
                ctx.beginPath();
                ctx.arc(e.x - 6, e.y - 4, 4, 0, Math.PI * 2);
                ctx.arc(e.x + 6, e.y - 4, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(e.x, e.y + 5, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // HP Bar
                const bw = e.r * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(e.x - e.r, e.y - e.r - 12, bw, 6);
                ctx.fillStyle = '#00f5d4';
                ctx.fillRect(e.x - e.r, e.y - e.r - 12, bw * Math.max(0, e.hp / e.maxHp), 6);
                ctx.restore();
            }

            // Bullets
            for (const b of bullets) {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Particles
            for (const p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('btn-start-td').addEventListener('click', initGame);
        loop();
    </script>
</body>
</html>
