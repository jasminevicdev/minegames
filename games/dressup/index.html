        function playGlamourSound(freq = 640, type = 'triangle', dur = 0.16) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(freq * 1.45, audioCtx.currentTime + dur);
                g.gain.setValueAtTime(0.11, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        let currentThemeIdx = 0;

        document.getElementById('btn-runway').addEventListener('click', () => {

            currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;

        });

        function drawStar(cx, cy, spikes, outerR, innerR, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            const step = Math.PI / spikes;
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerR);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerR;
                y = cy + Math.sin(rot) * outerR;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerR;
                y = cy + Math.sin(rot) * innerR;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawScene() {
            tick++;
            const breathe = Math.sin(tick * 0.05) * 2.5;
            const isBlinking = (tick % 190) > 182;

            const bg = CATALOG.bg[state.bg];
            const dress = CATALOG.dress[state.dress];
            const hair = CATALOG.hair[state.hair];
            const make = CATALOG.makeup[state.makeup];
            const shoes = CATALOG.shoes[state.shoes];
            const crown = CATALOG.crown[state.crown];
            const bag = CATALOG.bag[state.bag];
            const wings = CATALOG.wings[state.wings];

            // 1. Rich Stage Background
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, bg.c1);
            grad.addColorStop(1, bg.c2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Ornamental Palace Arches & Curtains
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.arc(W / 2, 230, 210, Math.PI, 0);
            ctx.lineTo(W / 2 + 210, H);
            ctx.lineTo(W / 2 - 210, H);
            ctx.closePath();
            ctx.fill();

            // Stage Spotlights
            ctx.save();
            const spot = ctx.createLinearGradient(W / 2, 0, W / 2, H);
            spot.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
            spot.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = spot;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 70, 0);
            ctx.lineTo(W / 2 + 70, 0);
            ctx.lineTo(W / 2 + 220, H);
            ctx.lineTo(W / 2 - 220, H);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Runway Carpet & Gold Rim
            ctx.fillStyle = bg.floor;
            ctx.beginPath();
            ctx.ellipse(W / 2, 585, 195, 42, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.stroke();

            const cx = W / 2;
            const cy = 165 + breathe;

            // 2. Wings / Royal Cape / Aura (Behind Character)
            ctx.save();
            if (wings.type === 'butterfly') {
                const flap = Math.sin(tick * 0.08) * 6;
                const wGrad = ctx.createRadialGradient(cx, cy + 120, 10, cx, cy + 120, 160);
                wGrad.addColorStop(0, 'rgba(244, 114, 182, 0.75)');
                wGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.55)');
                wGrad.addColorStop(1, 'rgba(253, 224, 71, 0.35)');
                ctx.fillStyle = wGrad;
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2.5;

                // Upper wings
                ctx.beginPath();
                ctx.ellipse(cx - 88, cy + 95, 78 - flap, 105, -0.42, 0, Math.PI * 2);
                ctx.ellipse(cx + 88, cy + 95, 78 - flap, 105, 0.42, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Lower wings
                ctx.beginPath();
                ctx.ellipse(cx - 72, cy + 185, 52 - flap * 0.5, 72, 0.35, 0, Math.PI * 2);
                ctx.ellipse(cx + 72, cy + 185, 52 - flap * 0.5, 72, -0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (wings.type === 'angel') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.ellipse(cx - 95, cy + 110, 82, 115, -0.3, 0, Math.PI * 2);
                ctx.ellipse(cx + 95, cy + 110, 82, 115, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (wings.type === 'cape') {
                const cGrad = ctx.createLinearGradient(cx, cy + 60, cx, 550);
                cGrad.addColorStop(0, '#991b1b');
                cGrad.addColorStop(1, '#450a0a');
                ctx.fillStyle = cGrad;
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx - 48, cy + 65);
                ctx.lineTo(cx + 48, cy + 65);
                ctx.lineTo(cx + 125, 540);
                ctx.lineTo(cx - 125, 540);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (wings.type === 'neon_aura') {
                ctx.strokeStyle = '#00f5d4';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00f5d4';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(cx, cy + 135, 135 + Math.sin(tick * 0.1) * 6, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // 3. Back Hair Layer with Strands
            ctx.save();
            ctx.fillStyle = hair.color;
            ctx.strokeStyle = hair.shade;
            ctx.lineWidth = 2.5;
            if (hair.style === 'long_curls' || hair.style === 'mermaid_waves') {
                ctx.beginPath();
                ctx.roundRect(cx - 68, cy - 20, 136, 225, 55);
                ctx.fill();
                ctx.stroke();
                // Side curls
                ctx.beginPath();
                ctx.arc(cx - 64, cy + 175, 26, 0, Math.PI * 2);
                ctx.arc(cx + 64, cy + 175, 26, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (hair.style === 'twintails') {
                ctx.beginPath();
                ctx.ellipse(cx - 82, cy + 65, 28, 115, 0.22, 0, Math.PI * 2);
                ctx.ellipse(cx + 82, cy + 65, 28, 115, -0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (hair.style === 'royal_bun') {
                ctx.beginPath();
                ctx.arc(cx, cy - 68, 34, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();

            // 4. Legs, Stockings & Detailed Shoes
            ctx.save();
            // Legs base
            ctx.fillStyle = make.skin;
            ctx.strokeStyle = make.skinShade;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cx - 32, 390, 22, 165, 10);
            ctx.roundRect(cx + 10, 390, 22, 165, 10);
            ctx.fill();
            ctx.stroke();

            // Stockings / Lace Tights
            if (shoes.stockings !== 'transparent') {
                ctx.fillStyle = shoes.stockings;
                ctx.beginPath();
                ctx.roundRect(cx - 32, 415, 22, 140, 10);
                ctx.roundRect(cx + 10, 415, 22, 140, 10);
                ctx.fill();
            }

            // Shoes styles
            ctx.fillStyle = shoes.color;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            if (shoes.style === 'boots') {
                ctx.beginPath();
                ctx.roundRect(cx - 35, 465, 28, 95, 10);
                ctx.roundRect(cx + 7, 465, 28, 95, 10);
                ctx.fill();
                ctx.stroke();
                // Laces
                ctx.strokeStyle = '#fde047';
                for (let y = 480; y < 540; y += 14) {
                    ctx.beginPath();
                    ctx.moveTo(cx - 30, y); ctx.lineTo(cx - 12, y);
                    ctx.moveTo(cx + 12, y); ctx.lineTo(cx + 30, y);
                    ctx.stroke();
                }
            } else if (shoes.style === 'ballet') {
                ctx.beginPath();
                ctx.roundRect(cx - 35, 535, 28, 25, 10);
                ctx.roundRect(cx + 7, 535, 28, 25, 10);
                ctx.fill();
                ctx.stroke();
                // Crisscross ribbons up the legs
                ctx.strokeStyle = shoes.color;
                ctx.lineWidth = 2.5;
                for (let y = 465; y < 535; y += 18) {
                    ctx.beginPath();
                    ctx.moveTo(cx - 32, y); ctx.lineTo(cx - 10, y + 12);
                    ctx.moveTo(cx - 10, y); ctx.lineTo(cx - 32, y + 12);
                    ctx.moveTo(cx + 10, y); ctx.lineTo(cx + 32, y + 12);
                    ctx.moveTo(cx + 32, y); ctx.lineTo(cx + 10, y + 12);
                    ctx.stroke();
                }
            } else {
                // High Heels with crystal buckle
                ctx.beginPath();
                ctx.roundRect(cx - 36, 532, 30, 26, 9);
                ctx.roundRect(cx + 6, 532, 30, 26, 9);
                ctx.fill();
                ctx.stroke();
                drawStar(cx - 21, 540, 4, 6, 2.5, '#fde047');
                drawStar(cx + 21, 540, 4, 6, 2.5, '#fde047');
            }
            ctx.restore();

            // 5. Neck, Collarbone & Arms (with Pose variation)
            ctx.save();
            ctx.fillStyle = make.skin;
            ctx.strokeStyle = make.skinShade;
            ctx.lineWidth = 2;
            // Neck & shoulders
            ctx.beginPath();
            ctx.roundRect(cx - 14, cy + 40, 28, 42, 8);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(cx - 52, cy + 68, 104, 34, 16);
            ctx.fill();

            // Arms
            ctx.strokeStyle = make.skin;
            ctx.lineWidth = 17;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            if (poseIdx === 0) {
                // Left hand on hip, right hand holding bag/wand
                ctx.moveTo(cx - 46, cy + 78);
                ctx.lineTo(cx - 78, cy + 125);
                ctx.lineTo(cx - 45, cy + 160);

                ctx.moveTo(cx + 46, cy + 78);
                ctx.lineTo(cx + 84, cy + 145);
            } else if (poseIdx === 1) {
                // Runway wave pose
                ctx.moveTo(cx - 46, cy + 78);
                ctx.lineTo(cx - 88, cy + 35);

                ctx.moveTo(cx + 46, cy + 78);
                ctx.lineTo(cx + 82, cy + 150);
            } else {
                // Diva both hands elegant pose
                ctx.moveTo(cx - 46, cy + 78);
                ctx.lineTo(cx - 82, cy + 145);
                ctx.moveTo(cx + 46, cy + 78);
                ctx.lineTo(cx + 78, cy + 120);
                ctx.lineTo(cx + 46, cy + 158);
            }
            ctx.stroke();
            ctx.restore();

            // 6. Detailed Couture Dress
            ctx.save();
            const dGrad = ctx.createLinearGradient(cx, cy + 72, cx, 530);
            dGrad.addColorStop(0, dress.c1);
            dGrad.addColorStop(1, dress.c2);
            ctx.fillStyle = dGrad;
            ctx.strokeStyle = dress.accent;
            ctx.lineWidth = 3;

            if (dress.style === 'ballgown') {
                // Puff sleeves
                ctx.beginPath();
                ctx.arc(cx - 52, cy + 82, 20, 0, Math.PI * 2);
                ctx.arc(cx + 52, cy + 82, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Bodice & Wide Layered Skirt
                ctx.beginPath();
                ctx.moveTo(cx - 42, cy + 72);
                ctx.lineTo(cx + 42, cy + 72);
                ctx.lineTo(cx + 30, cy + 155);
                ctx.quadraticCurveTo(cx + 145, cy + 230, cx + 135, 520);
                ctx.lineTo(cx - 135, 520);
                ctx.quadraticCurveTo(cx - 145, cy + 230, cx - 30, cy + 155);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Corset lacing & Ruffle scallops
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.lineWidth = 2;
                for (let y = cy + 86; y < cy + 148; y += 14) {
                    ctx.beginPath();
                    ctx.moveTo(cx - 14, y);
                    ctx.lineTo(cx + 14, y + 8);
                    ctx.moveTo(cx + 14, y);
                    ctx.lineTo(cx - 14, y + 8);
                    ctx.stroke();
                }
                // Gems along skirt
                for (let x = cx - 95; x <= cx + 95; x += 38) {
                    drawStar(x, 485, 4, 7, 3, dress.accent);
                }
            } else if (dress.style === 'popstar') {
                // Jacket & Pleated Skirt
                ctx.beginPath();
                ctx.moveTo(cx - 44, cy + 72);
                ctx.lineTo(cx + 44, cy + 72);
                ctx.lineTo(cx + 34, cy + 145);
                ctx.lineTo(cx + 76, 405);
                ctx.lineTo(cx - 76, 405);
                ctx.lineTo(cx - 34, cy + 145);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Pleats & Star Belt
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                for (let x = cx - 50; x <= cx + 50; x += 20) {
                    ctx.beginPath();
                    ctx.moveTo(x * 0.4 + cx * 0.6, cy + 150);
                    ctx.lineTo(x, 405);
                    ctx.stroke();
                }
                drawStar(cx, cy + 150, 5, 13, 6, '#fde047');
            } else if (dress.style === 'mermaid') {
                ctx.beginPath();
                ctx.moveTo(cx - 40, cy + 72);
                ctx.lineTo(cx + 40, cy + 72);
                ctx.lineTo(cx + 32, cy + 150);
                ctx.lineTo(cx + 46, 415);
                ctx.lineTo(cx + 105, 525);
                ctx.lineTo(cx - 105, 525);
                ctx.lineTo(cx - 46, 415);
                ctx.lineTo(cx - 32, cy + 150);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                drawStar(cx, cy + 95, 4, 9, 4, '#fde047');
            } else {
                // Fairy / Ballet Petal Tutu Dress
                ctx.beginPath();
                ctx.moveTo(cx - 40, cy + 72);
                ctx.lineTo(cx + 40, cy + 72);
                ctx.lineTo(cx + 28, cy + 150);
                ctx.quadraticCurveTo(cx + 125, cy + 195, cx + 98, 425);
                ctx.lineTo(cx - 98, 425);
                ctx.quadraticCurveTo(cx - 125, cy + 195, cx - 28, cy + 150);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();

            // 7. Jewelry on Neck (if Diamonds selected)
            if (crown.type === 'diamonds' || crown.type === 'tiara') {
                ctx.save();
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy + 62, 22, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();
                drawStar(cx, cy + 86, 4, 7, 3, '#38bdf8');
                ctx.restore();
            }

            // 8. Detailed Head & Anime/Fashion Face
            ctx.save();
            // Ears & Earrings
            ctx.fillStyle = make.skin;
            ctx.beginPath();
            ctx.arc(cx - 52, cy + 4, 10, 0, Math.PI * 2);
            ctx.arc(cx + 52, cy + 4, 10, 0, Math.PI * 2);
            ctx.fill();
            // Pearl / Diamond Earrings
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(cx - 53, cy + 15, 4.5, 0, Math.PI * 2);
            ctx.arc(cx + 53, cy + 15, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Face Contour
            ctx.fillStyle = make.skin;
            ctx.strokeStyle = make.skinShade;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 52, 58, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Eyeshadow Shimmer
            ctx.fillStyle = make.shadow;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.ellipse(cx - 21, cy - 4, 14, 9, -0.1, Math.PI, 0);
            ctx.ellipse(cx + 21, cy - 4, 14, 9, 0.1, Math.PI, 0);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Detailed Expressive Eyes (or Blink)
            [-21, 21].forEach(ox => {
                if (isBlinking) {
                    ctx.strokeStyle = '#1e1b4b';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.arc(cx + ox, cy, 11, 0.1 * Math.PI, 0.9 * Math.PI);
                    ctx.stroke();
                } else {
                    // Sclera
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(cx + ox, cy, 12, 9.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Iris
                    ctx.fillStyle = make.eye;
                    ctx.beginPath();
                    ctx.arc(cx + ox, cy + 1, 7.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupil
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(cx + ox, cy + 1, 3.8, 0, Math.PI * 2);
                    ctx.fill();

                    // Starlight Catchlights
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(cx + ox - 2.5, cy - 2.5, 2.6, 0, Math.PI * 2);
                    ctx.arc(cx + ox + 3, cy + 3, 1.4, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyeliner & Lashes
                    ctx.strokeStyle = '#1e1b4b';
                    ctx.lineWidth = 3.2;
                    ctx.beginPath();
                    ctx.arc(cx + ox, cy, 12, 1.08 * Math.PI, 1.95 * Math.PI);
                    ctx.stroke();
                }

                // Eyebrows
                ctx.strokeStyle = hair.shade;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(cx + ox, cy - 8, 12, 1.2 * Math.PI, 1.8 * Math.PI);
                ctx.stroke();
            });

            // Soft Blush
            ctx.fillStyle = 'rgba(244, 114, 182, 0.42)';
            ctx.beginPath();
            ctx.ellipse(cx - 30, cy + 15, 11, 6.5, 0, 0, Math.PI * 2);
            ctx.ellipse(cx + 30, cy + 15, 11, 6.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cute Nose highlight
            ctx.fillStyle = make.skinShade;
            ctx.beginPath();
            ctx.arc(cx, cy + 10, 2.2, 0, Math.PI * 2);
            ctx.fill();

            // Glossy Lips
            ctx.fillStyle = make.lip;
            ctx.beginPath();
            ctx.ellipse(cx, cy + 28, 12, 6.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.beginPath();
            ctx.ellipse(cx - 3, cy + 26, 4.5, 1.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 9. Front Hair Bangs & Specular Shine Ribbon
            ctx.save();
            ctx.fillStyle = hair.color;
            ctx.strokeStyle = hair.shade;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy - 14, 54, Math.PI, 0);
            ctx.quadraticCurveTo(cx + 56, cy + 25, cx + 44, cy + 42);
            ctx.quadraticCurveTo(cx + 38, cy - 10, cx, cy - 18);
            ctx.quadraticCurveTo(cx - 38, cy - 10, cx - 44, cy + 42);
            ctx.quadraticCurveTo(cx - 56, cy + 25, cx - 54, cy - 14);
            ctx.fill();
            ctx.stroke();

            // Hair Gloss Highlight Band
            ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 36, 34, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 10. Headpiece / Tiara / Crown
            ctx.save();
            ctx.font = '44px serif';
            ctx.textAlign = 'center';
            ctx.fillText(crown.icon, cx, cy - 52);
            ctx.restore();

            // 11. Handbag / Wand / Royal Pet
            ctx.save();
            ctx.font = '52px serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(253, 224, 71, 0.6)';
            ctx.shadowBlur = 14;
            if (bag.id === 1 || bag.id === 5) {
                // Cute Pet standing beside the model on the runway
                ctx.fillText(bag.icon, cx + 108, 560 + Math.sin(tick * 0.1) * 4);
                ctx.font = '22px serif';
                ctx.fillText('👑', cx + 108, 518 + Math.sin(tick * 0.1) * 4);
            } else {
                // Held in right hand
                ctx.fillText(bag.icon, cx + 88, cy + 160);
            }
            ctx.restore();

            // 12. Floating Sparkles & Runway Confetti
            for (const s of sparkles) {
                s.y += s.vy;
                if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
                const sc = 0.6 + Math.sin(tick * 0.08 + s.phase) * 0.4;
                drawStar(s.x, s.y, 4, s.r * 2.2 * sc, s.r * 0.8 * sc, '#fde047');
            }

            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.x += c.vx;
                c.y += c.vy;
                ctx.fillStyle = c.c;
                ctx.fillRect(c.x, c.y, 8, 5);
                if (c.y > H) confetti.splice(i, 1);
            }

            // Camera Flash
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, W, H);
                flashAlpha = Math.max(0, flashAlpha - 0.05);
            }

            requestAnimationFrame(drawScene);
        }

        renderWardrobe();
        drawScene();
    </script>
</body>
</html>
