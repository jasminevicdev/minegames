<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Penalty Neon ⚽🥅 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at center, #052e16 0%, #020b06 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        .topbar {
            width: 96vw;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #22c55e;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .hud-stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .stage-wrap {
            position: relative;
            width: 96vw;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #061c10;
            border: 3px solid #22c55e;
            border-radius: 20px;
            box-shadow: 0 0 38px rgba(34, 197, 94, 0.3);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 14, 8, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            color: #4ade80;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            max-width: 520px;
            font-size: 0.95rem;
            margin-bottom: 18px;
            line-height: 1.45;
        }
        .btn-start {
            background: linear-gradient(135deg, #22c55e, #eab308);
            color: #031108;
            border: none;
            padding: 13px 30px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div class="hud-stats">
            <div class="stat-pill">CHUTES RESTANTES: <strong id="hud-balls">⚽⚽⚽⚽⚽</strong></div>
            <div class="stat-pill">SEQUÊNCIA: <strong id="hud-streak">0🔥</strong></div>
            <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
        </div>
    </div>

    <div class="stage-wrap">
        <canvas id="soccer-canvas" width="1280" height="720"></canvas>
        <div class="overlay" id="soccer-overlay">
            <h1>⚽ SUPER PENALTY NEON</h1>
            <p id="soccer-desc">
                Clique ou toque exatamente onde quer chutar no gol! Acerte o <strong>Alvo Dourado 🎯</strong> no ângulo para ganhar pontos em dobro e vencer o Goleiro Robô!
            </p>
            <button class="btn-start" id="btn-start-soccer">ENTRAR EM CAMPO ⚽</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('soccer-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudBalls = document.getElementById('hud-balls');
        const hudStreak = document.getElementById('hud-streak');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('soccer-overlay');
        const soccerDesc = document.getElementById('soccer-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('penalty', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 440, dur = 0.1, type = 'triangle', vol = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(vol, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        const goal = { x: 290, y: 120, w: 700, h: 270 };
        let running = false;
        let score = 0;
        let streak = 0;
        let missesLeft = 3;
        let ball = { x: W / 2, y: H - 110, r: 28, tx: W / 2, ty: 260, t: 0, shooting: false };
        let keeper = { x: W / 2, y: 265, w: 96, h: 130, tx: W / 2 };
        let targetRing = { x: 400, y: 180, r: 38 };
        let bannerMsg = '';
        let bannerTimer = 0;

        function placeTarget() {
            targetRing.x = goal.x + 65 + Math.random() * (goal.w - 130);
            targetRing.y = goal.y + 55 + Math.random() * (goal.h - 110);
        }

        function resetShot() {
            ball.x = W / 2;
            ball.y = H - 110;
            ball.r = 28;
            ball.t = 0;
            ball.shooting = false;
            keeper.tx = W / 2;
            placeTarget();
        }

        function startGame() {
            score = 0;
            streak = 0;
            missesLeft = 3;
            resetShot();
            updateHud();
            overlay.classList.add('hidden');
            running = true;
            sfx(540, 0.14, 'triangle');
        }

        function updateHud() {
            hudBalls.innerText = '⚽'.repeat(Math.max(0, missesLeft)) || '❌';
            hudStreak.innerText = `${streak}🔥`;
            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('penalty', { highScore: bestScore }, playerName);
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!running || ball.shooting) return;
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const my = ((e.clientY - rect.top) / rect.height) * H;

            // Clamp inside/near goal area
            ball.tx = Math.max(goal.x + 25, Math.min(goal.x + goal.w - 25, mx));
            ball.ty = Math.max(goal.y + 25, Math.min(goal.y + goal.h - 20, my));
            ball.shooting = true;
            ball.t = 0;

            // Keeper dives towards a spot (smarter as streak grows)
            const smartChance = Math.min(0.68, 0.25 + streak * 0.05);
            if (Math.random() < smartChance) {
                keeper.tx = ball.tx + (Math.random() - 0.5) * 140;
            } else {
                keeper.tx = goal.x + 80 + Math.random() * (goal.w - 160);
            }
            sfx(320, 0.09, 'sine');
        });

        function update() {
            if (!running) return;
            if (bannerTimer > 0) bannerTimer--;

            keeper.x += (keeper.tx - keeper.x) * 0.14;

            if (ball.shooting) {
                ball.t += 0.055;
                ball.x = (W / 2) + (ball.tx - W / 2) * ball.t;
                ball.y = (H - 110) + (ball.ty - (H - 110)) * ball.t - Math.sin(ball.t * Math.PI) * 90;
                ball.r = 28 - ball.t * 11;

                if (ball.t >= 1) {
                    ball.shooting = false;
                    // Check if keeper saved it
                    const saved = Math.abs(ball.x - keeper.x) < 58 && Math.abs(ball.y - keeper.y) < 72;
                    if (saved) {
                        missesLeft--;
                        streak = 0;
                        bannerMsg = '🧤 DEFESA DO GOLEIRO!';
                        bannerTimer = 50;
                        sfx(180, 0.22, 'sawtooth');
                        updateHud();
                        if (missesLeft <= 0) {
                            setTimeout(() => {
                                running = false;
                                soccerDesc.innerHTML = `⚽ <strong>FIM DE DISPUTA!</strong><br>Você marcou <strong>${score} PTS</strong> no Estádio Cyber!`;
                                overlay.classList.remove('hidden');
                            }, 650);
                            return;
                        }
                    } else {
                        streak++;
                        const hitBullseye = Math.hypot(ball.x - targetRing.x, ball.y - targetRing.y) <= targetRing.r + 18;
                        const pts = (hitBullseye ? 250 : 100) + streak * 25;
                        score += pts;
                        bannerMsg = hitBullseye ? `🎯 NO ÂNGULO! +${pts} PTS!` : `⚽ GOOOL! +${pts} PTS!`;
                        bannerTimer = 55;
                        sfx(hitBullseye ? 820 : 620, 0.18, 'triangle');
                        updateHud();
                    }
                    setTimeout(() => { if (running) resetShot(); }, 650);
                }
            }
        }

        function draw() {
            // Sky & Pitch
            ctx.fillStyle = '#04120b';
            ctx.fillRect(0, 0, W, 390);
            ctx.fillStyle = '#062c19';
            ctx.fillRect(0, 390, W, H - 390);

            // Pitch lines
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.35)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(140, 390); ctx.lineTo(40, H);
            ctx.moveTo(W - 140, 390); ctx.lineTo(W - 40, H);
            ctx.stroke();

            // Goal Net & Posts
            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.strokeStyle = '#00f5d4';
            ctx.lineWidth = 8;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            // Target Ring
            ctx.save();
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 5;
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(targetRing.x, targetRing.y, targetRing.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.font = '24px serif';
            ctx.textAlign = 'center';
            ctx.fillText('🎯', targetRing.x, targetRing.y + 8);
            ctx.restore();

            // Goalkeeper Robot
            ctx.save();
            ctx.fillStyle = '#ff2a5f';
            ctx.shadowColor = '#ff2a5f';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.roundRect(keeper.x - keeper.w / 2, keeper.y - keeper.h / 2, keeper.w, keeper.h, 16);
            ctx.fill();
            ctx.font = '42px serif';
            ctx.textAlign = 'center';
            ctx.fillText('🤖', keeper.x, keeper.y + 12);
            ctx.restore();

            // Soccer Ball
            ctx.save();
            ctx.font = `${Math.round(ball.r * 2)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚽', ball.x, ball.y);
            ctx.restore();

            if (bannerTimer > 0) {
                ctx.save();
                ctx.font = '900 44px Fredoka';
                ctx.fillStyle = '#ffcc00';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 12;
                ctx.fillText(bannerMsg, W / 2, 78);
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('btn-start-soccer').addEventListener('click', startGame);
        loop();
    </script>
</body>
</html>
