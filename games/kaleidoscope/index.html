<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mandala & Kaleidoscope Neon Draw 🌀🌟 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #311042 0%, #090214 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 1040px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #e879f9;
            color: #fff;
            padding: 7px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #e879f9;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }
        .mandala-grid {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 14px;
        }
        @media (max-width: 820px) {
            .mandala-grid { grid-template-columns: 1fr; }
        }
        .stage-box {
            background: rgba(18, 4, 34, 0.92);
            border: 3px solid #e879f9;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 38px rgba(232, 121, 249, 0.35);
        }
        canvas {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: #090214;
            border: 3px solid rgba(253, 224, 71, 0.45);
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.35);
        }
        .menu-box {
            background: rgba(28, 7, 48, 0.95);
            border: 3px solid #f472b6;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .label { font-family: 'Fredoka', sans-serif; color: #f5d0fe; font-size: 0.88rem; margin-bottom: 5px; }
        .row-wrap { display: flex; gap: 7px; flex-wrap: wrap; }
        .opt-btn {
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .opt-btn.active, .opt-btn:hover {
            border-color: #fde047;
            background: linear-gradient(135deg, #ec4899, #a855f7);
        }
        .color-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .color-dot.active { border-color: #fde047; transform: scale(1.15); }
        .btn-finish {
            margin-top: auto;
            background: linear-gradient(135deg, #e879f9, #38bdf8, #fde047);
            color: #140326;
            border: none;
            padding: 14px;
            border-radius: 28px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div style="display:flex; gap:8px;">
            <div class="stat-pill">MANDALAS: <strong id="hud-score">0 🌀</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0 🌀</strong></div>
        </div>
    </div>

    <div class="mandala-grid">
        <div class="stage-box">
            <canvas id="mandala-canvas" width="480" height="480"></canvas>
            <p id="mandala-msg" style="margin-top:8px; font-family:'Fredoka',sans-serif; color:#fde047; text-align:center;">
                Arraste na tela circular para desenhar Mandalas & Caleidoscópios Neon! 🌀✨
            </p>
        </div>

        <div class="menu-box">
            <div>
                <div class="label">❄️ PONTAS DE SIMETRIA DO CALEIDOSCÓPIO:</div>
                <div class="row-wrap">
                    <button class="opt-btn" data-sym="4">4 Pontas</button>
                    <button class="opt-btn" data-sym="6">6 Pontas</button>
                    <button class="opt-btn active" data-sym="8">8 Pontas</button>
                    <button class="opt-btn" data-sym="12">12 Pontas</button>
                    <button class="opt-btn" data-sym="16">16 Pontas</button>
                </div>
            </div>

            <div>
                <div class="label">🌈 MODO DE COR NEON:</div>
                <div class="row-wrap">
                    <button class="opt-btn active" id="btn-rainbow">🌈 Arco-Íris Dinâmico</button>
                    <button class="opt-btn" id="btn-mirror">🪞 Espelho Duplo: ON</button>
                </div>
                <div class="row-wrap" id="palette-row" style="margin-top:8px;"></div>
            </div>

            <div>
                <div class="label">✨ AÇÕES RÁPIDAS:</div>
                <div class="row-wrap">
                    <button class="opt-btn" id="btn-flower">🌸 Gerar Flor Astral</button>
                    <button class="opt-btn" id="btn-clear">🗑️ Nova Mandala</button>
                </div>
            </div>

            <button class="btn-finish" id="btn-finish">🌟 CONSAGRAR MANDALA NEON! (+160 🌀)</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('mandala-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const CX = W / 2;
        const CY = H / 2;

        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const mandalaMsg = document.getElementById('mandala-msg');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('kaleidoscope', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = `${bestScore} 🌀`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 720) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.06, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.14);
            } catch (e) {}
        }

        const COLORS = ['#ff2a85', '#f472b6', '#c084fc', '#38bdf8', '#2dd4bf', '#fde047', '#ffffff'];

        let symmetry = 8;
        let rainbow = true;
        let mirror = true;
        let selectedColor = '#ff2a85';
        let hue = 0;
        let isDrawing = false;
        let lx = 0, ly = 0;
        let score = 0;

        function clearCanvas() {
            ctx.fillStyle = '#090214';
            ctx.fillRect(0, 0, W, H);

            // Subtle guide circle
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(CX, CY, 180, 0, Math.PI * 2);
            ctx.stroke();
        }

        const palRow = document.getElementById('palette-row');
        COLORS.forEach(c => {
            const d = document.createElement('div');
            d.className = 'color-dot';
            d.style.background = c;
            d.onclick = () => {
                rainbow = false;
                document.getElementById('btn-rainbow').classList.remove('active');
                document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
                d.classList.add('active');
                selectedColor = c;
                sfx(640);
            };
            palRow.appendChild(d);
        });

        document.querySelectorAll('[data-sym]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-sym]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                symmetry = Number(btn.dataset.sym);
                sfx(700);
            };
        });

        document.getElementById('btn-rainbow').onclick = (e) => {
            rainbow = true;
            e.target.classList.add('active');
            document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
        };

        document.getElementById('btn-mirror').onclick = (e) => {
            mirror = !mirror;
            e.target.innerText = `🪞 Espelho Duplo: ${mirror ? 'ON' : 'OFF'}`;
        };

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((cx - rect.left) / rect.width) * W - CX,
                y: ((cy - rect.top) / rect.height) * H - CY
            };
        }

        function drawSymmetricLine(x1, y1, x2, y2) {
            const col = rainbow ? `hsl(${(hue += 3) % 360}, 95%, 64%)` : selectedColor;
            const step = (Math.PI * 2) / symmetry;

            ctx.save();
            ctx.translate(CX, CY);
            ctx.strokeStyle = col;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 14;
            ctx.shadowColor = col;

            for (let i = 0; i < symmetry; i++) {
                ctx.save();
                ctx.rotate(i * step);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (mirror) {
                    ctx.scale(1, -1);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.restore();
            }
            ctx.restore();
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const p = getPos(e);
            lx = p.x;
            ly = p.y;
            drawSymmetricLine(lx, ly, lx + 0.5, ly + 0.5);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const p = getPos(e);
            drawSymmetricLine(lx, ly, p.x, p.y);
            lx = p.x;
            ly = p.y;
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const p = getPos(e);
            lx = p.x;
            ly = p.y;
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e);
            drawSymmetricLine(lx, ly, p.x, p.y);
            lx = p.x;
            ly = p.y;
        }, { passive: false });
        window.addEventListener('touchend', () => { isDrawing = false; });

        document.getElementById('btn-flower').onclick = () => {
            let px = 10, py = 0;
            for (let t = 0; t < 65; t++) {
                const r = 15 + t * 2.6;
                const nx = Math.cos(t * 0.25) * r;
                const ny = Math.sin(t * 0.45) * r * 0.6;
                drawSymmetricLine(px, py, nx, ny);
                px = nx;
                py = ny;
            }
            sfx(840);
        };

        document.getElementById('btn-clear').onclick = () => {
            clearCanvas();
            sfx(500);
        };

        document.getElementById('btn-finish').onclick = () => {
            score += 160;
            sfx(960);
            hudScore.innerText = `${score} 🌀`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = `${bestScore} 🌀`;
                SaveHub.updateGameSave('kaleidoscope', { highScore: bestScore }, playerName);
            }
            mandalaMsg.innerText = '🌟 MANDALA ESTELAR SALVA NO RECORDE! +160 🌀';
        };

        clearCanvas();
        document.getElementById('btn-flower').click();
    </script>
</body>
</html>
