<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Bubble Shooter: Bolhas de Cristal HD — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #3b0764, #090418 80%);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1020px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(236,72,153,0.45);
        }
        .back-btn {
            text-decoration: none; color: #fbcfe8; font-weight: 700;
            background: rgba(236,72,153,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(236,72,153,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #f472b6; }
        .score-pill {
            background: linear-gradient(135deg, #ec4899, #eab308);
            padding: 7px 16px; border-radius: 999px; font-weight: 700; color: #1f0410;
        }
        .arena { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; }
        .hud {
            display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.06);
            padding: 8px 16px; border-radius: 999px; flex-wrap: wrap; justify-content: center;
        }
        canvas {
            background: linear-gradient(180deg, #17082e, #090314);
            border: 3px solid #f472b6; border-radius: 22px;
            box-shadow: 0 0 38px rgba(236,72,153,0.35); max-width: 100%; height: auto;
            cursor: crosshair; touch-action: none;
        }
        .btn {
            padding: 8px 15px; border-radius: 999px; border: none; font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #a855f7); color: #fff; cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-bomb { background: linear-gradient(135deg, #f97316, #ef4444); }
        .btn-swap { background: linear-gradient(135deg, #10b981, #059669); }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>🫧 Royal Bubble Shooter: Bolhas de Cristal — Edição HD</h1>
        <div class="score-pill">Recorde: <span id="hiVal">0</span> PTS</div>
    </header>

    <main class="arena">
        <div class="hud">
            <span>Pontos: <strong id="scoreVal" style="color:#fde047;">0</strong></span>
            <button class="btn btn-swap" id="switchBtn">🔄 Trocar c/ Reserva</button>
            <button class="btn" id="rainbowBtn">🌈 Bolha Coringa</button>
            <button class="btn btn-bomb" id="bombBtn">💣 Bolha Bomba</button>
            <button class="btn" id="resetBtn">🆕 Novo Tabuleiro</button>
        </div>
        <canvas id="bubbleCanvas" width="480" height="540"></canvas>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('bubblepop', activePlayer);
        let bestScore = save?.highScore || 0;
        const hiEl = document.getElementById('hiVal');
        hiEl.textContent = bestScore;

        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10, ROWS = 11, R = 22;
        const PALETTE = [
            { c: '#ff2e93', icon: '💖' },
            { c: '#38bdf8', icon: '❄️' },
            { c: '#fde047', icon: '⭐' },
            { c: '#a855f7', icon: '🔮' },
            { c: '#10b981', icon: '🍀' }
        ];

        let grid = [];
        let aimAngle = -Math.PI / 2;
        let shot = null;
        let currentBubble = PALETTE[0].c;
        let reserveBubble = PALETTE[1].c;
        let popParticles = [];
        let score = 0;

        function randColor() {
            return PALETTE[Math.floor(Math.random() * PALETTE.length)].c;
        }

        function initGame() {
            score = 0;
            updateScore(0);
            grid = Array.from({ length: ROWS }, (_, r) =>
                Array.from({ length: COLS }, () => (r < 5 ? randColor() : null))
            );
            currentBubble = randColor();
            reserveBubble = randColor();
            shot = null;
        }

        function spawnBurst(x, y, col) {
            for (let i = 0; i < 8; i++) {
                const a = Math.random() * Math.PI * 2;
                popParticles.push({ x, y, vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5, c: col, life: 1 });
            }
        }

        function updateScore(pts) {
            score += pts;
            document.getElementById('scoreVal').textContent = score;
            if (score > bestScore) {
                bestScore = score;
                hiEl.textContent = bestScore;
                SaveHub.updateGameSave('bubblepop', { highScore: bestScore }, activePlayer);
            }
        }

        function cellPos(r, c) {
            const ox = (r % 2) * R;
            return { x: 32 + c * (R * 2) + ox, y: 34 + r * (R * 1.75) };
        }

        function snapBubble(bx, by, col) {
            let bestR = 0, bestC = 0, bestD = 9999;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c]) continue;
                    const p = cellPos(r, c);
                    const d = Math.hypot(bx - p.x, by - p.y);
                    if (d < bestD) { bestD = d; bestR = r; bestC = c; }
                }
            }

            if (col === 'bomb') {
                let popped = 0;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (!grid[r][c]) continue;
                        const p1 = cellPos(bestR, bestC), p2 = cellPos(r, c);
                        if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < R * 3.2) {
                            spawnBurst(p2.x, p2.y, grid[r][c]);
                            grid[r][c] = null;
                            popped++;
                        }
                    }
                }
                updateScore(popped * 45);
                return;
            }

            grid[bestR][bestC] = col === 'rainbow' ? randColor() : col;

            const target = grid[bestR][bestC];
            const visited = new Set();
            const stack = [[bestR, bestC]];
            const cluster = [];

            while (stack.length) {
                const [cr, cc] = stack.pop();
                const key = `${cr},${cc}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (col === 'rainbow' || grid[cr][cc] === target) {
                    cluster.push([cr, cc]);
                    for (let nr = Math.max(0, cr - 1); nr <= Math.min(ROWS - 1, cr + 1); nr++) {
                        for (let nc = Math.max(0, cc - 1); nc <= Math.min(COLS - 1, cc + 1); nc++) {
                            if (!grid[nr][nc]) continue;
                            const p1 = cellPos(cr, cc), p2 = cellPos(nr, nc);
                            if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < R * 2.3) {
                                stack.push([nr, nc]);
                            }
                        }
                    }
                }
            }

            if (cluster.length >= 3 || col === 'rainbow') {
                cluster.forEach(([r, c]) => {
                    const p = cellPos(r, c);
                    spawnBurst(p.x, p.y, grid[r][c]);
                    grid[r][c] = null;
                });
                updateScore(cluster.length * 40);
            }
        }

        canvas.addEventListener('pointermove', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (480 / rect.width);
            const my = (e.clientY - rect.top) * (540 / rect.height);
            aimAngle = Math.max(-2.85, Math.min(-0.3, Math.atan2(my - 495, mx - 240)));
        });

        canvas.addEventListener('pointerdown', () => {
            if (shot) return;
            shot = {
                x: 240, y: 495,
                vx: Math.cos(aimAngle) * 11.5,
                vy: Math.sin(aimAngle) * 11.5,
                c: currentBubble
            };
            currentBubble = reserveBubble;
            reserveBubble = randColor();
        });

        document.getElementById('switchBtn').addEventListener('click', () => {
            const tmp = currentBubble;
            currentBubble = reserveBubble;
            reserveBubble = tmp;
        });
        document.getElementById('rainbowBtn').addEventListener('click', () => { currentBubble = 'rainbow'; });
        document.getElementById('bombBtn').addEventListener('click', () => { currentBubble = 'bomb'; });
        document.getElementById('resetBtn').addEventListener('click', initGame);

        function drawBubble(x, y, c, scale = 1) {
            ctx.save();
            const rad = (R - 2) * scale;
            ctx.fillStyle = c === 'rainbow' ? '#ffffff' : c === 'bomb' ? '#f97316' : c;
            ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath(); ctx.arc(x - 6 * scale, y - 6 * scale, 5.5 * scale, 0, Math.PI * 2); ctx.fill();
            const info = PALETTE.find(p => p.c === c);
            ctx.font = `${Math.round(13 * scale)}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(c === 'rainbow' ? '🌈' : c === 'bomb' ? '💣' : (info ? info.icon : ''), x, y + 1);
            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, 480, 540);

            // Aim laser guide
            ctx.strokeStyle = 'rgba(255,255,255,0.38)';
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(240, 495);
            ctx.lineTo(240 + Math.cos(aimAngle) * 260, 495 + Math.sin(aimAngle) * 260);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!grid[r][c]) continue;
                    const p = cellPos(r, c);
                    drawBubble(p.x, p.y, grid[r][c]);
                }
            }

            if (shot) {
                shot.x += shot.vx;
                shot.y += shot.vy;
                if (shot.x < R || shot.x > 480 - R) shot.vx *= -1;
                drawBubble(shot.x, shot.y, shot.c);

                let hit = shot.y <= R + 15;
                for (let r = 0; r < ROWS && !hit; r++) {
                    for (let c = 0; c < COLS && !hit; c++) {
                        if (!grid[r][c]) continue;
                        const p = cellPos(r, c);
                        if (Math.hypot(shot.x - p.x, shot.y - p.y) < R * 1.85) hit = true;
                    }
                }
                if (hit) {
                    snapBubble(shot.x, shot.y, shot.c);
                    shot = null;
                }
            }

            // Particles
            for (let i = popParticles.length - 1; i >= 0; i--) {
                const pt = popParticles[i];
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.05;
                if (pt.life <= 0) { popParticles.splice(i, 1); continue; }
                ctx.fillStyle = pt.c || '#fde047';
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); ctx.fill();
            }

            // Cannon & Reserve Preview
            drawBubble(240, 495, currentBubble, 1.05);
            drawBubble(175, 505, reserveBubble, 0.75);
            ctx.fillStyle = '#fbcfe8';
            ctx.font = '11px Outfit, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('RESERVA', 175, 532);

            requestAnimationFrame(loop);
        }

        initGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
