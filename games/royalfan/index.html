<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê de Leques Imperiais & Seda Pintada HD — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #701a75, #140318 80%);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1180px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(244,114,182,0.45);
        }
        .back-btn {
            text-decoration: none; color: #fbcfe8; font-weight: 700;
            background: rgba(236,72,153,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(244,114,182,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.45rem; color: #f9a8d4; }
        .score-pill {
            background: linear-gradient(135deg, #ec4899, #eab308);
            padding: 7px 16px; border-radius: 999px; font-weight: 700; color: #1f0410;
        }
        .studio {
            display: grid; grid-template-columns: 340px 1fr; gap: 18px;
            width: 100%; max-width: 1180px; padding: 16px; flex: 1; align-items: start;
        }
        @media (max-width: 880px) { .studio { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(42, 10, 48, 0.94); border: 2px solid rgba(244,114,182,0.35);
            border-radius: 22px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .panel h3 { font-family: 'Fredoka', sans-serif; color: #fbcfe8; font-size: 0.91rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-opt {
            padding: 8px 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07); color: #fff; font-weight: 700; cursor: pointer;
            font-size: 0.79rem;
        }
        .btn-opt.active, .btn-opt:hover {
            background: linear-gradient(135deg, #ec4899, #eab308); border-color: #fff; color: #1f0410;
        }
        .btn-action {
            padding: 10px; border-radius: 12px; border: none; font-weight: 700;
            cursor: pointer; font-family: 'Fredoka', sans-serif; font-size: 0.91rem;
            background: linear-gradient(135deg, #fde047, #ec4899); color: #240418;
        }
        .stage {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(20, 4, 24, 0.9); border-radius: 24px;
            border: 3px solid rgba(244,114,182,0.4); padding: 16px;
        }
        canvas { border-radius: 18px; max-width: 100%; height: auto; box-shadow: 0 12px 35px rgba(0,0,0,0.6); cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>🪭 Ateliê de Leques Imperiais & Seda Pintada — Edição HD</h1>
        <div class="score-pill">Leques Reais: <span id="scoreVal">0</span> 🪭</div>
    </header>

    <main class="studio">
        <aside class="panel">
            <h3>🪭 1. Seda Imperial do Leque</h3>
            <div class="grid-2" id="silkBtns">
                <button class="btn-opt active" data-c="#ec4899">🌸 Seda Sakura</button>
                <button class="btn-opt" data-c="#7c3aed">🔮 Veludo Violeta</button>
                <button class="btn-opt" data-c="#0284c7">💎 Azul Safira</button>
                <button class="btn-opt" data-c="#e11d48">🌹 Carmim Real</button>
                <button class="btn-opt" data-c="#0f172a">🌌 Noite Dourada</button>
                <button class="btn-opt" data-c="#10b981">🌿 Jade Imperial</button>
            </div>

            <h3>✨ 2. Hastes & Renda</h3>
            <div class="grid-2" id="ribBtns">
                <button class="btn-opt active" data-r="#fde047">👑 Ouro 24K</button>
                <button class="btn-opt" data-r="#f8fafc">🤍 Marfim & Prata</button>
                <button class="btn-opt" data-r="#fbcfe8">🌸 Ouro Rosé</button>
                <button class="btn-opt" data-r="#451a03">🎋 Bambu Imperial</button>
            </div>

            <h3>🖌️ 3. Pincel ou Carimbos de Seda</h3>
            <div class="grid-2" id="stampBtns">
                <button class="btn-opt active" data-p="#fde047">🖌️ Tinta de Ouro</button>
                <button class="btn-opt" data-p="#ffffff">🖌️ Tinta Pérola</button>
                <button class="btn-opt" data-s="🌸">🌸 Ramo Sakura</button>
                <button class="btn-opt" data-s="🦋">🦋 Borboleta Real</button>
                <button class="btn-opt" data-s="🦢">🦢 Cisne Imperial</button>
                <button class="btn-opt" data-s="🌙">🌙 Lua & Estrelas</button>
            </div>

            <div class="grid-2">
                <button class="btn-action" id="clearBtn" style="background:rgba(239,68,68,0.22); color:#fca5a5;">🧹 Limpar Seda</button>
                <button class="btn-action" id="photoBtn" style="background:linear-gradient(135deg,#38bdf8,#a855f7); color:#fff;">📸 Foto PNG</button>
            </div>
            <button class="btn-action" id="saveBtn">🏆 Desfilar com Leque Real (+1 🪭)</button>
        </aside>

        <section class="stage">
            <canvas id="fanCanvas" width="580" height="500"></canvas>
            <p style="margin-top:8px; color:#fbcfe8; font-size:0.84rem;">💡 Desenhe com tinta de ouro ou carimbe flores de cerejeira e borboletas sobre a seda do leque!</p>
        </section>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('royalfan', activePlayer);
        let bestScore = save?.highScore || 0;
        const scoreEl = document.getElementById('scoreVal');
        scoreEl.textContent = bestScore;

        const canvas = document.getElementById('fanCanvas');
        const ctx = canvas.getContext('2d');
        const CX = 290, CY = 415;

        let silkColor = '#ec4899';
        let ribColor = '#fde047';
        let paintColor = '#fde047';
        let activeStamp = null;
        let stamps = [{ x: 240, y: 230, s: '🌸' }, { x: 340, y: 230, s: '🦋' }, { x: 290, y: 185, s: '🌙' }];
        let strokes = [];
        let curStroke = null;

        function traceFanSector() {
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            ctx.arc(CX, CY, 310, Math.PI * 1.15, Math.PI * 1.85);
            ctx.closePath();
        }

        function render() {
            ctx.fillStyle = '#180420';
            ctx.fillRect(0, 0, 580, 500);

            // Silk Tassel hanging from pivot
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX, 485); ctx.stroke();

            // Fan Silk Body
            ctx.save();
            ctx.fillStyle = silkColor;
            traceFanSector();
            ctx.fill();
            ctx.clip();

            // Inner lace border
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 14;
            ctx.beginPath(); ctx.arc(CX, CY, 295, Math.PI, 0); ctx.stroke();

            // Painted strokes
            strokes.forEach(st => {
                if (st.pts.length < 2) return;
                ctx.strokeStyle = st.c;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                st.pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.stroke();
            });

            // Stamps
            ctx.font = '44px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            stamps.forEach(st => ctx.fillText(st.s, st.x, st.y));
            ctx.restore();

            // Fan Ribs / Folding Sticks
            ctx.strokeStyle = ribColor;
            ctx.lineWidth = 4;
            for (let i = 0; i <= 12; i++) {
                const a = Math.PI * 1.15 + (i * (Math.PI * 0.7)) / 12;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(CX + Math.cos(a) * 312, CY + Math.sin(a) * 312);
                ctx.stroke();
            }

            // Outer Golden Rim & Inner Cutout Arc
            ctx.strokeStyle = ribColor;
            ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(CX, CY, 310, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

            ctx.fillStyle = '#180420';
            ctx.beginPath(); ctx.arc(CX, CY, 95, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = ribColor; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(CX, CY, 95, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

            // Re-draw inner ribs inside cutout
            for (let i = 0; i <= 12; i++) {
                const a = Math.PI * 1.15 + (i * (Math.PI * 0.7)) / 12;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(CX + Math.cos(a) * 95, CY + Math.sin(a) * 95);
                ctx.stroke();
            }

            // Pearl Pivot Gem
            ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('💎', CX, CY + 10);
        }

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (580 / r.width),
                y: (e.clientY - r.top) * (500 / r.height)
            };
        }

        canvas.addEventListener('pointerdown', e => {
            const p = getPos(e);
            if (activeStamp) {
                stamps.push({ x: p.x, y: p.y, s: activeStamp });
                render();
            } else {
                curStroke = { c: paintColor, pts: [p] };
                strokes.push(curStroke);
            }
        });
        window.addEventListener('pointermove', e => {
            if (!curStroke) return;
            curStroke.pts.push(getPos(e));
            render();
        });
        window.addEventListener('pointerup', () => { curStroke = null; });

        document.querySelectorAll('#silkBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#silkBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                silkColor = btn.dataset.c;
                render();
            });
        });

        document.querySelectorAll('#ribBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#ribBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                ribColor = btn.dataset.r;
                render();
            });
        });

        document.querySelectorAll('#stampBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#stampBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.s) {
                    activeStamp = btn.dataset.s;
                } else {
                    activeStamp = null;
                    paintColor = btn.dataset.p;
                }
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => { stamps = []; strokes = []; render(); });
        document.getElementById('photoBtn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = 'meu-leque-imperial.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
        document.getElementById('saveBtn').addEventListener('click', () => {
            bestScore += 1;
            scoreEl.textContent = bestScore;
            SaveHub.updateGameSave('royalfan', { highScore: bestScore }, activePlayer);
        });

        render();
    </script>
</body>
</html>
