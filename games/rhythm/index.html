<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Beats: Guitarra de Luz 🎸🎵 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #1f0933 0%, #06020c 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        .topbar {
            width: 96vw;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            gap: 6px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #e879f9;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .stage-wrap {
            position: relative;
            width: 94vw;
            max-width: 480px;
            height: 72vh;
            max-height: 680px;
            background: #090314;
            border: 3px solid #e879f9;
            border-radius: 22px;
            box-shadow: 0 0 38px rgba(232, 121, 249, 0.35);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 3, 20, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #f472b6;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 0.92rem;
            margin-bottom: 18px;
            line-height: 1.45;
        }
        .btn-start {
            background: linear-gradient(135deg, #f472b6, #00f5d4);
            color: #090314;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }
        .pad-row {
            width: 94vw;
            max-width: 480px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding-top: 8px;
        }
        .pad-btn {
            padding: 14px 0;
            border-radius: 14px;
            border: 2px solid #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            color: #06020c;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ HUB</a>
        <div class="stat-pill">COMBO: <strong id="hud-combo">0x</strong></div>
        <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
        <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
    </div>

    <div class="stage-wrap">
        <canvas id="rhythm-canvas" width="480" height="680"></canvas>
        <div class="overlay" id="rhythm-overlay">
            <h1>🎸 NEON BEATS</h1>
            <p id="rhythm-desc">
                Toque nos 4 pedais neon (ou teclas <strong>D, F, J, K / 1, 2, 3, 4</strong>) quando as notas musicais passarem pela linha brilhante!
            </p>
            <button class="btn-start" id="btn-start-rhythm">SOLTAR O SOM 🎵</button>
        </div>
    </div>

    <div class="pad-row">
        <button class="pad-btn" data-lane="0" style="background:#00f5d4;">D / 1</button>
        <button class="pad-btn" data-lane="1" style="background:#ffcc00;">F / 2</button>
        <button class="pad-btn" data-lane="2" style="background:#ff2a85; color:#fff;">J / 3</button>
        <button class="pad-btn" data-lane="3" style="background:#a855f7; color:#fff;">K / 4</button>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('rhythm-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const HIT_Y = H - 85;
        const LANES = [
            { color: '#00f5d4', freq: 261.63 },
            { color: '#ffcc00', freq: 329.63 },
            { color: '#ff2a85', freq: 392.00 },
            { color: '#a855f7', freq: 523.25 }
        ];

        const hudCombo = document.getElementById('hud-combo');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('rhythm-overlay');
        const rhythmDesc = document.getElementById('rhythm-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('rhythm', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNote(freq, dur = 0.14, type = 'triangle') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.14, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        let running = false;
        let score = 0;
        let combo = 0;
        let misses = 0;
        let notes = [];
        let spawnTimer = 0;
        let feedback = { text: '', color: '#fff', life: 0 };
        let flashLane = [0, 0, 0, 0];

        function startGame() {
            score = 0;
            combo = 0;
            misses = 0;
            notes = [];
            spawnTimer = 20;
            updateHud();
            overlay.classList.add('hidden');
            running = true;
            playNote(523.25, 0.18);
        }

        function updateHud() {
            hudCombo.innerText = `${combo}x`;
            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('rhythm', { highScore: bestScore }, playerName);
            }
        }

        function triggerLane(laneIdx) {
            if (!running) return;
            flashLane[laneIdx] = 1;
            let hitIdx = -1;
            let bestDist = 999;
            for (let i = 0; i < notes.length; i++) {
                if (notes[i].lane === laneIdx) {
                    const d = Math.abs(notes[i].y - HIT_Y);
                    if (d < 68 && d < bestDist) {
                        bestDist = d;
                        hitIdx = i;
                    }
                }
            }

            if (hitIdx !== -1) {
                notes.splice(hitIdx, 1);
                combo++;
                const mult = Math.min(8, 1 + Math.floor(combo / 6));
                const pts = (bestDist < 24 ? 100 : 60) * mult;
                score += pts;
                feedback = {
                    text: bestDist < 24 ? `PERFEITO! +${pts}` : `BOM! +${pts}`,
                    color: bestDist < 24 ? '#00f5d4' : '#ffcc00',
                    life: 1
                };
                playNote(LANES[laneIdx].freq * (combo % 8 === 0 ? 1.5 : 1), 0.15);
                updateHud();
            } else {
                combo = 0;
                playNote(130, 0.1, 'sawtooth');
                updateHud();
            }
        }

        function update() {
            if (!running) return;

            spawnTimer--;
            if (spawnTimer <= 0) {
                const lane = Math.floor(Math.random() * 4);
                notes.push({ lane, y: -30, speed: 5.2 + Math.min(4.5, score / 2500) });
                spawnTimer = Math.max(18, 36 - Math.floor(score / 800));
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                notes[i].y += notes[i].speed;
                if (notes[i].y > H + 25) {
                    notes.splice(i, 1);
                    combo = 0;
                    misses++;
                    feedback = { text: 'PERDEU!', color: '#ff2a5f', life: 1 };
                    updateHud();
                    if (misses >= 10) {
                        running = false;
                        rhythmDesc.innerHTML = `🎵 <strong>FIM DO SHOW!</strong><br>Você marcou <strong>${score} PTS</strong> no palco Neon Beats!`;
                        overlay.classList.remove('hidden');
                        return;
                    }
                }
            }

            for (let i = 0; i < 4; i++) {
                if (flashLane[i] > 0) flashLane[i] = Math.max(0, flashLane[i] - 0.1);
            }
            if (feedback.life > 0) feedback.life -= 0.04;
        }

        function draw() {
            ctx.fillStyle = '#090314';
            ctx.fillRect(0, 0, W, H);

            const lw = W / 4;
            for (let i = 0; i < 4; i++) {
                if (flashLane[i] > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${flashLane[i] * 0.18})`;
                    ctx.fillRect(i * lw, 0, lw, H);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.moveTo(i * lw, 0);
                ctx.lineTo(i * lw, H);
                ctx.stroke();

                // Target receptor
                ctx.save();
                ctx.strokeStyle = LANES[i].color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(i * lw + lw / 2, HIT_Y, 28, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Notes
            for (const n of notes) {
                const x = n.lane * lw + lw / 2;
                ctx.save();
                ctx.fillStyle = LANES[n.lane].color;
                ctx.shadowColor = LANES[n.lane].color;
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(x, n.y, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            if (feedback.life > 0) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, feedback.life);
                ctx.font = '900 30px Fredoka';
                ctx.fillStyle = feedback.color;
                ctx.textAlign = 'center';
                ctx.fillText(feedback.text, W / 2, H / 2);
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'd' || k === '1' || e.key === 'ArrowLeft') triggerLane(0);
            if (k === 'f' || k === '2' || e.key === 'ArrowDown') triggerLane(1);
            if (k === 'j' || k === '3' || e.key === 'ArrowUp') triggerLane(2);
            if (k === 'k' || k === '4' || e.key === 'ArrowRight') triggerLane(3);
        });

        document.querySelectorAll('.pad-btn').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                triggerLane(parseInt(btn.dataset.lane, 10));
            });
        });

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const lane = Math.min(3, Math.max(0, Math.floor(mx / (W / 4))));
            triggerLane(lane);
        });

        document.getElementById('btn-start-rhythm').addEventListener('click', startGame);
        loop();
    </script>
</body>
</html>
