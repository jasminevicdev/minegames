<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio Rápido de Desenho: Speed Draw ✏️⏱️ — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #4c1d95 0%, #140524 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 1040px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #fde047;
            color: #fff;
            padding: 7px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #fde047;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }
        .challenge-banner {
            width: 100%;
            max-width: 1040px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.35), rgba(168, 85, 247, 0.35));
            border: 2px solid #fde047;
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .prompt-title { font-family: 'Fredoka', sans-serif; font-size: 1.25rem; color: #fde047; }
        .draw-grid {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 14px;
        }
        @media (max-width: 820px) {
            .draw-grid { grid-template-columns: 1fr; }
        }
        .board-box {
            background: rgba(24, 7, 45, 0.92);
            border: 3px solid #f472b6;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            background: #ffffff;
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .side-box {
            background: rgba(32, 9, 54, 0.95);
            border: 3px solid #c084fc;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .label { font-family: 'Fredoka', sans-serif; color: #e9d5ff; font-size: 0.88rem; margin-bottom: 5px; }
        .row-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .marker {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.45);
            cursor: pointer;
        }
        .marker.active { border-color: #fde047; transform: scale(1.16); }
        .btn-opt {
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .btn-submit {
            margin-top: auto;
            background: linear-gradient(135deg, #fde047, #ec4899, #38bdf8);
            color: #1e0936;
            border: none;
            padding: 14px;
            border-radius: 28px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div style="display:flex; gap:8px;">
            <div class="stat-pill">PONTOS: <strong id="hud-score">0 ✏️</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0 ✏️</strong></div>
        </div>
    </div>

    <div class="challenge-banner">
        <div>
            <span style="font-size:0.78rem; color:#fbcfe8; font-weight:700;">🎯 DESAFIO ATUAL DE DESENHO:</span>
            <div class="prompt-title" id="prompt-text">Desenhe: UMA COROA REAL 👑</div>
        </div>
        <button class="btn-opt" id="btn-next-prompt">🎲 Sortear Outro Tema</button>
    </div>

    <div class="draw-grid">
        <div class="board-box">
            <canvas id="draw-canvas" width="460" height="460"></canvas>
            <p id="draw-msg" style="margin-top:8px; font-family:'Fredoka',sans-serif; color:#fde047; text-align:center;">
                Siga o pontilhado guia ou desenhe do seu jeito para os jurados avaliarem! ✏️🌟
            </p>
        </div>

        <div class="side-box">
            <div>
                <div class="label">🖍️ CANETINHAS COLORIDAS:</div>
                <div class="row-wrap" id="markers-row"></div>
            </div>

            <div>
                <div class="label">🛠️ AJUDA & FERRAMENTAS:</div>
                <div class="row-wrap">
                    <button class="btn-opt" id="btn-guide">👁️ Guia Pontilhado: ON</button>
                    <button class="btn-opt" id="btn-clear">🗑️ Limpar Folha</button>
                </div>
            </div>

            <div style="background:rgba(0,0,0,0.35); border-radius:16px; padding:12px;">
                <div class="label">🏆 NOTA DOS JURADOS DE ARTE:</div>
                <p id="judges-note" style="font-family:'Fredoka',sans-serif; color:#fef08a; font-size:0.95rem;">
                    Aguardando sua obra-prima... 🎨
                </p>
            </div>

            <button class="btn-submit" id="btn-submit">✅ ENTREGAR DESENHO AOS JURADOS! (+PTS ✏️)</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const promptText = document.getElementById('prompt-text');
        const judgesNote = document.getElementById('judges-note');
        const drawMsg = document.getElementById('draw-msg');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('quickdraw', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = `${bestScore} ✏️`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 680) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.07, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.14);
            } catch (e) {}
        }

        const PROMPTS = [
            { title: 'UMA COROA REAL 👑', emoji: '👑' },
            { title: 'UM CORAÇÃO BRILHANTE 💖', emoji: '💖' },
            { title: 'UMA ESTRELA MÁGICA ⭐', emoji: '⭐' },
            { title: 'UMA BORBOLETA FOFA 🦋', emoji: '🦋' },
            { title: 'UMA GATINHA KAWAII 🐱', emoji: '🐱' },
            { title: 'UMA FLOR DE CEREJEIRA 🌸', emoji: '🌸' },
            { title: 'UM SOL SORRIDENTE ☀️', emoji: '☀️' }
        ];
        const MARKERS = ['#ec4899', '#eab308', '#3b82f6', '#a855f7', '#10b981', '#ef4444', '#1e1b4b'];

        let currentPromptIdx = 0;
        let markerColor = '#ec4899';
        let showGuide = true;
        let isDrawing = false;
        let lx = 0, ly = 0;
        let strokesCount = 0;
        let score = 0;

        function resetBoard() {
            strokesCount = 0;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            if (showGuide) {
                ctx.save();
                ctx.font = '240px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.13;
                ctx.fillText(PROMPTS[currentPromptIdx].emoji, W / 2, H / 2 + 12);
                ctx.restore();
            }
        }

        const mRow = document.getElementById('markers-row');
        MARKERS.forEach((m, i) => {
            const d = document.createElement('div');
            d.className = 'marker' + (i === 0 ? ' active' : '');
            d.style.background = m;
            d.onclick = () => {
                document.querySelectorAll('.marker').forEach(el => el.classList.remove('active'));
                d.classList.add('active');
                markerColor = m;
                sfx(620);
            };
            mRow.appendChild(d);
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((cx - rect.left) / rect.width) * W,
                y: ((cy - rect.top) / rect.height) * H
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const p = getPos(e);
            lx = p.x;
            ly = p.y;
            strokesCount++;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const p = getPos(e);
            ctx.strokeStyle = markerColor;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            lx = p.x;
            ly = p.y;
            strokesCount++;
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const p = getPos(e);
            lx = p.x;
            ly = p.y;
            strokesCount++;
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e);
            ctx.strokeStyle = markerColor;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            lx = p.x;
            ly = p.y;
            strokesCount++;
        }, { passive: false });
        window.addEventListener('touchend', () => { isDrawing = false; });

        document.getElementById('btn-guide').onclick = (e) => {
            showGuide = !showGuide;
            e.target.innerText = `👁️ Guia Pontilhado: ${showGuide ? 'ON' : 'OFF'}`;
            resetBoard();
        };

        document.getElementById('btn-clear').onclick = () => {
            resetBoard();
            sfx(480);
        };

        document.getElementById('btn-next-prompt').onclick = () => {
            currentPromptIdx = (currentPromptIdx + 1) % PROMPTS.length;
            promptText.innerText = `Desenhe: ${PROMPTS[currentPromptIdx].title}`;
            resetBoard();
            sfx(740);
        };

        document.getElementById('btn-submit').onclick = () => {
            if (strokesCount < 5) {
                judgesNote.innerText = '✏️ Faça alguns traços na folha antes de entregar!';
                sfx(400);
                return;
            }
            const stars = Math.min(10, 8 + Math.floor(Math.random() * 3));
            const pts = stars * 20;
            score += pts;
            hudScore.innerText = `${score} ✏️`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = `${bestScore} ✏️`;
                SaveHub.updateGameSave('quickdraw', { highScore: bestScore }, playerName);
            }
            sfx(940);
            judgesNote.innerText = `🌟 NOTA ${stars}/10! "Traço super criativo!" (+${pts} ✏️)`;
            drawMsg.innerText = `🎉 Desafio concluído! Próximo tema liberado!`;
            currentPromptIdx = (currentPromptIdx + 1) % PROMPTS.length;
            promptText.innerText = `Desenhe: ${PROMPTS[currentPromptIdx].title}`;
            setTimeout(resetBoard, 900);
        };

        resetBoard();
    </script>
</body>
</html>
