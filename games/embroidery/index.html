<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê de Bordado & Ponto Cruz Real — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #4c1d95, #140526 80%);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1120px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(244,114,182,0.4);
        }
        .back-btn {
            text-decoration: none; color: #fbcfe8; font-weight: 700;
            background: rgba(236,72,153,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(236,72,153,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.45rem; color: #f9a8d4; }
        .score-pill {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            padding: 7px 16px; border-radius: 999px; font-weight: 700;
        }
        .studio {
            display: grid; grid-template-columns: 300px 1fr; gap: 18px;
            width: 100%; max-width: 1120px; padding: 16px; flex: 1; align-items: start;
        }
        @media (max-width: 860px) { .studio { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(32, 12, 54, 0.92); border: 2px solid rgba(244,114,182,0.35);
            border-radius: 22px; padding: 15px; display: flex; flex-direction: column; gap: 11px;
        }
        .panel h3 { font-family: 'Fredoka', sans-serif; color: #fbcfe8; font-size: 0.94rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .btn-opt {
            padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07); color: #fff; font-weight: 700; cursor: pointer;
            font-size: 0.81rem;
        }
        .btn-opt.active, .btn-opt:hover {
            background: linear-gradient(135deg, #ec4899, #a855f7); border-color: #fff;
        }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .sw { height: 28px; border-radius: 8px; cursor: pointer; border: 2px solid rgba(255,255,255,0.4); }
        .sw.active { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 8px #fff; }
        .btn-action {
            padding: 11px; border-radius: 12px; border: none; font-weight: 700;
            cursor: pointer; font-family: 'Fredoka', sans-serif; font-size: 0.93rem;
        }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-clear { background: rgba(239,68,68,0.22); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
        .stage {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(16, 6, 30, 0.88); border-radius: 24px;
            border: 3px solid rgba(244,114,182,0.4); padding: 16px;
        }
        canvas {
            border-radius: 50%; max-width: 100%; height: auto;
            box-shadow: 0 0 0 14px #d97706, 0 12px 35px rgba(0,0,0,0.6);
            cursor: pointer; touch-action: none;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>🧵 Ateliê de Bordado & Ponto Cruz Real</h1>
        <div class="score-pill">Bordados: <span id="scoreVal">0</span> 🧵</div>
    </header>

    <main class="studio">
        <aside class="panel">
            <h3>🧵 1. Fios de Seda & Ouro</h3>
            <div class="palette" id="palette"></div>

            <h3>🌸 2. Moldes de Ponto Cruz</h3>
            <div class="grid-2" id="patternBtns">
                <button class="btn-opt" data-p="heart">💖 Coração Real</button>
                <button class="btn-opt" data-p="rose">🌹 Rosa Imperial</button>
                <button class="btn-opt" data-p="crown">👑 Coroa Ouro</button>
                <button class="btn-opt" data-p="kitty">🐱 Gatinha</button>
            </div>

            <button class="btn-action btn-save" id="saveBtn">🏆 Finalizar Bastidor (+1 🧵)</button>
            <button class="btn-action btn-clear" id="clearBtn">✂️ Desfazer Pontos</button>
        </aside>

        <section class="stage">
            <canvas id="hoopCanvas" width="480" height="480"></canvas>
            <p style="margin-top:16px; color:#fbcfe8; font-size:0.86rem;">Clique ou arraste na trama do tecido para bordar pontos cruzados de seda!</p>
        </section>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('embroidery', activePlayer);
        let bestScore = save?.highScore || 0;
        const scoreEl = document.getElementById('scoreVal');
        scoreEl.textContent = bestScore;

        const canvas = document.getElementById('hoopCanvas');
        const ctx = canvas.getContext('2d');
        const N = 15, CELL = 480 / N;
        const THREADS = ['#e11d48', '#f472b6', '#fbbf24', '#10b981', '#06b6d4', '#3b82f6', '#a855f7', '#451a03', '#1e293b', '#ffffff'];

        let currentThread = THREADS[0];
        let stitches = Array.from({ length: N * N }, () => null);
        let isDown = false;

        const pal = document.getElementById('palette');
        THREADS.forEach((c, i) => {
            const d = document.createElement('div');
            d.className = 'sw' + (i === 0 ? ' active' : '');
            d.style.background = c;
            d.addEventListener('click', () => {
                document.querySelectorAll('#palette .sw').forEach(s => s.classList.remove('active'));
                d.classList.add('active');
                currentThread = c;
            });
            pal.appendChild(d);
        });

        function render() {
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(0, 0, 480, 480);

            // Linen fabric weave lines
            ctx.strokeStyle = 'rgba(180, 83, 9, 0.16)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= N; i++) {
                ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 480); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(480, i * CELL); ctx.stroke();
            }

            // Draw Cross Stitches (X)
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const col = stitches[r * N + c];
                    if (!col) continue;
                    const x = c * CELL, y = r * CELL;
                    ctx.save();
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 5); ctx.lineTo(x + CELL - 5, y + CELL - 5);
                    ctx.moveTo(x + CELL - 5, y + 5); ctx.lineTo(x + 5, y + CELL - 5);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        function stitchAt(e) {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor(((e.clientX - rect.left) * (480 / rect.width)) / CELL);
            const r = Math.floor(((e.clientY - rect.top) * (480 / rect.height)) / CELL);
            if (r >= 0 && r < N && c >= 0 && c < N) {
                stitches[r * N + c] = currentThread;
                render();
            }
        }

        canvas.addEventListener('pointerdown', e => { isDown = true; stitchAt(e); });
        window.addEventListener('pointermove', e => { if (isDown) stitchAt(e); });
        window.addEventListener('pointerup', () => { isDown = false; });

        document.querySelectorAll('#patternBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                stitches.fill(null);
                const p = btn.dataset.p;
                for (let r = 3; r < 12; r++) {
                    for (let c = 3; c < 12; c++) {
                        const dx = c - 7, dy = r - 7;
                        if (p === 'heart' && (dx*dx + (dy+1)*(dy+1) <= 14)) {
                            stitches[r * N + c] = '#e11d48';
                        } else if (p === 'rose' && (dx*dx + dy*dy <= 12)) {
                            stitches[r * N + c] = (dx*dx + dy*dy <= 4) ? '#f472b6' : '#e11d48';
                        } else if (p === 'crown' && r >= 5 && r <= 10) {
                            stitches[r * N + c] = '#fbbf24';
                        } else if (p === 'kitty' && (dx*dx + dy*dy <= 11)) {
                            stitches[r * N + c] = '#f472b6';
                        }
                    }
                }
                render();
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => { stitches.fill(null); render(); });
        document.getElementById('saveBtn').addEventListener('click', () => {
            bestScore += 1;
            scoreEl.textContent = bestScore;
            SaveHub.updateGameSave('embroidery', { highScore: bestScore }, activePlayer);
        });

        render();
    </script>
</body>
</html>
