<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de Colagem & Cenários Kawaii — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #3b0764, #140524);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1140px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(244,114,182,0.35);
        }
        .back-btn {
            text-decoration: none; color: #fbcfe8; font-weight: 700;
            background: rgba(236,72,153,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(236,72,153,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.45rem; color: #f9a8d4; }
        .score-pill {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            padding: 7px 16px; border-radius: 999px; font-weight: 700;
        }
        .studio {
            display: grid; grid-template-columns: 310px 1fr; gap: 18px;
            width: 100%; max-width: 1140px; padding: 16px; flex: 1;
        }
        @media (max-width: 860px) { .studio { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(35, 12, 58, 0.9); border: 2px solid rgba(244,114,182,0.35);
            border-radius: 22px; padding: 15px; display: flex; flex-direction: column; gap: 11px;
        }
        .panel h3 { font-family: 'Fredoka', sans-serif; color: #fbcfe8; font-size: 0.95rem; }
        .bg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-opt {
            padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07); color: #fff; font-weight: 700; cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-opt.active, .btn-opt:hover {
            background: linear-gradient(135deg, #ec4899, #a855f7); border-color: #fff;
        }
        .sticker-tray {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
            background: rgba(0,0,0,0.28); padding: 8px; border-radius: 14px;
        }
        .stk-btn {
            font-size: 1.55rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; padding: 6px 0; cursor: pointer; transition: transform 0.15s;
        }
        .stk-btn:hover { transform: scale(1.18); background: rgba(236,72,153,0.35); }
        .color-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .swatch {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .swatch.active { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 8px #fff; }
        .btn-action {
            padding: 10px; border-radius: 12px; border: none; font-weight: 700;
            cursor: pointer; font-family: 'Fredoka', sans-serif; font-size: 0.92rem;
        }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-clear { background: rgba(239,68,68,0.22); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
        .canvas-wrap {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(15, 5, 28, 0.85); border-radius: 24px;
            border: 3px solid rgba(244,114,182,0.4); padding: 16px;
        }
        canvas {
            background: #fff; border-radius: 18px; max-width: 100%; height: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5); cursor: pointer; touch-action: none;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>📒 Álbum de Colagem & Cenários Kawaii</h1>
        <div class="score-pill">Álbuns: <span id="scoreVal">0</span> 📒</div>
    </header>

    <main class="studio">
        <aside class="panel">
            <h3>🏞️ Cenário do Álbum</h3>
            <div class="bg-grid" id="bgBtns">
                <button class="btn-opt active" data-bg="clouds">☁️ Palácio Nuvens</button>
                <button class="btn-opt" data-bg="beach">🧜‍♀️ Praia Sereia</button>
                <button class="btn-opt" data-bg="sakura">🌸 Jardim Sakura</button>
                <button class="btn-opt" data-bg="space">🌌 Galáxia Fofa</button>
            </div>

            <h3>🎀 Clique para Adicionar Adesivo (Arraste no Álbum!)</h3>
            <div class="sticker-tray" id="tray">
                <button class="stk-btn">🦄</button><button class="stk-btn">🧜‍♀️</button>
                <button class="stk-btn">🧚‍♀️</button><button class="stk-btn">🐱</button>
                <button class="stk-btn">🐰</button><button class="stk-btn">👑</button>
                <button class="stk-btn">🎀</button><button class="stk-btn">💖</button>
                <button class="stk-btn">🌈</button><button class="stk-btn">⭐</button>
                <button class="stk-btn">🍓</button><button class="stk-btn">🧁</button>
                <button class="stk-btn">🍭</button><button class="stk-btn">🌸</button>
                <button class="stk-btn">🦋</button>
            </div>

            <h3>📏 Tamanho do Adesivo Selecionado: <span id="sizeVal">64px</span></h3>
            <input type="range" id="stkSize" min="32" max="130" value="64">

            <h3>🖊️ Modo Caneta Gel Brilhante</h3>
            <div class="bg-grid">
                <button class="btn-opt active" id="modeMove">🖐️ Mover Adesivos</button>
                <button class="btn-opt" id="modeDraw">🖊️ Desenhar Gel</button>
            </div>
            <div class="color-row" id="colorRow">
                <div class="swatch active" style="background:#ff4da6" data-c="#ff4da6"></div>
                <div class="swatch" style="background:#fde047" data-c="#fde047"></div>
                <div class="swatch" style="background:#38bdf8" data-c="#38bdf8"></div>
                <div class="swatch" style="background:#a855f7" data-c="#a855f7"></div>
                <div class="swatch" style="background:#4ade80" data-c="#4ade80"></div>
                <div class="swatch" style="background:#ffffff" data-c="#ffffff"></div>
            </div>

            <button class="btn-action btn-save" id="saveBtn">🏆 Salvar Página no Álbum (+1 📒)</button>
            <button class="btn-action btn-clear" id="clearBtn">🗑️ Limpar Página</button>
        </aside>

        <section class="canvas-wrap">
            <canvas id="albumCanvas" width="640" height="500"></canvas>
        </section>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const activePlayer = SaveHub.getActivePlayer() || 'Convidado';
        const save = SaveHub.getGameSave('stickerbook', activePlayer);
        let bestScore = save?.highScore || 0;
        const scoreEl = document.getElementById('scoreVal');
        scoreEl.textContent = bestScore;

        const canvas = document.getElementById('albumCanvas');
        const ctx = canvas.getContext('2d');

        let currentBg = 'clouds';
        let mode = 'move';
        let penColor = '#ff4da6';
        let stickers = [
            { emoji: '🦄', x: 200, y: 270, size: 78 },
            { emoji: '🌈', x: 320, y: 140, size: 95 },
            { emoji: '👑', x: 200, y: 205, size: 46 }
        ];
        let strokes = [];
        let activeStroke = null;
        let selectedSticker = stickers[0];
        let dragging = false;

        function drawBackground() {
            const w = canvas.width, h = canvas.height;
            if (currentBg === 'clouds') {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#a5f3fc'); g.addColorStop(0.6, '#fbcfe8'); g.addColorStop(1, '#f9a8d4');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                [[120, 390, 90], [220, 410, 110], [380, 400, 100], [520, 390, 95]].forEach(([x, y, r]) => {
                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
                });
            } else if (currentBg === 'beach') {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#38bdf8'); g.addColorStop(0.55, '#06b6d4'); g.addColorStop(0.56, '#fde68a'); g.addColorStop(1, '#f59e0b');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            } else if (currentBg === 'sakura') {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, '#fce7f3'); g.addColorStop(0.65, '#fbcfe8'); g.addColorStop(0.66, '#86efac'); g.addColorStop(1, '#22c55e');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            } else {
                const g = ctx.createRadialGradient(320, 250, 30, 320, 250, 400);
                g.addColorStop(0, '#4c1d95'); g.addColorStop(1, '#090514');
                ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            }
            // Scrapbook dashed border
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 8]);
            ctx.strokeRect(14, 14, w - 28, h - 28);
            ctx.setLineDash([]);
        }

        function render() {
            drawBackground();
            // Draw gel pen strokes
            strokes.forEach(st => {
                if (st.pts.length < 2) return;
                ctx.save();
                ctx.strokeStyle = st.color;
                ctx.shadowColor = st.color;
                ctx.shadowBlur = 8;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                st.pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.stroke();
                ctx.restore();
            });
            // Draw stickers
            stickers.forEach(s => {
                ctx.save();
                ctx.font = `${s.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 8;
                ctx.fillText(s.emoji, s.x, s.y);
                if (s === selectedSticker && mode === 'move') {
                    ctx.strokeStyle = '#ec4899';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(s.x - s.size * 0.6, s.y - s.size * 0.6, s.size * 1.2, s.size * 1.2);
                }
                ctx.restore();
            });
        }

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (canvas.width / r.width),
                y: (e.clientY - r.top) * (canvas.height / r.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const p = getPos(e);
            if (mode === 'draw') {
                activeStroke = { color: penColor, pts: [p] };
                strokes.push(activeStroke);
                render();
                return;
            }
            for (let i = stickers.length - 1; i >= 0; i--) {
                const s = stickers[i];
                if (Math.hypot(p.x - s.x, p.y - s.y) < s.size * 0.6) {
                    selectedSticker = s;
                    dragging = true;
                    document.getElementById('stkSize').value = s.size;
                    document.getElementById('sizeVal').textContent = s.size + 'px';
                    render();
                    return;
                }
            }
            selectedSticker = null;
            render();
        });

        window.addEventListener('pointermove', (e) => {
            if (mode === 'draw' && activeStroke) {
                activeStroke.pts.push(getPos(e));
                render();
            } else if (dragging && selectedSticker) {
                const p = getPos(e);
                selectedSticker.x = p.x;
                selectedSticker.y = p.y;
                render();
            }
        });

        window.addEventListener('pointerup', () => {
            dragging = false;
            activeStroke = null;
        });

        document.querySelectorAll('#tray .stk-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const s = {
                    emoji: btn.textContent,
                    x: 180 + Math.random() * 280,
                    y: 150 + Math.random() * 200,
                    size: Number(document.getElementById('stkSize').value)
                };
                stickers.push(s);
                selectedSticker = s;
                render();
            });
        });

        document.getElementById('stkSize').addEventListener('input', (e) => {
            const val = Number(e.target.value);
            document.getElementById('sizeVal').textContent = val + 'px';
            if (selectedSticker) {
                selectedSticker.size = val;
                render();
            }
        });

        document.querySelectorAll('#bgBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#bgBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBg = btn.dataset.bg;
                render();
            });
        });

        document.getElementById('modeMove').addEventListener('click', () => {
            mode = 'move';
            document.getElementById('modeMove').classList.add('active');
            document.getElementById('modeDraw').classList.remove('active');
            render();
        });
        document.getElementById('modeDraw').addEventListener('click', () => {
            mode = 'draw';
            document.getElementById('modeDraw').classList.add('active');
            document.getElementById('modeMove').classList.remove('active');
            render();
        });

        document.querySelectorAll('#colorRow .swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                document.querySelectorAll('#colorRow .swatch').forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                penColor = sw.dataset.c;
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            stickers = [];
            strokes = [];
            selectedSticker = null;
            render();
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            bestScore += 1;
            scoreEl.textContent = bestScore;
            SaveHub.updateGameSave('stickerbook', { highScore: bestScore }, activePlayer);
        });

        render();
    </script>
</body>
</html>
