<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Coroas de Flores & Guirlandas Reais HD — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #831843, #170412 80%);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1180px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(244,114,182,0.45);
        }
        .back-btn {
            text-decoration: none; color: #fbcfe8; font-weight: 700;
            background: rgba(236,72,153,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(244,114,182,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.45rem; color: #f9a8d4; }
        .score-pill {
            background: linear-gradient(135deg, #ec4899, #eab308);
            padding: 7px 16px; border-radius: 999px; font-weight: 700; color: #1f0410;
        }
        .studio {
            display: grid; grid-template-columns: 340px 1fr; gap: 18px;
            width: 100%; max-width: 1180px; padding: 16px; flex: 1; align-items: start;
        }
        @media (max-width: 880px) { .studio { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(45, 10, 34, 0.94); border: 2px solid rgba(244,114,182,0.35);
            border-radius: 22px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .panel h3 { font-family: 'Fredoka', sans-serif; color: #fbcfe8; font-size: 0.91rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-opt {
            padding: 8px 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07); color: #fff; font-weight: 700; cursor: pointer;
            font-size: 0.79rem;
        }
        .btn-opt.active, .btn-opt:hover {
            background: linear-gradient(135deg, #ec4899, #10b981); border-color: #fff;
        }
        .btn-action {
            padding: 10px; border-radius: 12px; border: none; font-weight: 700;
            cursor: pointer; font-family: 'Fredoka', sans-serif; font-size: 0.91rem;
        }
        .btn-save { background: linear-gradient(135deg, #34d399, #fde047); color: #052e16; }
        .stage {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(20, 5, 16, 0.9); border-radius: 24px;
            border: 3px solid rgba(244,114,182,0.4); padding: 16px;
        }
        canvas { border-radius: 18px; max-width: 100%; height: auto; box-shadow: 0 12px 35px rgba(0,0,0,0.6); cursor: pointer; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>🌸 Estúdio de Coroas de Flores & Guirlandas Reais — Edição HD</h1>
        <div class="score-pill">Guirlandas: <span id="scoreVal">0</span> 🌸</div>
    </header>

    <main class="studio">
        <aside class="panel">
            <h3>🌿 1. Aro Botânico da Guirlanda</h3>
            <div class="grid-2" id="vineBtns">
                <button class="btn-opt active" data-v="#10b981">🌿 Hera Esmeralda</button>
                <button class="btn-opt" data-v="#fde047">✨ Ramos de Ouro</button>
                <button class="btn-opt" data-v="#f472b6">🌸 Cipó Sakura</button>
                <button class="btn-opt" data-v="#a855f7">🔮 Lavanda Real</button>
            </div>

            <h3>🌺 2. Flores & Joias (Toque no Aro)</h3>
            <div class="grid-2" id="flowerBtns">
                <button class="btn-opt active" data-f="🌸">🌸 Flor Sakura</button>
                <button class="btn-opt" data-f="🌹">🌹 Rosa Imperial</button>
                <button class="btn-opt" data-f="🌻">🌻 Girassol Ouro</button>
                <button class="btn-opt" data-f="🌺">🌺 Hibisco Real</button>
                <button class="btn-opt" data-f="🌷">🌷 Tulipa Rosa</button>
                <button class="btn-opt" data-f="🦋">🦋 Borboleta Luz</button>
                <button class="btn-opt" data-f="💎">💎 Cristal Orvalho</button>
                <button class="btn-opt" data-f="🍓">🍓 Frutinha Doce</button>
            </div>

            <h3>🎀 3. Laço Imperial & Simetria</h3>
            <div class="grid-2" id="bowBtns">
                <button class="btn-opt active" data-b="🎀">🎀 Laço de Cetim</button>
                <button class="btn-opt" data-b="👑">👑 Tiara Dourada</button>
                <button class="btn-opt" id="symToggle">🎡 Mandalar (8x): ON</button>
                <button class="btn-opt" id="autoBloom">🪄 Florescer Tudo</button>
            </div>

            <div class="grid-2">
                <button class="btn-action" id="clearBtn" style="background:rgba(239,68,68,0.22); color:#fca5a5;">🧹 Limpar Flores</button>
                <button class="btn-action" id="photoBtn" style="background:linear-gradient(135deg,#38bdf8,#a855f7); color:#fff;">📸 Foto PNG</button>
            </div>
            <button class="btn-action btn-save" id="saveBtn">🏆 Consagrar Coroa Floral (+1 🌸)</button>
        </aside>

        <section class="stage">
            <canvas id="crownCanvas" width="540" height="520"></canvas>
            <p style="margin-top:8px; color:#fbcfe8; font-size:0.84rem;">💡 Toque no aro para tecer flores! Com "Mandalar (8x): ON", as flores se multiplicam em círculo perfeito!</p>
        </section>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('flowercrown', activePlayer);
        let bestScore = save?.highScore || 0;
        const scoreEl = document.getElementById('scoreVal');
        scoreEl.textContent = bestScore;

        const canvas = document.getElementById('crownCanvas');
        const ctx = canvas.getContext('2d');
        const CX = 270, CY = 260, R = 165;

        let vineColor = '#10b981';
        let selectedFlower = '🌸';
        let topBow = '🎀';
        let radialSym = true;
        let blooms = [];

        function seedInitial() {
            blooms = [];
            for (let i = 0; i < 8; i++) {
                const a = (i * Math.PI * 2) / 8;
                blooms.push({ x: CX + Math.cos(a) * R, y: CY + Math.sin(a) * R, f: i % 2 === 0 ? '🌸' : '🌹' });
            }
        }
        seedInitial();

        function render() {
            const bg = ctx.createRadialGradient(CX, CY, 30, CX, CY, 340);
            bg.addColorStop(0, '#500724'); bg.addColorStop(1, '#14030b');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, 540, 520);

            // Flowing Silk Ribbons at bottom
            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(CX - 20, CY + R); ctx.quadraticCurveTo(CX - 55, 480, CX - 35, 505);
            ctx.moveTo(CX + 20, CY + R); ctx.quadraticCurveTo(CX + 55, 480, CX + 35, 505);
            ctx.stroke();

            // Woven Botanical Wreath Base
            ctx.strokeStyle = vineColor;
            ctx.lineWidth = 24;
            ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();

            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 8]);
            ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);

            // Placed Flowers & Jewels
            ctx.font = '40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            blooms.forEach(b => ctx.fillText(b.f, b.x, b.y));

            // Top Center Crown / Ribbon Bow
            ctx.font = '56px sans-serif';
            ctx.fillText(topBow, CX, CY - R);
        }

        canvas.addEventListener('pointerdown', e => {
            const r = canvas.getBoundingClientRect();
            const x = (e.clientX - r.left) * (540 / r.width);
            const y = (e.clientY - r.top) * (520 / r.height);
            if (!radialSym) {
                blooms.push({ x, y, f: selectedFlower });
            } else {
                const dist = Math.hypot(x - CX, y - CY);
                const baseAng = Math.atan2(y - CY, x - CX);
                for (let i = 0; i < 8; i++) {
                    const a = baseAng + (i * Math.PI * 2) / 8;
                    blooms.push({ x: CX + Math.cos(a) * dist, y: CY + Math.sin(a) * dist, f: selectedFlower });
                }
            }
            render();
        });

        document.querySelectorAll('#vineBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#vineBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                vineColor = btn.dataset.v;
                render();
            });
        });

        document.querySelectorAll('#flowerBtns .btn-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#flowerBtns .btn-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedFlower = btn.dataset.f;
            });
        });

        document.querySelectorAll('#bowBtns .btn-opt[data-b]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#bowBtns .btn-opt[data-b]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                topBow = btn.dataset.b;
                render();
            });
        });

        const symBtn = document.getElementById('symToggle');
        symBtn.classList.add('active');
        symBtn.addEventListener('click', () => {
            radialSym = !radialSym;
            symBtn.classList.toggle('active', radialSym);
            symBtn.textContent = radialSym ? '🎡 Mandalar (8x): ON' : '🌸 Flor Única: ON';
        });

        document.getElementById('autoBloom').addEventListener('click', () => {
            const list = ['🌸', '🌹', '🌺', '🌷', '🦋', '💎'];
            const f1 = list[Math.floor(Math.random() * list.length)];
            const f2 = list[Math.floor(Math.random() * list.length)];
            blooms = [];
            for (let i = 0; i < 12; i++) {
                const a = (i * Math.PI * 2) / 12;
                blooms.push({ x: CX + Math.cos(a) * R, y: CY + Math.sin(a) * R, f: i % 2 === 0 ? f1 : f2 });
            }
            render();
        });

        document.getElementById('clearBtn').addEventListener('click', () => { blooms = []; render(); });
        document.getElementById('photoBtn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = 'minha-coroa-de-flores.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
        document.getElementById('saveBtn').addEventListener('click', () => {
            bestScore += 1;
            scoreEl.textContent = bestScore;
            SaveHub.updateGameSave('flowercrown', { highScore: bestScore }, activePlayer);
        });

        render();
    </script>
</body>
</html>
