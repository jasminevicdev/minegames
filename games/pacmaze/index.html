<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Labirinto (Pac-Neon) 👻 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at center, #090624 0%, #03020c 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            touch-action: none;
        }
        .topbar {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            border: 2px solid #ffcc00;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.18);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .stage-wrap {
            position: relative;
            width: 94vw;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            background: #050314;
            border: 3px solid #38bdf8;
            border-radius: 18px;
            box-shadow: 0 0 32px rgba(56, 189, 248, 0.35);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 3, 20, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .btn-start {
            background: linear-gradient(135deg, #ffcc00, #ff2a85);
            color: #050314;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }
        .dpad {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 62px);
            grid-template-rows: repeat(2, 46px);
            gap: 8px;
        }
        .btn-dir {
            background: rgba(56, 189, 248, 0.18);
            border: 2px solid #38bdf8;
            color: #fff;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ HUB</a>
        <div class="stat-pill">VIDAS: <strong id="hud-lives">🍒🍒🍒</strong></div>
        <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
        <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
    </div>

    <div class="stage-wrap">
        <canvas id="pac-canvas" width="600" height="600"></canvas>
        <div class="overlay" id="pac-overlay">
            <h1>👻 CYBER LABIRINTO</h1>
            <p id="pac-desc">
                Colete todas as esferas neon no labirinto! Pegue as <strong>Super Pílulas Azuis ⚡</strong> para deixar os Fantasmas Glitches vulneráveis e devorá-los!
            </p>
            <button class="btn-start" id="btn-start-pac">ENTRAR NO LABIRINTO 🍒</button>
        </div>
    </div>

    <div class="dpad">
        <div></div>
        <button class="btn-dir" data-dx="0" data-dy="-1">⬆️</button>
        <div></div>
        <button class="btn-dir" data-dx="-1" data-dy="0">⬅️</button>
        <button class="btn-dir" data-dx="0" data-dy="1">⬇️</button>
        <button class="btn-dir" data-dx="1" data-dy="0">➡️</button>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('pac-canvas');
        const ctx = canvas.getContext('2d');
        const hudLives = document.getElementById('hud-lives');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const overlay = document.getElementById('pac-overlay');
        const pacDesc = document.getElementById('pac-desc');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('pacmaze', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 440, dur = 0.06, type = 'triangle') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.08, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        const MAP_TEMPLATE = [
            "111111111111111",
            "130000010000031",
            "101111010111101",
            "101000000000101",
            "101011101110101",
            "100010000010001",
            "111010111010111",
            "100000101000001",
            "111010111010111",
            "100010000010001",
            "101011101110101",
            "101000000000101",
            "101111010111101",
            "130000010000031",
            "111111111111111"
        ];
        const N = 15;
        const TILE = 600 / N;

        let grid = [];
        let pac = { x: 7, y: 11, dx: 0, dy: 0, nextDx: 0, nextDy: 0 };
        let ghosts = [];
        let powerTimer = 0;
        let score = 0;
        let lives = 3;
        let running = false;
        let tick = 0;

        function loadMap() {
            grid = MAP_TEMPLATE.map(row => row.split('').map(Number));
            resetPositions();
        }

        function resetPositions() {
            pac = { x: 7, y: 11, dx: 0, dy: 0, nextDx: 0, nextDy: 0 };
            ghosts = [
                { x: 6, y: 7, dx: 1, dy: 0, color: '#ff2a5f' },
                { x: 7, y: 7, dx: 0, dy: -1, color: '#00f5d4' },
                { x: 8, y: 7, dx: -1, dy: 0, color: '#a855f7' }
            ];
        }

        function startGame() {
            score = 0;
            lives = 3;
            powerTimer = 0;
            loadMap();
            updateHud();
            overlay.classList.add('hidden');
            running = true;
            sfx(540, 0.12);
        }

        function updateHud() {
            hudLives.innerText = '🍒'.repeat(Math.max(0, lives)) || '💀';
            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('pacmaze', { highScore: bestScore }, playerName);
            }
        }

        function canMove(x, y) {
            return y >= 0 && y < N && x >= 0 && x < N && grid[y][x] !== 1;
        }

        function stepGame() {
            if (!running) return;
            if (powerTimer > 0) powerTimer--;

            if (canMove(pac.x + pac.nextDx, pac.y + pac.nextDy)) {
                pac.dx = pac.nextDx;
                pac.dy = pac.nextDy;
            }
            if (canMove(pac.x + pac.dx, pac.y + pac.dy)) {
                pac.x += pac.dx;
                pac.y += pac.dy;
            }

            const cell = grid[pac.y][pac.x];
            if (cell === 0) {
                grid[pac.y][pac.x] = 2;
                score += 10;
                sfx(480, 0.04);
                updateHud();
            } else if (cell === 3) {
                grid[pac.y][pac.x] = 2;
                score += 50;
                powerTimer = 45;
                sfx(760, 0.16);
                updateHud();
            }

            const remaining = grid.flat().filter(v => v === 0 || v === 3).length;
            if (remaining === 0) {
                score += 300;
                sfx(880, 0.2);
                loadMap();
                updateHud();
                return;
            }

            for (const g of ghosts) {
                if (g.x === pac.x && g.y === pac.y) {
                    handleCollision(g);
                    if (!running) return;
                }

                const dirs = [
                    { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                    { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
                ].filter(d => canMove(g.x + d.dx, g.y + d.dy));

                const nonRev = dirs.filter(d => !(d.dx === -g.dx && d.dy === -g.dy));
                const pool = nonRev.length ? nonRev : dirs;
                if (pool.length) {
                    const pick = pool[Math.floor(Math.random() * pool.length)];
                    g.dx = pick.dx;
                    g.dy = pick.dy;
                    g.x += g.dx;
                    g.y += g.dy;
                }

                if (g.x === pac.x && g.y === pac.y) {
                    handleCollision(g);
                    if (!running) return;
                }
            }
        }

        function handleCollision(g) {
            if (powerTimer > 0) {
                score += 200;
                g.x = 7;
                g.y = 7;
                sfx(820, 0.14);
                updateHud();
            } else {
                lives--;
                sfx(160, 0.25, 'sawtooth');
                updateHud();
                if (lives <= 0) {
                    running = false;
                    pacDesc.innerHTML = `👻 <strong>FIM DE LABIRINTO!</strong><br>Você conquistou <strong>${score} PTS</strong>!`;
                    overlay.classList.remove('hidden');
                } else {
                    resetPositions();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#050314';
            ctx.fillRect(0, 0, 600, 600);

            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const v = grid[y] ? grid[y][x] : 1;
                    const px = x * TILE;
                    const py = y * TILE;
                    if (v === 1) {
                        ctx.fillStyle = '#1e1b4b';
                        ctx.strokeStyle = '#38bdf8';
                        ctx.lineWidth = 2;
                        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
                        ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
                    } else if (v === 0) {
                        ctx.fillStyle = '#fde047';
                        ctx.beginPath();
                        ctx.arc(px + TILE / 2, py + TILE / 2, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (v === 3) {
                        ctx.fillStyle = '#00f5d4';
                        ctx.beginPath();
                        ctx.arc(px + TILE / 2, py + TILE / 2, 10, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ctx.save();
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(pac.x * TILE + TILE / 2, pac.y * TILE + TILE / 2, TILE * 0.38, 0.2, Math.PI * 2 - 0.2);
            ctx.lineTo(pac.x * TILE + TILE / 2, pac.y * TILE + TILE / 2);
            ctx.fill();
            ctx.restore();

            for (const g of ghosts) {
                ctx.save();
                const col = powerTimer > 0 ? '#3b82f6' : g.color;
                ctx.fillStyle = col;
                ctx.shadowColor = col;
                ctx.shadowBlur = 14;
                const gx = g.x * TILE + TILE / 2;
                const gy = g.y * TILE + TILE / 2;
                ctx.beginPath();
                ctx.arc(gx, gy - 3, TILE * 0.36, Math.PI, 0);
                ctx.lineTo(gx + TILE * 0.36, gy + TILE * 0.36);
                ctx.lineTo(gx - TILE * 0.36, gy + TILE * 0.36);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(gx - 5, gy - 4, 3.5, 0, Math.PI * 2);
                ctx.arc(gx + 5, gy - 4, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function loop() {
            tick++;
            if (tick % 11 === 0) stepGame();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { pac.nextDx = 0; pac.nextDy = -1; }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { pac.nextDx = 0; pac.nextDy = 1; }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { pac.nextDx = -1; pac.nextDy = 0; }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { pac.nextDx = 1; pac.nextDy = 0; }
        });

        document.querySelectorAll('.btn-dir').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                pac.nextDx = Number(btn.dataset.dx);
                pac.nextDy = Number(btn.dataset.dy);
            });
        });

        document.getElementById('btn-start-pac').addEventListener('click', startGame);
        loadMap();
        loop();
    </script>
</body>
</html>
