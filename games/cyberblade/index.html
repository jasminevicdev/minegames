<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Samurai: Deflexão Neon HD — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #1e1b4b, #030712);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 1060px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(244,63,94,0.45);
        }
        .back-btn {
            text-decoration: none; color: #fda4af; font-weight: 700;
            background: rgba(244,63,94,0.2); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(244,63,94,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #fb7185; }
        .score-pill {
            background: linear-gradient(135deg, #f43f5e, #a855f7);
            padding: 7px 16px; border-radius: 999px; font-weight: 700;
        }
        .arena { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 10px; }
        .hud {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
            background: rgba(255,255,255,0.06); padding: 9px 16px; border-radius: 999px;
        }
        canvas {
            background: #050816; border: 3px solid #f43f5e; border-radius: 22px;
            box-shadow: 0 0 38px rgba(244,63,94,0.35); max-width: 100%; height: auto;
            cursor: crosshair; touch-action: none;
        }
        .btn {
            padding: 8px 15px; border-radius: 999px; border: none; font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #eab308); color: #fff; cursor: pointer;
            font-size: 0.85rem;
        }
        .katana-opt {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
        }
        .katana-opt.active { background: linear-gradient(135deg, #00f5d4, #6366f1); color: #03101c; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>⚡ Cyber Samurai: Deflexão Neon — Edição HD</h1>
        <div class="score-pill">Recorde: <span id="hiVal">0</span> PTS</div>
    </header>

    <main class="arena">
        <div class="hud">
            <span>Pontos: <strong id="scoreVal" style="color:#fde047;">0</strong></span>
            <span>Combo: <strong id="comboVal" style="color:#38bdf8;">x1</strong></span>
            <span>Vida: <strong id="hpVal">❤️❤️❤️❤️</strong></span>
            <button class="btn katana-opt active" data-k="#00f5d4">🗡️ Plasma Ciano</button>
            <button class="btn katana-opt" data-k="#ec4899">🌸 Lâmina Sakura</button>
            <button class="btn katana-opt" data-k="#fde047">⚡ Katana Solar</button>
            <button class="btn" id="slashBtn">💥 Corte Relâmpago [Espaço]</button>
            <button class="btn" id="restartBtn">🔄 Reiniciar</button>
        </div>
        <canvas id="dojoCanvas" width="560" height="520"></canvas>
        <p style="color:#cbd5e1; font-size:0.85rem;">💡 Mova o mouse ou dedo para girar a Katana de Plasma! Rebata Orbes Vermelhos, Dourados (Bônus) e Verdes (+1 Vida)!</p>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('cyberblade', activePlayer);
        let bestScore = save?.highScore || 0;
        const hiEl = document.getElementById('hiVal');
        hiEl.textContent = bestScore;

        const canvas = document.getElementById('dojoCanvas');
        const ctx = canvas.getContext('2d');
        const CX = 280, CY = 260;

        let bladeColor = '#00f5d4';
        let angle = 0;
        let score = 0;
        let combo = 1;
        let hp = 4;
        let orbs = [];
        let sparks = [];
        let slashRing = 0;
        let tick = 0;

        function reset() {
            score = 0; combo = 1; hp = 4; orbs = []; sparks = [];
            updateHud();
        }

        function spawnSparks(x, y, col) {
            for (let i = 0; i < 10; i++) {
                const a = Math.random() * Math.PI * 2;
                sparks.push({ x, y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, c: col, life: 1 });
            }
        }

        function updateHud() {
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('comboVal').textContent = 'x' + combo;
            document.getElementById('hpVal').textContent = '❤️'.repeat(Math.max(0, hp)) || '💥';
            if (score > bestScore) {
                bestScore = score;
                hiEl.textContent = bestScore;
                SaveHub.updateGameSave('cyberblade', { highScore: bestScore }, activePlayer);
            }
        }

        canvas.addEventListener('pointermove', e => {
            const r = canvas.getBoundingClientRect();
            const mx = (e.clientX - r.left) * (560 / r.width);
            const my = (e.clientY - r.top) * (520 / r.height);
            angle = Math.atan2(my - CY, mx - CX);
        });

        function thunderSlash() {
            if (hp <= 0 || !orbs.length) return;
            slashRing = 15;
            orbs.forEach(o => spawnSparks(o.x, o.y, '#fde047'));
            score += orbs.length * 30;
            orbs = [];
            updateHud();
        }

        document.querySelectorAll('.katana-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.katana-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                bladeColor = btn.dataset.k;
            });
        });

        document.getElementById('slashBtn').addEventListener('click', thunderSlash);
        document.getElementById('restartBtn').addEventListener('click', reset);
        window.addEventListener('keydown', e => { if (e.code === 'Space') thunderSlash(); });

        function loop() {
            tick++;
            ctx.fillStyle = '#050816';
            ctx.fillRect(0, 0, 560, 520);

            // Cyber Dojo Radar Rings
            ctx.strokeStyle = 'rgba(244,63,94,0.16)';
            ctx.lineWidth = 1.5;
            for (let r = 60; r <= 240; r += 60) {
                ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
            }

            if (slashRing > 0) {
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(CX, CY, (16 - slashRing) * 18, 0, Math.PI * 2); ctx.stroke();
                slashRing--;
            }

            if (hp > 0 && tick % Math.max(20, 52 - Math.floor(score / 180)) === 0) {
                const a = Math.random() * Math.PI * 2;
                const r = Math.random();
                const type = r < 0.14 ? 'heal' : r < 0.3 ? 'gold' : 'laser';
                const sp = (type === 'gold' ? 3.5 : 2.6) + Math.min(2.2, score / 700);
                orbs.push({
                    x: CX + Math.cos(a) * 270,
                    y: CY + Math.sin(a) * 270,
                    vx: -Math.cos(a) * sp,
                    vy: -Math.sin(a) * sp,
                    type,
                    deflected: false
                });
            }

            // Samurai Core & Glowing Plasma Katana Arc
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = bladeColor; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(CX, CY, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🥷', CX, CY);

            ctx.save();
            ctx.strokeStyle = bladeColor;
            ctx.shadowColor = bladeColor;
            ctx.shadowBlur = 18;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(CX, CY, 58, angle - 0.92, angle + 0.92);
            ctx.stroke();
            ctx.restore();

            // Update Orbs
            for (let i = orbs.length - 1; i >= 0; i--) {
                const o = orbs[i];
                o.x += o.vx; o.y += o.vy;
                const dist = Math.hypot(o.x - CX, o.y - CY);
                const orbAng = Math.atan2(o.y - CY, o.x - CX);
                const diff = Math.atan2(Math.sin(orbAng - angle), Math.cos(orbAng - angle));

                if (!o.deflected && dist <= 65 && dist >= 44 && Math.abs(diff) <= 1.0) {
                    o.deflected = true;
                    o.vx *= -1.6; o.vy *= -1.6;
                    if (o.type === 'heal') {
                        hp = Math.min(5, hp + 1);
                        score += 50;
                    } else if (o.type === 'gold') {
                        score += 60 * combo;
                    } else {
                        score += 20 * combo;
                    }
                    combo = Math.min(12, combo + 1);
                    spawnSparks(o.x, o.y, bladeColor);
                    updateHud();
                } else if (!o.deflected && dist < 24) {
                    orbs.splice(i, 1);
                    if (o.type === 'heal') {
                        hp = Math.min(5, hp + 1);
                    } else {
                        hp--;
                        combo = 1;
                        spawnSparks(CX, CY, '#f43f5e');
                    }
                    updateHud();
                    continue;
                } else if (dist > 320) {
                    orbs.splice(i, 1);
                    continue;
                }

                const col = o.deflected ? bladeColor : o.type === 'heal' ? '#10b981' : o.type === 'gold' ? '#fde047' : '#f43f5e';
                ctx.fillStyle = col;
                ctx.shadowColor = col; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(o.x, o.y, o.type === 'gold' ? 12 : 10, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.life -= 0.05;
                if (s.life <= 0) { sparks.splice(i, 1); continue; }
                ctx.fillStyle = s.c;
                ctx.fillRect(s.x, s.y, 4, 4);
            }

            if (hp <= 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, 560, 520);
                ctx.fillStyle = '#fb7185';
                ctx.font = 'bold 28px Fredoka, sans-serif';
                ctx.fillText('FIM DE TREINO! Clique em Reiniciar 🔄', CX, CY);
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
