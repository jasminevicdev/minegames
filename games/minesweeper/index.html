<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Minado Estelar 💣🪐 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #17153b 0%, #070614 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #f59e0b;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #ffcc00; font-family: 'Fredoka', sans-serif; }
        .controls-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .btn-mode {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f5d4;
            color: #fff;
            padding: 9px 12px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-mode.flag-active {
            background: linear-gradient(135deg, #ff2a5f, #f59e0b);
            border-color: #ffcc00;
        }
        .board {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            background: #0b0a20;
            border: 3px solid #f59e0b;
            border-radius: 20px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 5px;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.25);
        }
        .tile {
            background: #1e1b4b;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }
        .tile.revealed {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.05);
            cursor: default;
        }
        .tile.mine { background: #dc2626; }
        .status-msg {
            margin-top: 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            color: #ffcc00;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ HUB</a>
        <div class="stat-pill">MINAS: <strong id="hud-mines">10 💣</strong></div>
        <div class="stat-pill">PONTOS: <strong id="hud-score">0</strong></div>
        <div class="stat-pill">RECORDE: <strong id="hud-best">0</strong></div>
    </div>

    <div class="controls-bar">
        <button class="btn-mode" id="btn-toggle-flag">🔍 MODO: ESCAVAR (Toque p/ 🚩)</button>
        <button class="btn-mode" id="btn-reset" style="flex:0.45;">🔄 NOVO</button>
    </div>

    <div class="board" id="mine-board"></div>
    <div class="status-msg" id="status-msg">Clique ou toque em um setor estelar para começar!</div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const SIZE = 9;
        const MINES = 10;
        const boardEl = document.getElementById('mine-board');
        const hudMines = document.getElementById('hud-mines');
        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const statusMsg = document.getElementById('status-msg');
        const btnFlag = document.getElementById('btn-toggle-flag');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('minesweeper', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = bestScore;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 480, dur = 0.07, type = 'triangle') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.08, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        let cells = [];
        let firstClick = true;
        let flagMode = false;
        let gameOver = false;
        let score = 0;

        function initBoard() {
            cells = [];
            firstClick = true;
            gameOver = false;
            score = 0;
            hudScore.innerText = '0';
            hudMines.innerText = `${MINES} 💣`;
            statusMsg.innerText = 'Escave os setores seguros da galáxia! 🪐';
            for (let r = 0; r < SIZE; r++) {
                cells[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    cells[r][c] = { r, c, mine: false, revealed: false, flagged: false, count: 0 };
                }
            }
            render();
        }

        function placeMines(safeR, safeC) {
            let placed = 0;
            while (placed < MINES) {
                const r = Math.floor(Math.random() * SIZE);
                const c = Math.floor(Math.random() * SIZE);
                if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
                if (!cells[r][c].mine) {
                    cells[r][c].mine = true;
                    placed++;
                }
            }
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    let cnt = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (cells[r + dr]?.[c + dc]?.mine) cnt++;
                        }
                    }
                    cells[r][c].count = cnt;
                }
            }
        }

        function reveal(r, c) {
            const cell = cells[r]?.[c];
            if (!cell || cell.revealed || cell.flagged) return;
            cell.revealed = true;
            if (!cell.mine) {
                score += 20;
                if (cell.count === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr !== 0 || dc !== 0) reveal(r + dr, c + dc);
                        }
                    }
                }
            }
        }

        function handleTileClick(r, c, forceFlag = false) {
            if (gameOver) return;
            const cell = cells[r][c];
            if (flagMode || forceFlag) {
                if (cell.revealed) return;
                cell.flagged = !cell.flagged;
                sfx(580, 0.05);
                render();
                return;
            }
            if (cell.flagged || cell.revealed) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
            }

            if (cell.mine) {
                cell.revealed = true;
                gameOver = true;
                for (let rr = 0; rr < SIZE; rr++) {
                    for (let cc = 0; cc < SIZE; cc++) {
                        if (cells[rr][cc].mine) cells[rr][cc].revealed = true;
                    }
                }
                statusMsg.innerText = '💥 MINA QUÂNTICA ATIVADA! Clique em NOVO para jogar novamente.';
                sfx(160, 0.25, 'sawtooth');
                render();
                return;
            }

            reveal(r, c);
            sfx(480, 0.06);

            // Check win
            let unrevealedSafe = 0;
            for (let rr = 0; rr < SIZE; rr++) {
                for (let cc = 0; cc < SIZE; cc++) {
                    if (!cells[rr][cc].mine && !cells[rr][cc].revealed) unrevealedSafe++;
                }
            }
            if (unrevealedSafe === 0) {
                gameOver = true;
                score += 500;
                statusMsg.innerText = `🏆 SETOR GALÁCTICO LIMPO! +500 BÔNUS!`;
                sfx(840, 0.25);
            }

            hudScore.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = bestScore;
                SaveHub.updateGameSave('minesweeper', { highScore: bestScore }, playerName);
            }
            render();
        }

        const COLORS = ['', '#38bdf8', '#4ade80', '#f472b6', '#c084fc', '#fb923c', '#facc15', '#fff', '#fff'];

        function render() {
            let flags = 0;
            boardEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = cells[r][c];
                    if (cell.flagged) flags++;
                    const div = document.createElement('div');
                    div.className = 'tile' + (cell.revealed ? ' revealed' : '') + (cell.revealed && cell.mine ? ' mine' : '');
                    if (cell.revealed) {
                        if (cell.mine) div.innerText = '💣';
                        else if (cell.count > 0) {
                            div.innerText = cell.count;
                            div.style.color = COLORS[cell.count];
                        }
                    } else if (cell.flagged) {
                        div.innerText = '🚩';
                    }
                    div.addEventListener('click', () => handleTileClick(r, c, false));
                    div.addEventListener('contextmenu', (e) => { e.preventDefault(); handleTileClick(r, c, true); });
                    boardEl.appendChild(div);
                }
            }
            hudMines.innerText = `${Math.max(0, MINES - flags)} 💣`;
        }

        btnFlag.addEventListener('click', () => {
            flagMode = !flagMode;
            btnFlag.classList.toggle('flag-active', flagMode);
            btnFlag.innerText = flagMode ? '🚩 MODO: BANDEIRA (Toque p/ 🔍)' : '🔍 MODO: ESCAVAR (Toque p/ 🚩)';
        });

        document.getElementById('btn-reset').addEventListener('click', initBoard);
        initBoard();
    </script>
</body>
</html>
