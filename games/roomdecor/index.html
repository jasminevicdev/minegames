<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #4a044e 0%, #140321 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 1160px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #f472b6;
            color: #fff;
            padding: 7px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.88rem;
            transition: 0.2s;
        }
        .btn-back:hover { background: #f472b6; color: #160322; }
        .hud-stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #e879f9;
            border-radius: 16px;
            padding: 5px 14px;
            font-size: 0.84rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }

        .studio-layout {
            width: 100%;
            max-width: 1160px;
            display: grid;
            grid-template-columns: 560px 1fr;
            gap: 16px;
            align-items: stretch;
        }
        @media (max-width: 960px) {
            .studio-layout { grid-template-columns: 1fr; }
        }

        .stage-box {
            background: linear-gradient(180deg, #2e1065, #140326);
            border: 3px solid #f472b6;
            border-radius: 26px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 42px rgba(244, 114, 182, 0.4);
            position: relative;
        }
        canvas {
            width: 100%;
            max-width: 540px;
            aspect-ratio: 13 / 12;
            border-radius: 20px;
            display: block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
            cursor: pointer;
        }
        .stage-actions {
            width: 100%;
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn-quick {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #e879f9;
            color: #fff;
            padding: 8px 8px;
            border-radius: 14px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-quick:hover { background: rgba(232, 121, 249, 0.32); transform: translateY(-2px); }

        .catalog-box {
            background: rgba(26, 7, 45, 0.94);
            border: 3px solid #e879f9;
            border-radius: 26px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 32px rgba(168, 85, 247, 0.25);
        }
        .theme-banner {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.28), rgba(168, 85, 247, 0.28));
            border: 2px solid #fde047;
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .theme-info span { font-size: 0.74rem; color: #fbcfe8; display: block; font-weight: 700; }
        .theme-info strong { font-family: 'Fredoka', sans-serif; font-size: 1.1rem; color: #fde047; }
        .theme-tip {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(253, 224, 71, 0.5);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.76rem;
            color: #fef08a;
        }

        .cat-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        @media (max-width: 520px) {
            .cat-tabs { grid-template-columns: repeat(2, 1fr); }
        }
        .cat-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(244, 114, 182, 0.35);
            color: #fce7f3;
            border-radius: 14px;
            padding: 8px 6px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .cat-btn:hover { background: rgba(244, 114, 182, 0.2); }
        .cat-btn.active {
            background: linear-gradient(135deg, #ec4899, #9333ea);
            border-color: #fde047;
            color: #fff;
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }
        @media (max-width: 520px) {
            .items-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .item-card {
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.16s;
            text-align: center;
        }
        .item-card:hover {
            transform: translateY(-2px);
            border-color: #f9a8d4;
            background: rgba(244, 114, 182, 0.16);
        }
        .item-card.selected {
            border-color: #fde047;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.35), rgba(168, 85, 247, 0.35));
            box-shadow: 0 0 14px rgba(253, 224, 71, 0.45);
        }
        .item-swatch {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
        }
        .item-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.8rem;
            color: #fff;
        }
        .item-tag {
            font-size: 0.68rem;
            color: #fde047;
            background: rgba(0,0,0,0.4);
            padding: 2px 7px;
            border-radius: 8px;
        }

        .judges-panel {
            background: rgba(15, 3, 28, 0.78);
            border: 2px solid rgba(244, 114, 182, 0.45);
            border-radius: 18px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .judge-avatars { display: flex; gap: 10px; }
        .judge-chip {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(253, 224, 71, 0.4);
            border-radius: 12px;
            padding: 4px 9px;
            font-size: 0.78rem;
            font-family: 'Fredoka', sans-serif;
        }
        .btn-showroom {
            margin-top: auto;
            background: linear-gradient(135deg, #ec4899, #a855f7, #fde047);

            border: none;
            padding: 14px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
            transition: transform 0.15s;
        }
        .btn-showroom:hover { transform: scale(1.02); }
    </style>
</head>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 640, type = 'triangle') {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                o.frequency.exponentialRampToValueAtTime(freq * 1.28, audioCtx.currentTime + 0.15);
                g.gain.setValueAtTime(0.08, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

                { id: 'paw', name: 'Patinha de Gato Fofa', color: '#f9a8d4', trim: '#ffffff', shape: 'paw', icon: '🐾', tag: 'Gamer' }

                { id: 'puppy', name: 'Lulu da Pomerânia', emoji: '🐶', accessory: '💖', art: '👑', color: '#fde68a', tag: 'Realeza' },
                { id: 'seahorse', name: 'Golfinho Perolado', emoji: '🐬', accessory: '🫧', art: '🐚', color: '#7dd3fc', tag: 'Sereia' },
                { id: 'teddy', name: 'Ursinho Imperial', emoji: '🧸', accessory: '👑', art: '🦋', color: '#f472b6', tag: 'Fada' }
            ]
        };

        let room = {
            bed: CATALOG.bed[0],
            wall: CATALOG.wall[0],
            floor: CATALOG.floor[1],
            window: CATALOG.window[0],
            vanity: CATALOG.vanity[0],
            light: CATALOG.light[0],
            rug: CATALOG.rug[0],
            pet: CATALOG.pet[0],
            nightMode: false,
            showPrincess: true,
            particles: []
        };

        let activeCat = 'bed';
        let score = 0;
        let tick = 0;

        function spawnSparkles(count = 16, xCenter = W / 2, yCenter = H / 2) {
            for (let i = 0; i < count; i++) {
                room.particles.push({
                    x: xCenter + (Math.random() - 0.5) * 360,
                    y: yCenter + (Math.random() - 0.5) * 260,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: -0.8 - Math.random() * 1.8,
                    size: 14 + Math.random() * 14,
                    char: ['✨', '💖', '⭐', '🌸', '💎'][i % 5],
                    life: 55 + Math.random() * 25
                });
            }
        }

        function renderItemsGrid() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            const items = CATALOG[activeCat];
            items.forEach(item => {
                const card = document.createElement('div');
                const isSelected = room[activeCat].id === item.id;
                card.className = 'item-card' + (isSelected ? ' selected' : '');

                const swatchBg = item.color || item.sky1 || '#f472b6';
                card.innerHTML = `
                    <div class="item-swatch" style="background: ${swatchBg};">${item.icon || item.emoji}</div>
                    <div class="item-title">${item.name}</div>
                    <span class="item-tag">${item.tag}</span>
                `;
                card.onclick = () => {
                    room[activeCat] = item;
                    sfx(660);
                    spawnSparkles(8);
                    renderItemsGrid();
                    feedbackEl.innerText = `✨ Selecionado: ${item.name} (${item.tag})!`;
                };
                grid.appendChild(card);
            });
        }

        document.getElementById('btn-showroom').onclick = () => {
            const theme = THEMES[currentThemeIdx];
            let matches = 0;
            ['bed', 'wall', 'floor', 'window', 'vanity', 'light', 'rug', 'pet'].forEach(k => {
                if (room[k].tag === theme.tag) matches++;
            });

            const j1 = Math.min(10, 7 + Math.floor(matches * 0.6) + (Math.random() > 0.4 ? 1 : 0));
            const j2 = Math.min(10, 8 + Math.floor(matches * 0.5));
            const j3 = Math.min(10, 7 + Math.ceil(matches * 0.6));

            document.getElementById('j2-score').innerText = `⭐ ${j2}/10`;
            document.getElementById('j3-score').innerText = `⭐ ${j3}/10`;

            const earned = (j1 + j2 + j3) * 8 + matches * 25;
            score += earned;
            hudScore.innerText = `${score} 🏠`;
            if (score > bestScore) {

                hudBest.innerText = `${bestScore} 🏠`;

            sfx(960);
            spawnSparkles(28);
            feedbackEl.innerText = `📸 CAPA DA REVISTA! Nota ${j1 + j2 + j3}/30 (+${earned} 🏠)! Novo tema liberado!`;

            currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
            themeNameEl.innerText = THEMES[currentThemeIdx].name;
            themeTipEl.innerText = THEMES[currentThemeIdx].tip;
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();

        // ======== DESENHO ARQUITETÔNICO ULTRA-DETALHADO DO QUARTO ========
        function drawRoom() {
            tick += 0.04;

            // 1. PAREDE COM TEXTURA DAMASK / ESTRELAS E BOISERIE CLÁSSICA
            const wallGrad = ctx.createLinearGradient(0, 0, 0, 325);
            wallGrad.addColorStop(0, room.wall.color);
            wallGrad.addColorStop(1, room.wall.stripe);
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, W, 325);

            // Papel de parede listrado + motivos decorativos
            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            for (let x = 18; x < W; x += 36) {
                ctx.fillRect(x, 22, 12, 232);
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let x = 36; x < W - 20; x += 72) {
                for (let y = 55; y < 235; y += 60) {
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Painel Boiserie Inferior (Wainscoting Real)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(0, 252, W, 73);
            ctx.fillStyle = '#fde047';
            ctx.fillRect(0, 250, W, 4);

            for (let bx = 14; bx < W - 30; bx += 76) {
                ctx.strokeStyle = room.wall.stripe;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(bx, 261, 62, 48);
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 1;
                ctx.strokeRect(bx + 4, 265, 54, 40);
            }

            // Sanca de Gesso Superior Dourada
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, 18);
            ctx.fillStyle = '#fde047';
            ctx.fillRect(0, 18, W, 4);

            // 2. PISO EM PERSPECTIVA 3D COM REFLEXOS
            const floorGrad = ctx.createLinearGradient(0, 325, 0, H);
            floorGrad.addColorStop(0, room.floor.color);
            floorGrad.addColorStop(1, room.floor.line);
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, 325, W, H - 325);

            // Linhas de perspectiva do piso
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
            ctx.lineWidth = 2;
            for (let px = -90; px <= W + 90; px += 48) {
                ctx.beginPath();
                ctx.moveTo(W / 2 + (px - W / 2) * 0.52, 325);
                ctx.lineTo(px, H);
                ctx.stroke();
            }
            for (let py = 345; py < H; py += 26) {
                ctx.beginPath();
                ctx.moveTo(0, py);
                ctx.lineTo(W, py);
                ctx.stroke();
            }

            // Rodapé Real
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 316, W, 10);
            ctx.fillStyle = '#fde047';
            ctx.fillRect(0, 314, W, 3);

            // 3. JANELA PANORÂMICA REAL COM PAISAGEM DETALHADA (Esquerda)
            drawWindowScene(28, 54, 118, 172);

            // 4. QUADRO REAL & PRATELEIRA DE PAREDE (Direita Superior)
            drawWallGallery(395, 56);

            // 5. TAPETE DESIGNER NO CHÃO (Centro)
            drawDesignerRug(W / 2 - 12, 422);

            // 6. PLANTA MONSTERA / VASO DE CEREJEIRA NO CANTO ESQUERDO
            drawCornerPlant(36, 338);

            // 7. MÓVEL LATERAL DETALHADO (Penteadeira / Setup Gamer / Harpa / Chá / Aquário)
            drawDetailedSideFurniture(445, 250);

            // 8. CRIADO-MUDO COM ABAJUR DE CRISTAL (Esquerda da Cama)
            drawNightstand(164, 286);

            // 9. CAMA DE PRINCESA ULTRA-DETALHADA (Centro)
            drawLuxuryBed(W / 2 - 10, 246);

            // 10. PET / PELÚCIA FOFA COM RESPIRAÇÃO E SOMBRA
            const petBounce = Math.sin(tick * 1.6) * 3;
            const petX = W / 2 - 10;
            const petY = 278 + petBounce;
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.ellipse(petX, 290, 24, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '48px serif';
            ctx.textAlign = 'center';
            ctx.fillText(room.pet.emoji, petX, petY);
            ctx.font = '22px serif';
            ctx.fillText(room.pet.accessory, petX + 12, petY - 36);

            // 11. PRINCESA NO QUARTO (OPCIONAL)
            if (room.showPrincess) {
                drawPrincessCharacter(115, 365);
            }

            // 12. LUSTRE IMPERIAL & LUZES DE FADA NO TETO
            drawCeilingLight(W / 2 - 10);

            // 13. EFEITO DE ILUMINAÇÃO NOTURNA / LED GLOW
            if (room.nightMode) {
                ctx.fillStyle = 'rgba(12, 3, 28, 0.44)';
                ctx.fillRect(0, 0, W, H);

                const glowPositions = [
                    [W / 2 - 10, 75, 135, 'rgba(254, 240, 138, 0.42)'],
                    [445, 215, 95, 'rgba(244, 114, 182, 0.38)'],
                    [164, 265, 65, 'rgba(254, 240, 138, 0.38)'],
                    [87, 130, 88, 'rgba(192, 132, 252, 0.32)']
                ];
                glowPositions.forEach(([gx, gy, gr, col]) => {
                    const g = ctx.createRadialGradient(gx, gy, 4, gx, gy, gr);
                    g.addColorStop(0, col);
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 14. PARTÍCULAS DE BRILHO FLUTUANTES
            for (let i = room.particles.length - 1; i >= 0; i--) {
                const p = room.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.font = `${Math.floor(p.size)}px serif`;
                ctx.fillText(p.char, p.x, p.y);
                if (p.life <= 0) room.particles.splice(i, 1);
            }

            requestAnimationFrame(drawRoom);
        }

        function drawWindowScene(wx, wy, ww, wh) {
            const skyGrad = ctx.createLinearGradient(wx, wy, wx, wy + wh);
            skyGrad.addColorStop(0, room.window.sky1);
            skyGrad.addColorStop(1, room.window.sky2);
            ctx.fillStyle = skyGrad;
            ctx.beginPath();
            ctx.roundRect(wx, wy, ww, wh, [58, 58, 8, 8]);
            ctx.fill();

            // Sol / Lua Brilhante e Nuvens suaves
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.arc(wx + 32, wy + 44, 15, 0, Math.PI * 2);
            ctx.fill();

            // Silhueta de montanhas / castelo distante na janela
            ctx.fillStyle = 'rgba(46, 16, 101, 0.35)';
            ctx.beginPath();
            ctx.moveTo(wx, wy + wh);
            ctx.lineTo(wx, wy + 135);
            ctx.lineTo(wx + 35, wy + 108);
            ctx.lineTo(wx + 65, wy + 128);
            ctx.lineTo(wx + 95, wy + 102);
            ctx.lineTo(wx + ww, wy + 130);
            ctx.lineTo(wx + ww, wy + wh);
            ctx.closePath();
            ctx.fill();

            ctx.font = '34px serif';
            ctx.textAlign = 'center';
            ctx.fillText(room.window.icon, wx + ww / 2, wy + 118);

            // Moldura e vitral em arco
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(wx, wy, ww, wh, [58, 58, 8, 8]);
            ctx.stroke();

            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(wx + ww / 2, wy);
            ctx.lineTo(wx + ww / 2, wy + wh);
            ctx.moveTo(wx, wy + 96);
            ctx.lineTo(wx + ww, wy + 96);
            ctx.stroke();

            // Cortinas de renda translúcida interna
            ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.beginPath();
            ctx.moveTo(wx + 4, wy + 10);
            ctx.quadraticCurveTo(wx + 36, wy + 95, wx + 8, wy + wh - 4);
            ctx.lineTo(wx + 4, wy + wh - 4);
            ctx.closePath();
            ctx.fill();

            // Cortinas de veludo drapeadas laterais com laço dourado
            ctx.fillStyle = room.window.curtain;
            ctx.beginPath();
            ctx.moveTo(wx - 10, wy - 6);
            ctx.quadraticCurveTo(wx + 26, wy + 80, wx - 16, wy + wh + 18);
            ctx.lineTo(wx - 22, wy - 6);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(wx + ww + 10, wy - 6);
            ctx.quadraticCurveTo(wx + ww - 26, wy + 80, wx + ww + 16, wy + wh + 18);
            ctx.lineTo(wx + ww + 22, wy - 6);
            ctx.closePath();
            ctx.fill();

            // Bandô real superior e varão dourado
            ctx.fillStyle = '#fde047';
            ctx.fillRect(wx - 22, wy - 12, ww + 44, 7);
            ctx.fillStyle = room.window.curtain;
            ctx.beginPath();
            ctx.arc(wx + ww / 4, wy - 2, 22, 0, Math.PI);
            ctx.arc(wx + (ww * 3) / 4, wy - 2, 22, 0, Math.PI);
            ctx.fill();
        }

        function drawWallGallery(gx, gy) {
            // Quadro principal emoldurado em ouro
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.roundRect(gx, gy, 68, 78, 10);
            ctx.fill();
            ctx.fillStyle = '#fff1f2';
            ctx.beginPath();
            ctx.roundRect(gx + 5, gy + 5, 58, 68, 7);
            ctx.fill();
            ctx.font = '32px serif';
            ctx.textAlign = 'center';
            ctx.fillText(room.pet.art, gx + 34, gy + 50);

            // Prateleira flutuante com perfume e plantinha
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(gx + 62, gy + 45, 54, 7);
            ctx.fillStyle = '#fde047';
            ctx.fillRect(gx + 62, gy + 52, 54, 3);
            ctx.font = '20px serif';
            ctx.fillText('🌸', gx + 76, gy + 42);
            ctx.fillText('💎', gx + 102, gy + 42);
        }

        function drawCornerPlant(px, py) {
            // Vaso de cerâmica branco e ouro
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(px - 18, py - 26);
            ctx.lineTo(px + 18, py - 26);
            ctx.lineTo(px + 13, py + 8);
            ctx.lineTo(px - 13, py + 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Folhas verdes e flores de cerejeira
            ctx.fillStyle = '#10b981';
            [-14, 0, 14].forEach((dx, i) => {
                ctx.beginPath();
                ctx.ellipse(px + dx, py - 42 - (i === 1 ? 10 : 0), 10, 20, dx * 0.03, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.font = '18px serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌸', px - 8, py - 48);
            ctx.fillText('🌸', px + 10, py - 38);
        }

        function drawNightstand(nx, ny) {
            // Criado-mudo estilo Luís XV
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.roundRect(nx - 24, ny, 48, 42, 8);
            ctx.fill();
            ctx.stroke();

            // Gavetinhas com puxador de cristal
            ctx.strokeRect(nx - 18, ny + 7, 36, 12);
            ctx.strokeRect(nx - 18, ny + 23, 36, 12);
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(nx, ny + 13, 2.5, 0, Math.PI * 2);
            ctx.arc(nx, ny + 29, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Abajur de princesa em cima
            ctx.fillStyle = '#fde047';
            ctx.fillRect(nx - 3, ny - 14, 6, 14);
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.moveTo(nx - 16, ny - 12);
            ctx.lineTo(nx + 16, ny - 12);
            ctx.lineTo(nx + 10, ny - 30);
            ctx.lineTo(nx - 10, ny - 30);
            ctx.closePath();
            ctx.fill();
        }

        function drawDesignerRug(rx, ry) {
            const r = room.rug;
            ctx.save();
            ctx.fillStyle = r.color;
            ctx.strokeStyle = r.trim;
            ctx.lineWidth = 6;

            if (r.shape === 'heart') {
                ctx.beginPath();
                ctx.moveTo(rx, ry + 42);
                ctx.bezierCurveTo(rx - 175, ry + 10, rx - 145, ry - 48, rx, ry - 20);
                ctx.bezierCurveTo(rx + 145, ry - 48, rx + 175, ry + 10, rx, ry + 42);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.ellipse(rx, ry, 152, 42, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Franjas e bordado real no tapete
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.setLineDash([7, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(rx, ry, 124, 30, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawLuxuryBed(cx, cy) {
            const b = room.bed;

            // Sombra da cama no piso
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 114, 114, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Dossel translúcido de renda real
            ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
            ctx.beginPath();
            ctx.moveTo(cx - 56, 82);
            ctx.quadraticCurveTo(cx - 135, 195, cx - 112, 345);
            ctx.lineTo(cx - 80, 345);
            ctx.quadraticCurveTo(cx - 92, 200, cx, 95);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 56, 82);
            ctx.quadraticCurveTo(cx + 135, 195, cx + 112, 345);
            ctx.lineTo(cx + 80, 345);
            ctx.quadraticCurveTo(cx + 92, 200, cx, 95);
            ctx.fill();

            // Cabeceira personalizada por modelo (Concha / Nuvem / Capitonnê)
            if (b.id === 'shell') {
                // Cabeceira em Gomos de Concha Perolada
                for (let i = -3; i <= 3; i++) {
                    ctx.fillStyle = i % 2 === 0 ? b.color : b.accent;
                    ctx.beginPath();
                    ctx.ellipse(cx + i * 22, cy - 58 - (3 - Math.abs(i)) * 8, 18, 46, i * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            } else if (b.id === 'cloud') {
                // Cabeceira Nuvem Fofa
                ctx.fillStyle = '#ffffff';
                [[-55, -52, 34], [-25, -72, 40], [25, -72, 40], [55, -52, 34], [0, -82, 44]].forEach(([dx, dy, rad]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, rad, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else {
                // Cabeceira Imperial Capitonnê com Moldura Dourada
                ctx.fillStyle = b.accent;
                ctx.beginPath();
                ctx.arc(cx, cy - 52, 92, Math.PI, 0);
                ctx.fill();

                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(cx, cy - 49, 82, Math.PI, 0);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                [-48, -24, 0, 24, 48].forEach((dx, i) => {
                    const dy = cy - 74 - (i % 2) * 16;
                    ctx.beginPath();
                    ctx.arc(cx + dx, dy, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Coroa do Dossel
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.ellipse(cx, 84, 58, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '26px serif';
            ctx.textAlign = 'center';
            ctx.fillText(b.icon, cx, 88);

            // Travesseiros Duplos + Almofadas de Coração
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = b.accent;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(cx - 76, cy - 46, 68, 36, 12);
            ctx.roundRect(cx + 8, cy - 46, 68, 36, 12);
            ctx.fill();
            ctx.stroke();

            // Edredom Matelassê Volumoso com Textura de Losangos
            const duvetGrad = ctx.createLinearGradient(cx, cy - 15, cx, cy + 108);
            duvetGrad.addColorStop(0, '#ffffff');
            duvetGrad.addColorStop(0.2, b.color);
            duvetGrad.addColorStop(1, b.accent);
            ctx.fillStyle = duvetGrad;
            ctx.beginPath();
            ctx.roundRect(cx - 102, cy - 14, 204, 118, 22);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Costura Matelassê no Edredom
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.5;
            for (let qx = cx - 75; qx <= cx + 75; qx += 30) {
                ctx.beginPath();
                ctx.moveTo(qx, cy + 8);
                ctx.lineTo(qx, cy + 84);
                ctx.stroke();
            }

            // Babado e Peseira Real
            ctx.fillStyle = b.accent;
            ctx.beginPath();
            ctx.roundRect(cx - 104, cy + 84, 208, 22, 10);
            ctx.fill();

            // Rodas de Carruagem Douradas ou Pés Luís XV
            if (b.id === 'carriage') {
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 5;
                [-82, 82].forEach(wx => {
                    ctx.beginPath();
                    ctx.arc(cx + wx, cy + 108, 18, 0, Math.PI * 2);
                    ctx.stroke();
                });
            } else {
                ctx.fillStyle = '#fde047';
                ctx.fillRect(cx - 94, cy + 104, 14, 18);
                ctx.fillRect(cx + 80, cy + 104, 14, 18);
            }
        }

        function drawDetailedSideFurniture(fx, fy) {
            const v = room.vanity;

            // Mesa / Bancada Principal
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = v.accent;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(fx - 54, fy + 15, 108, 42, 10);
            ctx.fill();
            ctx.stroke();

            // Pernas torneadas
            ctx.fillStyle = '#fde047';
            ctx.fillRect(fx - 46, fy + 57, 8, 52);
            ctx.fillRect(fx + 38, fy + 57, 8, 52);

            // Banqueta / Cadeira Gamer com Orelhas de Gatinho
            ctx.fillStyle = v.color;
            ctx.beginPath();
            ctx.roundRect(fx - 26, fy + 74, 52, 28, 12);
            ctx.fill();

            if (v.id === 'gamer') {
                // Dois Monitores Curvos RGB + Teclado Iluminado
                ctx.fillStyle = '#1e1b4b';
                ctx.strokeStyle = '#22d3ee';
                ctx.lineWidth = 3;
                ctx.fillRect(fx - 48, fy - 36, 44, 34);
                ctx.strokeRect(fx - 48, fy - 36, 44, 34);
                ctx.fillRect(fx + 4, fy - 36, 44, 34);
                ctx.strokeRect(fx + 4, fy - 36, 44, 34);
                ctx.font = '20px serif';
                ctx.textAlign = 'center';
                ctx.fillText('🎮', fx - 26, fy - 12);
                ctx.fillText('🎧', fx + 26, fy - 12);
            } else if (v.id === 'aquarium') {
                // Aquário de Cristal com Corais e Peixinhos
                ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(fx - 44, fy - 48, 88, 60, 14);
                ctx.fill();
                ctx.stroke();
                const fishX = fx + Math.sin(tick * 2) * 18;
                ctx.font = '26px serif';
                ctx.textAlign = 'center';
                ctx.fillText('🐠', fishX, fy - 12);
            } else {
                // Espelho Camarim Oval com Luzes de LED + Perfumes na Bancada
                ctx.fillStyle = v.accent;
                ctx.beginPath();
                ctx.ellipse(fx, fy - 32, 42, 48, 0, 0, Math.PI * 2);
                ctx.fill();

                const mirrorGrad = ctx.createLinearGradient(fx - 30, fy - 70, fx + 30, fy + 10);
                mirrorGrad.addColorStop(0, '#bae6fd');
                mirrorGrad.addColorStop(1, '#fbcfe8');
                ctx.fillStyle = mirrorGrad;
                ctx.beginPath();
                ctx.ellipse(fx, fy - 32, 34, 40, 0, 0, Math.PI * 2);
                ctx.fill();

                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    const lx = fx + Math.cos(a) * 38;
                    const ly = fy - 32 + Math.sin(a) * 44;
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(lx, ly, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.font = '28px serif';
                ctx.textAlign = 'center';
                ctx.fillText(v.icon, fx, fy + 10);
                ctx.font = '18px serif';
                ctx.fillText('💄', fx - 32, fy + 12);
                ctx.fillText('🌸', fx + 32, fy + 12);
            }
        }

        function drawPrincessCharacter(px, py) {
            const sway = Math.sin(tick * 1.4) * 2;
            ctx.save();
            ctx.translate(px, py + sway);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.beginPath();
            ctx.ellipse(0, 52, 34, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Vestido de Gala Rodado em Camadas
            const dressGrad = ctx.createLinearGradient(0, -10, 0, 50);
            dressGrad.addColorStop(0, '#f472b6');
            dressGrad.addColorStop(1, '#db2777');
            ctx.fillStyle = dressGrad;
            ctx.beginPath();
            ctx.moveTo(-14, -12);
            ctx.quadraticCurveTo(-44, 25, -38, 50);
            ctx.lineTo(38, 50);
            ctx.quadraticCurveTo(44, 25, 14, -12);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Cabelo Longo Dourado
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, -40, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-20, -40, 40, 34);

            // Rosto fofo da Princesa
            ctx.fillStyle = '#ffe4e6';
            ctx.beginPath();
            ctx.arc(0, -38, 16, 0, Math.PI * 2);
            ctx.fill();

            // Olhos expressivos e sorriso
            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.arc(-6, -39, 2.8, 0, Math.PI * 2);
            ctx.arc(6, -39, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#db2777';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -34, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Tiara Real
            ctx.font = '22px serif';
            ctx.textAlign = 'center';
            ctx.fillText('👑', 0, -56);

            ctx.restore();
        }

        function drawCeilingLight(cx) {
            const l = room.light;

            // Cordão de luzes de fada
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 26);
            ctx.quadraticCurveTo(W / 2, 72, W, 26);
            ctx.stroke();

            for (let lx = 28; lx < W; lx += 42) {
                const ly = 26 + Math.sin((lx / W) * Math.PI) * 23;
                const pulse = 3 + Math.sin(tick * 2 + lx) * 2;
                ctx.fillStyle = l.glow;
                ctx.beginPath();
                ctx.arc(lx, ly, pulse + 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Lustre Imperial Central
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx, 20);
            ctx.lineTo(cx, 54);
            ctx.stroke();

            ctx.strokeStyle = l.color;
            ctx.lineWidth = 3;
            [-44, -22, 22, 44].forEach(dx => {
                ctx.beginPath();
                ctx.moveTo(cx, 50);
                ctx.quadraticCurveTo(cx + dx * 0.6, 72, cx + dx, 56);
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(cx + dx, 52, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.font = '34px serif';
            ctx.textAlign = 'center';
            ctx.fillText(l.icon, cx, 72);
        }

        renderItemsGrid();
        drawRoom();
    </script>
</body>
</html>
