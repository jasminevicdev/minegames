<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Princess Room Decor 🛏️✨ — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #4c1d95 0%, #1e1b4b 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #c4b5fd;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #a78bfa;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }
        .decor-grid {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 14px;
        }
        @media (max-width: 720px) {
            .decor-grid { grid-template-columns: 1fr; }
        }
        .room-stage {
            background: linear-gradient(180deg, #311042, #1a0626);
            border: 3px solid #c084fc;
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 32px rgba(192, 132, 252, 0.35);
        }
        canvas {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
        }
        .decor-menu {
            background: rgba(30, 12, 55, 0.92);
            border: 3px solid #e9d5ff;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .label { font-family: 'Fredoka', sans-serif; color: #e9d5ff; font-size: 0.88rem; margin-bottom: 5px; }
        .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .opt-btn {
            min-width: 44px;
            height: 44px;
            padding: 0 10px;
            border-radius: 13px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: transform 0.15s;
        }
        .opt-btn:hover { transform: scale(1.1); border-color: #fde047; }
        .btn-save-room {
            margin-top: auto;
            background: linear-gradient(135deg, #c084fc, #f472b6, #fde047);
            color: #1e1b4b;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div style="display:flex; gap:8px;">
            <div class="stat-pill">DESIGN: <strong id="hud-score">0 🏠</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0 🏠</strong></div>
        </div>
    </div>

    <div class="decor-grid">
        <div class="room-stage">
            <canvas id="room-canvas" width="460" height="460"></canvas>
            <p id="room-msg" style="margin-top:8px; font-family:'Fredoka',sans-serif; color:#fde047; text-align:center;">
                Personalize o Quarto dos Sonhos com cama de princesa, luzes e pelúcias! 🛏️✨
            </p>
        </div>

        <div class="decor-menu">
            <div>
                <div class="label">🎨 PAPEL DE PAREDE & ESTILO:</div>
                <div class="opt-row" id="row-wall"></div>
            </div>
            <div>
                <div class="label">🛏️ CAMA & EDREDOM DE LUXO:</div>
                <div class="opt-row" id="row-bed"></div>
            </div>
            <div>
                <div class="label">🧶 TAPETE FELPUDO:</div>
                <div class="opt-row" id="row-rug"></div>
            </div>
            <div>
                <div class="label">🧸 PELÚCIA & PET NA CAMA:</div>
                <div class="opt-row" id="row-plush"></div>
            </div>
            <div>
                <div class="label">✨ DECORAÇÃO & LUZES DE FADA:</div>
                <div class="opt-row" id="row-decor"></div>
            </div>
            <button class="btn-save-room" id="btn-save-room">📸 FOTOGRAFAR QUARTO DOS SONHOS! (+140 🏠)</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('room-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const roomMsg = document.getElementById('room-msg');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('roomdecor', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = `${bestScore} 🏠`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 640) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.08, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.14);
            } catch (e) {}
        }

        const WALLS = ['#fbcfe8', '#e9d5ff', '#bae6fd', '#fef08a', '#fecdd3', '#312e81'];
        const BEDS = ['#ec4899', '#a855f7', '#38bdf8', '#f43f5e', '#10b981', '#eab308'];
        const RUGS = ['#fdf2f8', '#f472b6', '#c084fc', '#fde047', '#67e8f9'];
        const PLUSHIES = ['🧸', '🦄', '🐱', '🐰', '🎀', '👑'];
        const DECORS = ['🌟', '🦋', '🌸', '🪞', '🪴', '🎮'];

        let room = {
            wall: '#fbcfe8',
            bed: '#ec4899',
            rug: '#f472b6',
            plush: '🦄',
            decor: '🌟',
            sparkles: []
        };
        let score = 0;
        let t = 0;

        function buildMenu() {
            const wRow = document.getElementById('row-wall');
            WALLS.forEach(w => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.style.background = w;
                b.onclick = () => { room.wall = w; sfx(520); };
                wRow.appendChild(b);
            });

            const bRow = document.getElementById('row-bed');
            BEDS.forEach(c => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.style.background = c;
                b.onclick = () => { room.bed = c; sfx(600); };
                bRow.appendChild(b);
            });

            const rRow = document.getElementById('row-rug');
            RUGS.forEach(r => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.style.background = r;
                b.onclick = () => { room.rug = r; sfx(680); };
                rRow.appendChild(b);
            });

            const pRow = document.getElementById('row-plush');
            PLUSHIES.forEach(p => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = p;
                b.onclick = () => { room.plush = p; sfx(740); };
                pRow.appendChild(b);
            });

            const dRow = document.getElementById('row-decor');
            DECORS.forEach(d => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = d;
                b.onclick = () => { room.decor = d; sfx(810); };
                dRow.appendChild(b);
            });
        }

        document.getElementById('btn-save-room').onclick = () => {
            score += 140;
            sfx(900);
            hudScore.innerText = `${score} 🏠`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = `${bestScore} 🏠`;
                SaveHub.updateGameSave('roomdecor', { highScore: bestScore }, playerName);
            }
            for (let i = 0; i < 16; i++) {
                room.sparkles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vy: -1.2 - Math.random(),
                    life: 55
                });
            }
            roomMsg.innerText = '✨ QUARTO DE PRINCESA APROVADO NA REVISTA! +140 🏠';
        };

        function drawRoom() {
            t += 0.05;

            // Wall
            ctx.fillStyle = room.wall;
            ctx.fillRect(0, 0, W, 310);

            // Wallpaper subtle stripes
            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            for (let x = 20; x < W; x += 40) {
                ctx.fillRect(x, 0, 12, 310);
            }

            // Wooden Floor
            ctx.fillStyle = '#9d5b4c';
            ctx.fillRect(0, 310, W, H - 310);
            ctx.fillStyle = '#fbcfe8';
            ctx.fillRect(0, 304, W, 8);

            // Fairy Lights Garland on Top
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 28);
            ctx.quadraticCurveTo(W / 2, 75, W, 28);
            ctx.stroke();

            for (let lx = 35; lx < W; lx += 45) {
                const ly = 28 + Math.sin((lx / W) * Math.PI) * 24;
                const glow = 0.6 + Math.sin(t + lx) * 0.4;
                ctx.fillStyle = `rgba(254, 240, 138, ${glow})`;
                ctx.beginPath();
                ctx.arc(lx, ly, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            // Window with Starry Sky / Clouds
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(45, 75, 110, 130);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(45, 75, 110, 130);
            ctx.font = '28px serif';
            ctx.textAlign = 'center';
            ctx.fillText('☁️', 82, 125);
            ctx.fillText('🌈', 120, 170);

            // Wall Decor Frame
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(320, 85, 92, 92);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 4;
            ctx.strokeRect(320, 85, 92, 92);
            ctx.font = '44px serif';
            ctx.fillText(room.decor, 366, 146);

            // Fluffy Heart/Oval Rug
            ctx.fillStyle = room.rug;
            ctx.beginPath();
            ctx.ellipse(W / 2, 395, 155, 42, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Princess Canopy / Headboard
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(W / 2, 165, 85, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(W / 2 - 90, 165, 180, 75);

            // Pillows
            ctx.fillStyle = '#fdf2f8';
            ctx.beginPath();
            ctx.roundRect(W / 2 - 75, 200, 65, 36, 12);
            ctx.roundRect(W / 2 + 10, 200, 65, 36, 12);
            ctx.fill();

            // Bed Duvet / Mattress
            ctx.fillStyle = room.bed;
            ctx.beginPath();
            ctx.roundRect(W / 2 - 98, 232, 196, 105, 18);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Cute Plushie on the bed
            ctx.font = '56px serif';
            ctx.fillText(room.plush, W / 2, 295);

            // Sparkles
            for (let i = room.sparkles.length - 1; i >= 0; i--) {
                const s = room.sparkles[i];
                s.y += s.vy;
                s.life--;
                ctx.font = '24px serif';
                ctx.fillText('✨', s.x, s.y);
                if (s.life <= 0) room.sparkles.splice(i, 1);
            }

            requestAnimationFrame(drawRoom);
        }

        buildMenu();
        drawRoom();
    </script>
</body>
</html>
