<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miyu Keisuke: Ecos Flamejantes</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #090910;
      --foreground: #e0e0e0;
      --card: #12121d;
      --border: #2a2a40;
      --muted-foreground: #8a8a9f;
    }
    body { background-color: var(--background); color: var(--foreground); overflow-x: hidden; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Vignette Overlays */
    #vignette-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 50; transition: all 1s ease-in-out; opacity: 0; }
    .vignette-danger { box-shadow: inset 0 0 150px rgba(150, 0, 0, 0.8); opacity: 1 !important; animation: heartbeat 1.5s infinite; }
    .vignette-dark { box-shadow: inset 0 0 200px rgba(0, 0, 0, 1); opacity: 1 !important; }
    @keyframes heartbeat { 0%, 100% { box-shadow: inset 0 0 100px rgba(150, 0, 0, 0.5); } 50% { box-shadow: inset 0 0 180px rgba(180, 0, 0, 0.9); } }

    /* Animações Base */
    .fade-in { animation: fadeIn 0.8s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-in { opacity: 0; animation: slideUpFade 0.5s ease forwards; }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.02); filter: brightness(1.1); } }
    .breathe-anim { animation: breathe 6s infinite ease-in-out; }
    @keyframes shake-hard { 0%, 100% { transform: translate(0, 0) rotate(0deg); filter: blur(0px); } 10%, 30%, 50%, 70%, 90% { transform: translate(-8px, -8px) rotate(-2deg); filter: blur(1px); } 20%, 40%, 60%, 80% { transform: translate(8px, 8px) rotate(2deg); } }
    .shake-anim { animation: shake-hard 0.4s cubic-bezier(.36,.07,.19,.97); }
    @keyframes glitch-skew { 0%, 60%, 100% { transform: skew(0deg); filter: none; } 20% { transform: skew(-10deg); filter: hue-rotate(90deg) contrast(2); } 40% { transform: skew(10deg); filter: hue-rotate(-90deg) contrast(0.5); } }
    .flicker-anim { animation: glitch-skew 0.3s infinite alternate; }
    @keyframes fire-glow-intense { 0%, 100% { box-shadow: 0 0 20px #ff4500, inset 0 0 20px #ff4500; border-color: #ff4500; filter: contrast(1.1) brightness(1.2); } 50% { box-shadow: 0 0 60px #ff8c00, inset 0 0 40px #ff8c00; border-color: #ff8c00; filter: contrast(1.2) brightness(1.4); } }
    .fire-anim { animation: fire-glow-intense 1s infinite; border: 2px solid #ff4500; }
    @keyframes aura-glow-soft { 0%, 100% { box-shadow: 0 0 15px #a200ff, inset 0 0 15px #a200ff; border-color: #a200ff; filter: hue-rotate(0deg); } 50% { box-shadow: 0 0 50px #d896ff, inset 0 0 30px #d896ff; border-color: #d896ff; filter: hue-rotate(20deg); } }
    .aura-anim { animation: aura-glow-soft 3s infinite ease-in-out; border: 2px solid #a200ff; }
    .typing-cursor::after { content: ' ▼'; animation: blink 1s infinite; color: #a200ff; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Aparição suave (Fourth Wall Break) */
    @keyframes appear-smooth-anim {
      0% { transform: scale(0.95) translateY(10px); filter: blur(10px) brightness(0.2); opacity: 0; }
      100% { transform: scale(1.05) translateY(0px); filter: blur(0px) brightness(1) drop-shadow(0 0 20px rgba(162,0,255,0.4)); opacity: 1; }
    }
    .appear-smooth #scene-img {
      animation: appear-smooth-anim 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      mix-blend-mode: screen;
    }

    /* Modal de Seleção de Personagem */
    .char-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .char-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 30px -10px rgba(168, 85, 247, 0.4);
    }
    .char-card.selected {
      border-color: #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>
<body id="main-body" class="antialiased p-4 min-h-screen flex flex-col items-center relative">

  </div>

  <!-- MODAL: SELEÇÃO DE PERSONAGENS -->
  <div id="char-select-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-[#131224] border-2 border-purple-500/60 rounded-2xl max-w-4xl w-full p-6 shadow-[0_0_50px_rgba(168,85,247,0.3)] max-h-[92vh] overflow-y-auto">

      </div>

      </div>

      <!-- Botão Fechar se já tiver personagem selecionado -->

      "artisan_tool": {
        "text": "Você golpeia com determinação, mas o metal comum atravessa o corpo amorfo do monstro sem feri-lo!\nA criatura sorri em trevas e a envolve num abraço gélido...\n\n[ FINAL RUIM - Arte Inacabada ]",
        "image": "monster.jpg",
        "anim": "flicker",
        "choices": [{ text: "Tentar Novamente", next: "restart" }]
      },
      "panic_fire": {
        "text": "O pânico toma conta! Uma explosão de chamas descontroladas consome o beco inteiro.\nA besta é aniquilada, mas a fumaça tóxica asfixia o ambiente e você perde a consciência...\n\n[ FINAL RUIM - Chamas do Pânico ]",
        "image": "alley.jpg",
        "anim": "fire",
        "vignette": "danger",
        "choices": [{ text: "Jogar Novamente", next: "restart" }]
      },
      "restart": {
        "text": "Rebobinando o tempo de Tóquio...",
        "image": null,
        "anim": "flicker",
        "clear_inventory": true,
        "choices": [{ text: "Recomeçar a História", next: "start" }]
      }
    };

    // ==========================================
    // CONTROLE DE INTERFACE E MODAL
    // ==========================================
    function renderCharCards() {
      const container = document.getElementById("char-cards-grid");
      container.innerHTML = "";

      characters.forEach(char => {
        const isSelected = (char.id === currentCharacter.id);
        const card = document.createElement("div");
        card.className = `char-card bg-[#1a1930] border-2 ${isSelected ? 'border-purple-400 bg-purple-950/30' : 'border-[#333252]'} rounded-xl p-4 flex flex-col justify-between cursor-pointer hover:border-purple-400`;
        
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-3 mb-3">
              <img src="${char.avatar}" alt="${char.name}" class="w-16 h-16 rounded-xl object-cover border-2 border-purple-500 shadow-md">
              <div>
                <h3 class="font-black text-lg text-white">${char.name}</h3>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-gradient-to-r ${char.themeColor} text-white font-bold">${char.badge}</span>
                <p class="text-xs text-purple-300/80 mt-1">${char.title}</p>
              </div>
            </div>
            
            <p class="text-xs italic text-gray-400 mb-2">${char.quote}</p>
            <p class="text-xs text-gray-300 leading-relaxed mb-3">${char.quirk}</p>

            <div class="mb-3">
              <span class="text-[10px] uppercase font-bold text-purple-400 tracking-wider">Itens Iniciais:</span>
              <div class="flex flex-wrap gap-1 mt-1">
                ${char.starterItems.map(item => `<span class="bg-black/50 text-purple-200 border border-purple-800/80 text-[11px] px-2 py-0.5 rounded-md font-semibold">${item}</span>`).join('')}
              </div>
            </div>
          </div>

          <button class="w-full mt-2 py-2 px-4 rounded-lg font-bold text-xs uppercase tracking-wider transition-all ${isSelected ? 'bg-purple-600 text-white cursor-default' : 'bg-gray-800 hover:bg-purple-600 text-gray-200 hover:text-white'}">
            ${isSelected ? '✓ Selecionado' : 'Jogar com este Personagem'}
          </button>
        `;

        card.onclick = () => {
          selectCharacter(char);
          closeCharSelectModal();
        };

        container.appendChild(card);
      });
    }

    function selectCharacter(char) {
      currentCharacter = char;
      localStorage.setItem('selected_miyu_char', char.id);
      
      // Atualizar HUD
      document.getElementById("hud-char-name").innerText = char.name;
      document.getElementById("hud-char-title").innerText = char.title;
      document.getElementById("hud-char-badge").innerText = char.badge;
      document.getElementById("hud-char-avatar").src = char.avatar;

      // Resetar inventário com os itens iniciais do personagem
      inventory = [...char.starterItems];
      updateInventory();

      // Recomeçar a história com a introdução do personagem
      renderNode("start");
    }

    function openCharSelectModal() {
      renderCharCards();
      const modal = document.getElementById("char-select-modal");
      modal.classList.remove("opacity-0", "pointer-events-none");
      modal.classList.add("opacity-100");
    }

    function closeCharSelectModal() {
      const modal = document.getElementById("char-select-modal");
      modal.classList.remove("opacity-100");
      modal.classList.add("opacity-0", "pointer-events-none");
    }

    function updateInventory() {
      const invDiv = document.getElementById("inventory-list");
      if (inventory.length === 0) {
        invDiv.innerHTML = '<span class="italic opacity-50">Vazio</span>';
      } else {
        invDiv.innerHTML = inventory.map(item => `
          <span class="bg-gradient-to-r from-purple-900 to-indigo-900 text-purple-200 text-xs font-bold px-2.5 py-0.5 rounded-full border border-purple-500/70 shadow-sm">${item}</span>
        `).join('');
      }
    }

    function typeText(text, element, callback) {
        clearTimeout(typingTimeout);
        element.innerHTML = '';
        element.classList.add('typing-cursor');
        let i = 0;
        function type() {
            if (i < text.length) {
                element.innerHTML = text.substring(0, i + 1).replace(/\n/g, '<br>');
                i++;
                let speed = 20 + Math.random() * 15; 
                if (text.charAt(i) === '.' || text.charAt(i) === '!' || text.charAt(i) === '?') speed = 250;
                typingTimeout = setTimeout(type, speed);
            } else {
                element.classList.remove('typing-cursor');
                if (callback) callback();
            }
        }
        type();
    }

    function renderNode(nodeId) {
      const node = story[nodeId];
      if (!node) return;

      if (node.clear_inventory) {
        inventory = [...currentCharacter.starterItems];
      }
      if (node.give_item && !inventory.includes(node.give_item)) {
        inventory.push(node.give_item);
      }
      updateInventory();

      const textEl = document.getElementById("story-text");
      const choicesEl = document.getElementById("choices-container");
      const imgEl = document.getElementById("scene-img");
      const wrapperEl = document.getElementById("image-wrapper");
      const bodyEl = document.getElementById("main-body");
      const vignetteEl = document.getElementById("vignette-overlay");

      // Reset
      imgEl.className = "max-h-[450px] w-full object-cover object-top transition-all duration-1000";
      wrapperEl.className = "w-full flex justify-center bg-black rounded-xl overflow-hidden relative min-h-[350px] border-2 border-transparent transition-all duration-500 shadow-[0_0_20px_rgba(0,0,0,0.8)] bg-cover bg-center";
      bodyEl.className = "antialiased p-4 min-h-screen flex flex-col items-center relative transition-all duration-500";
      vignetteEl.className = "";
      choicesEl.innerHTML = ''; 

      // Fundo personalizado se houver
      if (node.bg) {
          wrapperEl.style.backgroundImage = `url(${node.bg})`;
      } else {
          wrapperEl.style.backgroundImage = "none";
      }

      // Imagem da cena ou portrait do personagem ativo
      let targetImage = node.image || currentCharacter.portrait;
      if (!imgEl.src.includes(targetImage)) {
          imgEl.src = targetImage;
          imgEl.classList.add("fade-in");
      }

      // Animações
      if (node.anim === "shake") { bodyEl.classList.add("shake-anim"); imgEl.classList.add("scale-105"); }
      else if (node.anim === "fire") { wrapperEl.classList.add("fire-anim"); imgEl.classList.add("scale-105"); }
      else if (node.anim === "aura") { wrapperEl.classList.add("aura-anim"); }
      else if (node.anim === "flicker") { bodyEl.classList.add("flicker-anim"); }
      else if (node.anim === "breathe") { imgEl.classList.add("breathe-anim"); }
      else if (node.anim === "appear-smooth") { wrapperEl.classList.add("appear-smooth"); }

      // Vignette
      if (node.vignette === "danger") vignetteEl.className = "vignette-danger";
      else if (node.vignette === "dark") vignetteEl.className = "vignette-dark";

      // Texto específico de início para o personagem
      let displayText = node.text;
      if (nodeId === "start") {
        displayText = currentCharacter.introText;
      }

      // Contagem de finais no Hub
      if (displayText.includes("FINAL")) {
        if (displayText.includes("BOM") || displayText.includes("SECRETO")) {
            const currentStats = localStorage.getItem('stat_miyu_endings') || 0;
            localStorage.setItem('stat_miyu_endings', parseInt(currentStats) + 1);
        }
      }

      typeText(displayText, textEl, () => {
          node.choices.forEach((choice, index) => {
            // Filtrar escolhas exclusivas de personagem
            if (choice.requiresChar && choice.requiresChar !== currentCharacter.id) {
              return;
            }
            // Filtrar escolhas que requerem item
            if (choice.requires && !inventory.includes(choice.requires)) {
              return;
            }

            const btn = document.createElement("button");
            btn.className = "w-full text-left bg-[var(--card)] hover:bg-[#201f3d] text-[#00ff88] hover:text-[#d896ff] font-semibold py-3 px-6 border-l-4 border-[var(--border)] hover:border-[#d896ff] rounded-r-lg transition-all duration-300 transform hover:translate-x-2 shadow-md stagger-in";
            btn.style.animationDelay = `${index * 0.1}s`; 
            
            let btnLabel = choice.text;
            if (choice.requires) {
              btnLabel = `🔒 [Requer: ${choice.requires}] ` + btnLabel;
            }
            btn.innerText = btnLabel;
            
            btn.onclick = () => {
              if (choice.next === "restart" && nodeId === "restart") {
                renderNode("start");
              } else {
                renderNode(choice.next);
              }
            };
            choicesEl.appendChild(btn);
          });
      });
    }

    // Inicialização da Página
    window.onload = () => {
      const savedCharId = localStorage.getItem('selected_miyu_char');
      if (savedCharId) {
        const found = characters.find(c => c.id === savedCharId);
        if (found) currentCharacter = found;
      }
      selectCharacter(currentCharacter);
    };
  </script>
</body>
</html>
