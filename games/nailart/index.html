<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Princess Nail Art: Estúdio de Unhas 💅💎 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #500724 0%, #19020b 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #f472b6;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #f472b6;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }
        .nail-studio {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 720px) {
            .nail-studio { grid-template-columns: 1fr; }
        }
        .hand-stage {
            background: linear-gradient(180deg, #3b0764, #240418);
            border: 3px solid #f472b6;
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            cursor: pointer;
        }
        .tools-panel {
            background: rgba(35, 6, 25, 0.9);
            border: 3px solid #fb7185;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .label { font-family: 'Fredoka', sans-serif; color: #fecdd3; font-size: 0.9rem; margin-bottom: 6px; }
        .polish-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .polish-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        .polish-btn.active { border-color: #fde047; transform: scale(1.12); box-shadow: 0 0 12px #fde047; }
        .btn-finish {
            margin-top: auto;
            background: linear-gradient(135deg, #f43f5e, #fde047);
            color: #1f0410;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div style="display:flex; gap:8px;">
            <div class="stat-pill">PONTOS: <strong id="hud-score">0 💅</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0 💅</strong></div>
        </div>
    </div>

    <div class="nail-studio">
        <div class="hand-stage">
            <canvas id="nail-canvas" width="460" height="460"></canvas>
            <p id="nail-msg" style="margin-top:8px; font-family:'Fredoka',sans-serif; color:#fde047; text-align:center;">
                Toque em cada unha na tela para pintar e colar joias! 💎
            </p>
        </div>

        <div class="tools-panel">
            <div>
                <div class="label">💅 ESCOLHA O ESMALTE NEON / PASTEL:</div>
                <div class="polish-row" id="row-polish"></div>
            </div>
            <div>
                <div class="label">💎 JOIAS & ADESIVOS DE UNHA:</div>
                <div class="polish-row" id="row-gems"></div>
            </div>
            <div>
                <div class="label">💍 ANEL DE PRINCESA:</div>
                <div class="polish-row" id="row-rings"></div>
            </div>
            <button class="btn-finish" id="btn-all">✨ PINTAR TODAS E ENTREGAR CLIENTE! 💖</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('nail-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const nailMsg = document.getElementById('nail-msg');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('nailart', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = `${bestScore} 💅`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 660) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.09, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        const COLORS = ['#ec4899', '#f43f5e', '#a855f7', '#38bdf8', '#34d399', '#fde047', '#fb923c', '#f472b6'];
        const GEMS = ['', '💎', '⭐', '💖', '🌸', '🦋', '👑'];
        const RINGS = ['💍', '👑', '🌸', '💎'];

        let activeColor = COLORS[0];
        let activeGem = '💎';
        let activeRing = '💍';
        let score = 0;

        const nails = [
            { x: 92, y: 215, w: 38, h: 62, color: '#ec4899', gem: '💎' },
            { x: 162, y: 145, w: 42, h: 72, color: '#a855f7', gem: '⭐' },
            { x: 235, y: 125, w: 44, h: 76, color: '#ec4899', gem: '💖' },
            { x: 308, y: 148, w: 42, h: 72, color: '#a855f7', gem: '🌸' },
            { x: 375, y: 225, w: 38, h: 60, color: '#ec4899', gem: '💎' }
        ];

        function renderTools() {
            const pRow = document.getElementById('row-polish');
            pRow.innerHTML = '';
            COLORS.forEach(c => {
                const b = document.createElement('div');
                b.className = 'polish-btn' + (activeColor === c ? ' active' : '');
                b.style.background = c;
                b.addEventListener('click', () => { activeColor = c; sfx(580); renderTools(); });
                pRow.appendChild(b);
            });

            const gRow = document.getElementById('row-gems');
            gRow.innerHTML = '';
            GEMS.forEach(g => {
                const b = document.createElement('div');
                b.className = 'polish-btn' + (activeGem === g ? ' active' : '');
                b.style.background = 'rgba(255,255,255,0.12)';
                b.innerText = g || '🚫';
                b.addEventListener('click', () => { activeGem = g; sfx(680); renderTools(); });
                gRow.appendChild(b);
            });

            const rRow = document.getElementById('row-rings');
            rRow.innerHTML = '';
            RINGS.forEach(r => {
                const b = document.createElement('div');
                b.className = 'polish-btn' + (activeRing === r ? ' active' : '');
                b.style.background = 'rgba(255,255,255,0.12)';
                b.innerText = r;
                b.addEventListener('click', () => { activeRing = r; sfx(740); renderTools(); });
                rRow.appendChild(b);
            });
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const my = ((e.clientY - rect.top) / rect.height) * H;

            for (const n of nails) {
                if (Math.hypot(mx - n.x, my - n.y) < 46) {
                    n.color = activeColor;
                    n.gem = activeGem;
                    score += 30;
                    sfx(720);
                    updateScore();
                    break;
                }
            }
        });

        document.getElementById('btn-all').addEventListener('click', () => {
            nails.forEach(n => { n.color = activeColor; n.gem = activeGem; });
            score += 150;
            sfx(880);
            updateScore();
            nailMsg.innerText = `💖 CLIENTE ENCANTADA! +150 PTS!`;
        });

        function updateScore() {
            hudScore.innerText = `${score} 💅`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = `${bestScore} 💅`;
                SaveHub.updateGameSave('nailart', { highScore: bestScore }, playerName);
            }
        }

        function draw() {
            ctx.fillStyle = '#260517';
            ctx.fillRect(0, 0, W, H);

            // Fingers & Hand
            for (const n of nails) {
                ctx.fillStyle = '#fed7aa';
                ctx.beginPath();
                ctx.roundRect(n.x - 24, n.y, 48, 250, 24);
                ctx.fill();

                // Nail Plate
                ctx.save();
                ctx.fillStyle = n.color;
                ctx.shadowColor = n.color;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, 20);
                ctx.fill();

                // Gloss shine
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.beginPath();
                ctx.ellipse(n.x - 8, n.y - 10, 4, 16, 0, 0, Math.PI * 2);
                ctx.fill();

                if (n.gem) {
                    ctx.font = '22px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(n.gem, n.x, n.y + 8);
                }
                ctx.restore();
            }

            // Ring on ring finger
            ctx.font = '32px serif';
            ctx.textAlign = 'center';
            ctx.fillText(activeRing, nails[3].x, nails[3].y + 95);

            requestAnimationFrame(draw);
        }

        renderTools();
        draw();
    </script>
</body>
</html>
