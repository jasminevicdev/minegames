<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Sand Art: Garrafas de Areia Colorida ⏳🌈 — JasDEV Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #701a75 0%, #170324 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .topbar {
            width: 100%;
            max-width: 1040px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #fde047;
            color: #fff;
            padding: 7px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
        }
        .stat-pill {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #fde047;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .stat-pill strong { color: #fde047; font-family: 'Fredoka', sans-serif; }
        .sand-grid {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 14px;
        }
        @media (max-width: 820px) {
            .sand-grid { grid-template-columns: 1fr; }
        }
        .stage-box {
            background: rgba(24, 6, 42, 0.94);
            border: 3px solid #f472b6;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 36px rgba(244, 114, 182, 0.35);
        }
        canvas {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            background: #120421;
            cursor: crosshair;
            touch-action: none;
            image-rendering: pixelated;
            border: 3px solid rgba(255,255,255,0.25);
        }
        .menu-box {
            background: rgba(34, 8, 52, 0.95);
            border: 3px solid #fde047;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .label { font-family: 'Fredoka', sans-serif; color: #fef08a; font-size: 0.88rem; margin-bottom: 5px; }
        .row-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .sand-color {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.45);
            cursor: pointer;
        }
        .sand-color.active { border-color: #fde047; transform: scale(1.16); }
        .opt-btn {
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .opt-btn.active, .opt-btn:hover {
            border-color: #fde047;
            background: linear-gradient(135deg, #ec4899, #a855f7);
        }
        .btn-finish {
            margin-top: auto;
            background: linear-gradient(135deg, #fde047, #ec4899, #38bdf8);
            color: #1e052b;
            border: none;
            padding: 14px;
            border-radius: 28px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html" class="btn-back">⬅ VOLTAR AO HUB</a>
        <div style="display:flex; gap:8px;">
            <div class="stat-pill">ARTE EM AREIA: <strong id="hud-score">0 ⏳</strong></div>
            <div class="stat-pill">RECORDE: <strong id="hud-best">0 ⏳</strong></div>
        </div>
    </div>

    <div class="sand-grid">
        <div class="stage-box">
            <canvas id="sand-canvas" width="120" height="120"></canvas>
            <p id="sand-msg" style="margin-top:8px; font-family:'Fredoka',sans-serif; color:#fde047; text-align:center;">
                Segure e arraste na tela para despejar areia mágica colorida que empilha de verdade! ⏳🌈
            </p>
        </div>

        <div class="menu-box">
            <div>
                <div class="label">🌈 MODO DE AREIA MÁGICA:</div>
                <div class="row-wrap">
                    <button class="opt-btn active" id="btn-rainbow">🌈 Areia Arco-Íris Automática</button>
                </div>
            </div>

            <div>
                <div class="label">🎨 CORES DE AREIA PURA:</div>
                <div class="row-wrap" id="sand-palette"></div>
            </div>

            <div>
                <div class="label">✨ AÇÕES RÁPIDAS:</div>
                <div class="row-wrap">
                    <button class="opt-btn" id="btn-wave">🌊 Despejar Onda Real</button>
                    <button class="opt-btn" id="btn-clear">🗑️ Esvaziar Garrafa</button>
                </div>
            </div>

            <button class="btn-finish" id="btn-finish">🏆 LACRAR GARRAFA DE AREIA! (+150 ⏳)</button>
        </div>
    </div>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';

        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d');
        const GW = canvas.width;
        const GH = canvas.height;

        const hudScore = document.getElementById('hud-score');
        const hudBest = document.getElementById('hud-best');
        const sandMsg = document.getElementById('sand-msg');

        const activePlayer = SaveHub.getActivePlayer();
        const playerName = activePlayer ? activePlayer.name : null;
        let save = SaveHub.getGameSave('sandart', playerName);
        let bestScore = save.highScore || 0;
        hudBest.innerText = `${bestScore} ⏳`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(freq = 640) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.05, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        const COLORS = [
            '#ff2a85', '#f472b6', '#fbcfe8', '#c084fc',
            '#38bdf8', '#2dd4bf', '#4ade80', '#fde047',
            '#fb923c', '#ffffff'
        ];

        let grid = Array.from({ length: GH }, () => Array(GW).fill(null));
        let rainbow = true;
        let selectedCol = '#ff2a85';
        let hue = 0;
        let isPouring = false;
        let pourX = 60, pourY = 20;
        let score = 0;

        const pal = document.getElementById('sand-palette');
        COLORS.forEach(c => {
            const d = document.createElement('div');
            d.className = 'sand-color';
            d.style.background = c;
            d.onclick = () => {
                rainbow = false;
                document.getElementById('btn-rainbow').classList.remove('active');
                document.querySelectorAll('.sand-color').forEach(el => el.classList.remove('active'));
                d.classList.add('active');
                selectedCol = c;
                sfx(620);
            };
            pal.appendChild(d);
        });

        document.getElementById('btn-rainbow').onclick = (e) => {
            rainbow = true;
            e.target.classList.add('active');
            document.querySelectorAll('.sand-color').forEach(el => el.classList.remove('active'));
        };

        function updatePos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            pourX = Math.floor(((cx - rect.left) / rect.width) * GW);
            pourY = Math.floor(((cy - rect.top) / rect.height) * GH);
        }

        canvas.addEventListener('mousedown', (e) => { isPouring = true; updatePos(e); });
        canvas.addEventListener('mousemove', (e) => { if (isPouring) updatePos(e); });
        window.addEventListener('mouseup', () => { isPouring = false; });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isPouring = true; updatePos(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (isPouring) updatePos(e); }, { passive: false });
        window.addEventListener('touchend', () => { isPouring = false; });

        function spawnSandAt(cx, cy, radius = 3) {
            const col = rainbow ? `hsl(${(hue += 0.6) % 360}, 92%, 64%)` : selectedCol;
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (Math.random() < 0.65) {
                        const x = cx + dx;
                        const y = cy + dy;
                        if (x >= 2 && x < GW - 2 && y >= 2 && y < GH - 2 && !grid[y][x]) {
                            grid[y][x] = col;
                        }
                    }
                }
            }
        }

        function stepPhysics() {
            if (isPouring) {
                spawnSandAt(pourX, pourY, 3);
            }

            for (let y = GH - 2; y >= 0; y--) {
                for (let x = 1; x < GW - 1; x++) {
                    const c = grid[y][x];
                    if (!c) continue;
                    if (!grid[y + 1][x]) {
                        grid[y + 1][x] = c;
                        grid[y][x] = null;
                    } else {
                        const dir = Math.random() < 0.5 ? -1 : 1;
                        if (!grid[y + 1][x + dir]) {
                            grid[y + 1][x + dir] = c;
                            grid[y][x] = null;
                        } else if (!grid[y + 1][x - dir]) {
                            grid[y + 1][x - dir] = c;
                            grid[y][x] = null;
                        }
                    }
                }
            }

            ctx.fillStyle = '#120421';
            ctx.fillRect(0, 0, GW, GH);

            for (let y = 0; y < GH; y++) {
                for (let x = 0; x < GW; x++) {
                    if (grid[y][x]) {
                        ctx.fillStyle = grid[y][x];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            requestAnimationFrame(stepPhysics);
        }

        document.getElementById('btn-wave').onclick = () => {
            for (let x = 10; x < GW - 10; x += 4) {
                spawnSandAt(x, 12, 2);
            }
            sfx(780);
        };

        document.getElementById('btn-clear').onclick = () => {
            grid = Array.from({ length: GH }, () => Array(GW).fill(null));
            sfx(480);
        };

        document.getElementById('btn-finish').onclick = () => {
            score += 150;
            sfx(950);
            hudScore.innerText = `${score} ⏳`;
            if (score > bestScore) {
                bestScore = score;
                hudBest.innerText = `${bestScore} ⏳`;
                SaveHub.updateGameSave('sandart', { highScore: bestScore }, playerName);
            }
            sandMsg.innerText = '🏆 GARRAFA DE AREIA ARCO-ÍRIS SALVA! +150 ⏳';
        };

        document.getElementById('btn-wave').click();
        stepPhysics();
    </script>
</body>
</html>
