<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hoverboard Surfer — JasDEV Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #1e1b4b, #030712);
            color: #fff; font-family: 'Outfit', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .topbar {
            width: 100%; max-width: 960px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.06); border-bottom: 2px solid rgba(0,245,212,0.45);
        }
        .back-btn {
            text-decoration: none; color: #99f6e4; font-weight: 700;
            background: rgba(20,184,166,0.22); padding: 8px 16px; border-radius: 999px;
            border: 1px solid rgba(45,212,191,0.5);
        }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #2dd4bf; }
        .score-pill {
            background: linear-gradient(135deg, #00f5d4, #6366f1);
            padding: 7px 16px; border-radius: 999px; font-weight: 700; color: #04131c;
        }
        .arena { display: flex; flex-direction: column; align-items: center; padding: 14px; gap: 12px; }
        .hud {
            display: flex; gap: 18px; align-items: center; background: rgba(255,255,255,0.06);
            padding: 8px 18px; border-radius: 999px;
        }
        canvas {
            background: #060919; border: 3px solid #00f5d4; border-radius: 22px;
            box-shadow: 0 0 38px rgba(0,245,212,0.3); max-width: 100%; height: auto;
        }
        .btn {
            padding: 8px 18px; border-radius: 999px; border: none; font-weight: 700;
            background: linear-gradient(135deg, #00f5d4, #ec4899); color: #05101f; cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
        <h1>🛹 Cyber Hoverboard Surfer</h1>
        <div class="score-pill">Recorde: <span id="hiVal">0</span> PTS</div>
    </header>

    <main class="arena">
        <div class="hud">
            <span>Pontos: <strong id="scoreVal" style="color:#fde047;">0</strong></span>
            <button class="btn" id="leftBtn">⬅️ Pista Esq</button>
            <button class="btn" id="rightBtn">Pista Dir ➡️</button>
            <button class="btn" id="restartBtn">🔄 Reiniciar</button>
        </div>
        <canvas id="surfCanvas" width="460" height="520"></canvas>
    </main>

    <script type="module">
        import { SaveHub } from '../../shared/SaveHub.js';
        const playerObj = SaveHub.getActivePlayer();
        const activePlayer = (playerObj && playerObj.name) ? playerObj.name : null;
        const save = SaveHub.getGameSave('hoverboard', activePlayer);
        let bestScore = save?.highScore || 0;
        const hiEl = document.getElementById('hiVal');
        hiEl.textContent = bestScore;

        const canvas = document.getElementById('surfCanvas');
        const ctx = canvas.getContext('2d');
        const LANES = [110, 230, 350];

        let lane = 1;
        let score = 0;
        let alive = true;
        let items = [];
        let tick = 0;

        function reset() {
            lane = 1; score = 0; alive = true; items = [];
            document.getElementById('scoreVal').textContent = 0;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') lane = Math.max(0, lane - 1);
            if (e.key === 'ArrowRight' || e.key === 'd') lane = Math.min(2, lane + 1);
        });
        document.getElementById('leftBtn').addEventListener('click', () => { lane = Math.max(0, lane - 1); });
        document.getElementById('rightBtn').addEventListener('click', () => { lane = Math.min(2, lane + 1); });
        document.getElementById('restartBtn').addEventListener('click', reset);

        function loop() {
            tick++;
            ctx.fillStyle = '#060919';
            ctx.fillRect(0, 0, 460, 520);

            // 3 Synthwave Lanes
            LANES.forEach(x => {
                ctx.strokeStyle = 'rgba(0,245,212,0.28)';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 520); ctx.stroke();
            });

            if (alive && tick % 32 === 0) {
                const l = Math.floor(Math.random() * 3);
                const isGem = Math.random() > 0.42;
                items.push({ lane: l, y: -20, gem: isGem });
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                if (alive) it.y += 5.5;
                const x = LANES[it.lane];
                ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(it.gem ? '💎' : '🚧', x, it.y);

                if (alive && it.lane === lane && Math.abs(it.y - 445) < 32) {
                    if (it.gem) {
                        score += 50;
                        document.getElementById('scoreVal').textContent = score;
                        if (score > bestScore) {
                            bestScore = score;
                            hiEl.textContent = bestScore;
                            SaveHub.updateGameSave('hoverboard', { highScore: bestScore }, activePlayer);
                        }
                        items.splice(i, 1);
                    } else {
                        alive = false;
                    }
                } else if (it.y > 540) {
                    items.splice(i, 1);
                }
            }

            // Player Hoverboard
            ctx.font = '44px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(alive ? '🛹' : '💥', LANES[lane], 450);

            if (!alive) {
                ctx.fillStyle = 'rgba(0,0,0,0.72)';
                ctx.fillRect(0, 0, 460, 520);
                ctx.fillStyle = '#00f5d4';
                ctx.font = 'bold 26px Fredoka, sans-serif';
                ctx.fillText('FIM DE CORRIDA! Clique em Reiniciar', 230, 260);
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
